<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolsa do Autsim</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--bd:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ok:#2ecc71;--bad:#ff5c5c;--acc:#5865f2}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0}
main{max-width:900px;margin:0 auto;padding:16px}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me img{width:28px;height:28px;border-radius:50%}
button{font:inherit;border:0;border-radius:8px;padding:7px 12px;background:var(--bd);color:var(--tx);cursor:pointer}
button.p{background:var(--acc)}button.b{background:var(--ok);color:#06210f}button.s{background:var(--bad);color:#2b0505}
button:disabled{opacity:.4;cursor:not-allowed}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button.on{background:var(--acc)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:13px}
input{width:64px;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.up{color:var(--ok)}.dn{color:var(--bad)}.mut{color:var(--mut)}
.hero{text-align:center;padding:70px 10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;display:none;max-width:90%}
</style>
</head>
<body>
<header><h1>📈 Bolsa do Autsim</h1><div class="me" id="me"></div></header>
<main id="app"></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== CONFIGURAÇÃO: troque só a chave =====
const SUPABASE_URL = 'https://vyhhbepqikaizjyuogxk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_te15kBxoDWsrWci0NhVY3w_M8ZC38XB'; // chave "publishable" (nunca a secret!)
const BASE = 10; // preço inicial das ações
// ===========================================


const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const TYPES = {buy:'Compra', sell:'Venda', bonus:'Bônus', game:'Jogo', adjust:'Ajuste'};
let S = {user: null, tab: 'mercado', profiles: [], assets: [], holdings: [], tx: []};

const cur = () => S.profiles.find(p => p.id === S.user.id) || {balance: 0, username: '?'};
const price = id => Number(S.assets.find(a => a.id === id)?.price || 0);
const name = id => S.profiles.find(p => p.id === id)?.username || '?';
const held = (u, a) => S.holdings.find(h => h.user_id === u && h.asset_id === a)?.quantity || 0;
const sold = a => S.holdings.filter(h => h.asset_id === a).reduce((s, h) => s + h.quantity, 0);
const worth = u => Number(S.profiles.find(p => p.id === u)?.balance || 0) +
  S.holdings.filter(h => h.user_id === u).reduce((s, h) => s + h.quantity * price(h.asset_id), 0);
const table = (head, rows) => `<div class="tbl"><table><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows || '<tr><td colspan="9" class="mut">Nada por aqui ainda.</td></tr>'}</table></div>`;

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000);
}

async function load() {
  if (!S.user) return;
  const [p, a, h, t] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('assets').select('*'),
    sb.from('holdings').select('*'),
    sb.from('transactions').select('*').eq('user_id', S.user.id).order('created_at', {ascending: false}).limit(50)
  ]);
  if (p.error) toast('Erro ao carregar: ' + p.error.message);
  S.profiles = p.data || []; S.assets = a.data || []; S.holdings = h.data || []; S.tx = t.data || [];
  render();
}

function mercado() {
  const rows = S.assets.slice().sort((a, b) => b.price - a.price).map(a => {
    const self = a.id === S.user.id, v = (a.price / BASE - 1) * 100;
    const own = held(S.user.id, a.id), free = a.total_shares - sold(a.id);
    const acts = self ? '<span class="mut">—</span>' :
      `<input type="number" min="1" value="1" id="q-${a.id}"> <button class="b" data-act="buy_shares" data-id="${a.id}">Comprar</button> <button class="s" data-act="sell_shares" data-id="${a.id}" ${own ? '' : 'disabled'}>Vender</button>`;
    return `<tr><td>${esc(a.name)}${self ? ' <span class="mut">(você)</span>' : ''}</td><td>${fmt(a.price)}</td><td class="${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</td><td>${free}</td><td>${own}</td><td>${acts}</td></tr>`;
  }).join('');
  return table(['Ação', 'Preço', 'Var.', 'Livres', 'Você tem', ''], rows);
}

function carteira() {
  const mine = S.holdings.filter(h => h.user_id === S.user.id);
  const tot = mine.reduce((s, h) => s + h.quantity * price(h.asset_id), 0);
  return `<p>Saldo: <b>${fmt(cur().balance)}</b> · Em ações: <b>${fmt(tot)}</b></p>` +
    table(['Ação', 'Qtd', 'Preço', 'Valor'], mine.map(h => `<tr><td>${esc(name(h.asset_id))}</td><td>${h.quantity}</td><td>${fmt(price(h.asset_id))}</td><td>${fmt(h.quantity * price(h.asset_id))}</td></tr>`).join(''));
}

function ranking() {
  return table(['#', 'Membro', 'Patrimônio'], S.profiles.map(p => ({p, w: worth(p.id)})).sort((a, b) => b.w - a.w)
    .map((x, i) => `<tr><td>${i + 1}º</td><td>${esc(x.p.username)}</td><td>${fmt(x.w)}</td></tr>`).join(''));
}

function extrato() {
  return table(['Data', 'Tipo', 'Ação', 'Qtd', 'Valor', 'Saldo'], S.tx.map(t =>
    `<tr><td>${new Date(t.created_at).toLocaleString('pt-BR')}</td><td>${TYPES[t.type] || esc(t.type)}</td><td>${t.asset_id ? esc(name(t.asset_id)) : '—'}</td><td>${t.quantity ?? '—'}</td><td class="${t.amount >= 0 ? 'up' : 'dn'}">${fmt(t.amount)}</td><td>${fmt(t.balance_after)}</td></tr>`).join(''));
}

function render() {
  if (!S.user) {
    $('#me').innerHTML = '';
    $('#app').innerHTML = '<div class="hero"><h2>Bolsa de Valores do Autsim</h2><p class="mut">Compre e venda ações dos membros do servidor com AutsimCoins.</p><button class="p" id="login">Entrar com Discord</button></div>';
    return;
  }
  const m = cur();
  $('#me').innerHTML = `${m.avatar_url ? `<img src="${esc(m.avatar_url)}" alt="">` : ''}<span>${esc(m.username)}</span><b>🪙 ${fmt(m.balance)}</b><button id="out">Sair</button>`;
  const tabs = {mercado: 'Mercado', carteira: 'Carteira', ranking: 'Ranking', extrato: 'Extrato'};
  $('#app').innerHTML = `<nav>${Object.entries(tabs).map(([k, v]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${v}</button>`).join('')}</nav>` + ({mercado, carteira, ranking, extrato}[S.tab])();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'login') return sb.auth.signInWithOAuth({provider: 'discord', options: {redirectTo: location.origin}});
  if (b.id === 'out') return sb.auth.signOut();
  if (b.dataset.tab) { S.tab = b.dataset.tab; return render(); }
  if (b.dataset.act) {
    const q = parseInt($('#q-' + b.dataset.id).value, 10);
    b.disabled = true;
    const {data, error} = await sb.rpc(b.dataset.act, {p_asset_id: b.dataset.id, p_qty: q});
    if (error) toast(error.message);
    else toast(b.dataset.act === 'buy_shares' ? `Comprou por ${fmt(data.cost)} 🪙` : `Vendeu por ${fmt(data.proceeds)} 🪙`);
    await load();
  }
});

sb.auth.onAuthStateChange((_e, session) => {
  S.user = session?.user || null;
  setTimeout(() => S.user ? load() : render(), 0);
});

// Preços atualizam ao vivo (sem interromper quem está digitando)
sb.channel('assets').on('postgres_changes', {event: '*', schema: 'public', table: 'assets'}, () => {
  if (S.user && document.activeElement?.tagName !== 'INPUT') load();
}).subscribe();
</script>
</body>
</html>
