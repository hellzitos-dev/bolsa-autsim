function rlBuildWheel(R,dpr){
  const pad=4,sz=Math.ceil((R*2+pad*2)*dpr),cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const cx=R+pad,cy=R+pad,N=37,step=Math.PI*2/N;
  const rim=c.createRadialGradient(cx,cy,R*.9,cx,cy,R);rim.addColorStop(0,'#3a2d73');rim.addColorStop(1,'#120d2e');
  c.beginPath();c.arc(cx,cy,R,0,7);c.fillStyle=rim;c.fill();c.lineWidth=2;c.strokeStyle='#5b49b0';c.stroke();
  for(let i=0;i<N;i++){
    const n=WHEEL[i],a0=i*step-step/2-Math.PI/2,a1=a0+step;
    c.beginPath();c.moveTo(cx+Math.cos(a0)*R*.62,cy+Math.sin(a0)*R*.62);c.arc(cx,cy,R*.88,a0,a1);c.arc(cx,cy,R*.62,a1,a0,true);c.closePath();
    c.fillStyle=n===0?'#17a05d':REDS.has(n)?'#d8344d':'#1a1830';c.fill();c.strokeStyle='#8f7be0';c.lineWidth=.8;c.stroke();
    const am=a0+step/2;c.save();c.translate(cx+Math.cos(am)*R*.8,cy+Math.sin(am)*R*.8);c.rotate(am+Math.PI/2);
    c.fillStyle='#f3f0ff';c.font=`700 ${Math.max(9,R*.075)}px Inter,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(n,0,0);c.restore();
  }
  c.beginPath();c.arc(cx,cy,R*.6,0,7);const hub=c.createRadialGradient(cx,cy,0,cx,cy,R*.6);hub.addColorStop(0,'#2a2158');hub.addColorStop(1,'#0e0a24');c.fillStyle=hub;c.fill();c.strokeStyle='#5b49b0';c.lineWidth=2;c.stroke();
  return cv;
}
function rlFrame(ts){
  if(!CAS.running||CAS.tab!=='roleta')return;
  CAS.raf=requestAnimationFrame(rlFrame);
  if(isLite()&&ts-(CAS.rl.lastT||0)<40)return;CAS.rl.lastT=ts;
  const cv=$('#rlcv');if(!cv)return;
  const dpr=Math.min(isLite()?1:2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,N=37,step=Math.PI*2/N,now=srvNow(),st=CAS.rl.st,r=st&&st.round;
  const wa=((now/1000)*0.32)%(Math.PI*2); // reduzido a uma volta: ângulos enormes quebram o arc() do canvas
  // aro, casas e miolo ficam num desenho guardado; a cada quadro só gira
  const ck=Math.round(R)+'|'+dpr;
  if(!CAS.rl.cache||CAS.rl.cache.key!==ck)CAS.rl.cache={key:ck,cv:rlBuildWheel(R,dpr)};
  c.save();c.translate(cx,cy);c.rotate(wa);c.drawImage(CAS.rl.cache.cv,-R-4,-R-4,R*2+8,R*2+8);c.restore();
  // texto central
  c.textAlign='center';c.textBaseline='middle';
  if(r&&(r.status==='settled'||(r.status==='spinning'&&now>=Date.parse(r.spin_ends_at)))&&r.result_number!==null){
    c.beginPath();c.arc(cx,cy,R*.3,0,7);c.fillStyle=r.result_color==='red'?'#d8344d':r.result_color==='green'?'#17a05d':'#26224a';c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
    c.fillStyle='#fff';c.font=`800 ${R*.26}px 'Bricolage Grotesque',sans-serif`;c.fillText(r.result_number,cx,cy+2);
  }else if(r&&r.status==='betting'){
    c.fillStyle='#f3f0ff';
    if(r.betting_ends_at){const left=Math.max(0,Math.ceil((Date.parse(r.betting_ends_at)-now)/1000));c.font=`800 ${R*.34}px 'Bricolage Grotesque',sans-serif`;c.fillText(left,cx,cy);c.font=`600 ${R*.075}px sans-serif`;c.fillStyle='#a8a3d1';c.fillText('apostas fecham',cx,cy+R*.26);
      if(left!==CAS.rl.lastTick&&left<=5&&left>0){CAS.rl.lastTick=left;SFX.play('tick')}}
    else{c.font=`${R*.3}px serif`;c.fillText('🎰',cx,cy)}
  }else if(r){c.fillStyle='#a8a3d1';c.font=`700 ${R*.12}px sans-serif`;c.fillText('girando…',cx,cy)}
  // bola
  let ang,rad,show=true;
  if(!r||r.status==='betting'){ang=-(now/1000)*0.9;rad=R*.935}
  else if(r.result_number!==null&&r.result_number!==undefined){
    const idx=WHEEL.indexOf(r.result_number),spinEnd=Date.parse(r.spin_ends_at),p=clamp(1-(spinEnd-now)/8000,0,1);
    const rel=idx*step-Math.PI/2,D=Math.PI*2*8,e=ease.out5(p);
    ang=wa+rel+D*(1-e);rad=R*(.935-.2*ease.out3(clamp((p-.55)/.45,0,1)));
  }else show=false;
  if(show){const bx=cx+Math.cos(ang)*rad,by=cy+Math.sin(ang)*rad;
    c.beginPath();c.arc(bx,by,Math.max(5,R*.032),0,7);const bg=c.createRadialGradient(bx-2,by-2,1,bx,by,R*.04);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#cfd3e6');c.fillStyle=bg;c.shadowColor='#0008';c.shadowBlur=6;c.fill();c.shadowBlur=0}
  // marcador
  c.beginPath();c.moveTo(cx,cy-R-2);c.lineTo(cx-8,cy-R-16);c.lineTo(cx+8,cy-R-16);c.closePath();c.fillStyle='#ffc857';c.fill();
}

function rkSide(st){

  const bx=$('#rkbets');if(bx)bx.innerHTML=(st.bets||[]).map(b=>{const won=!!b.cashed_mult,lost=r.status==='crashed'&&!won;return`<div class="betline ${won?'win':lost?'lose':''}"><span>${esc(b.username)}${b.user_id===S.user.id?' (você)':''}</span><span>${fmt(b.amount,0)} AC ${won?`→ ${fmtMult(b.cashed_mult)} (+${fmt(b.payout)})`:''}</span></div>`}).join('')||'<div class="dim small">Ninguém apostou ainda nesta rodada.</div>';
}

function rkFrame(ts){
  if(!CAS.running||CAS.tab!=='foguete')return;
  CAS.raf=requestAnimationFrame(rkFrame);
  if(isLite()&&ts-(CAS.rk.lastT||0)<40)return;CAS.rk.lastT=ts;
  const cv=$('#rkcv');if(!cv)return;
  const dpr=Math.min(isLite()?1:2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const st=CAS.rk.st,now=srvNow(),r=st&&st.round,g=st?Number(st.growth):.12;
  let t=0,m=1,status=r?r.status:'betting';
  if(r&&status==='flying'){t=Math.max(0,(now-Date.parse(r.started_at))/1000);m=Math.exp(g*t)}
  else if(r&&status==='crashed'){t=Math.max(0,(Date.parse(r.crashed_at)-Date.parse(r.started_at))/1000);m=Number(r.crash_point)}
  // estrelas
  if(!CAS.rk.stars)CAS.rk.stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.3,v:Math.random()*.5+.2}));
  for(const s of CAS.rk.stars){const yy=((s.y+(status==='flying'?t*s.v*.05:0))%1);c.globalAlpha=.25+s.s*.25;c.fillStyle='#fff';c.fillRect(s.x*W,yy*H,s.s,s.s)}c.globalAlpha=1;
  const padL=46,padB=34,padT=20,padR=26,pw=W-padL-padR,ph=H-padB-padT;
  const tMax=Math.max(10,t*1.12),mMax=Math.max(2,m*1.22);
  const X=tt=>padL+tt/tMax*pw,Y=mm=>padT+ph-((mm-1)/(mMax-1))*ph;
  // grade
  c.strokeStyle='#241f4d';c.lineWidth=1;c.fillStyle='#6f6a9c';c.font='11px sans-serif';c.textAlign='right';
  const stepM=mMax>40?10:mMax>16?5:mMax>8?2:mMax>4?1:.5;
  for(let v=1;v<=mMax;v+=stepM){const y=Y(v);c.beginPath();c.moveTo(padL,y);c.lineTo(W-padR,y);c.stroke();c.fillText(fmt(v,v%1?1:0)+'x',padL-6,y+4)}
  const crashed=status==='crashed';
  let tipX=X(0),tipY=Y(1),ang=-Math.PI/2.6;
  if(status==='flying'||crashed){
    const N=isLite()?45:70;c.beginPath();
    for(let i=0;i<=N;i++){const tt=i/N*t,mm=Math.exp(g*tt);const x=X(tt),y=Y(mm);if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}
    tipX=X(t);tipY=Y(Math.min(m,mMax));
    const ex=X(Math.max(0,t-.15)),ey=Y(Math.exp(g*Math.max(0,t-.15)));ang=Math.atan2(tipY-ey,tipX-ex);
    c.lineWidth=4;c.lineCap='round';c.strokeStyle=crashed?'#ff5d73':'#b49aff';if(!isLite()){c.shadowColor=crashed?'#ff5d73':'#8b5cf6';c.shadowBlur=14}c.stroke();c.shadowBlur=0;
    c.lineTo(tipX,padT+ph);c.lineTo(X(0),padT+ph);c.closePath();
    const gr=c.createLinearGradient(0,padT,0,padT+ph);gr.addColorStop(0,crashed?'rgba(255,93,115,.28)':'rgba(139,92,246,.32)');gr.addColorStop(1,'rgba(139,92,246,0)');c.fillStyle=gr;c.fill();
  }
  c.save();c.translate(tipX,tipY);
  if(crashed){c.font='44px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('💥',0,0)}
  else{c.rotate(ang+Math.PI/4);c.font='34px serif';c.textAlign='center';c.textBaseline='middle';if(status==='flying'&&!isLite()){c.shadowColor='#ffb347';c.shadowBlur=18}c.fillText('🚀',0,0)}
  c.restore();
  // textos
  const big=$('#rkbig'),sub=$('#rksub'),wrap=$('#rkwrap');let bt,stx='';
  if(status==='betting'){if(r&&r.betting_ends_at){const left=Math.max(0,(Date.parse(r.betting_ends_at)-now)/1000);bt=left>0?`Decola em ${Math.ceil(left)}s`:'Preparar…';stx='Faça sua aposta'}else{bt='Aguardando apostas';stx='A contagem começa com a primeira aposta'}}
  else if(status==='flying'){bt=fmtMult(Math.floor(m*100)/100);const my=st&&rkMy(st);if(my&&!my.cashed_mult){const pay=Math.floor(Number(my.amount)*m*100)/100;stx=`Sacar agora rende ${fmt(pay)} AC`;const cb=$('#rkcash');if(cb)cb.textContent=`Sacar ${fmt(pay)} AC (${fmtMult(Math.floor(m*100)/100)})`}}
  else{bt=`Explodiu em ${fmtMult(m)}`;stx='Próxima rodada em instantes'}
  wrap.classList.toggle('crashed',crashed);
  if(CAS.rk.lastTxt!==bt+'|'+stx){CAS.rk.lastTxt=bt+'|'+stx;big.textContent=bt;sub.textContent=stx}
}

function chatHtml(){return`<div class="panel chatbox"><div class="chat-head"><h3>${ico('cas.chat')} Chat do cassino</h3><small><span class="dot" id="chatdot"></span><span id="chatstate">conectando</span></small></div><div id="chatlist"></div><form class="chat-form" id="chatform" data-form="chat" autocomplete="off"><input id="chatinput" maxlength="300" placeholder="Mande uma mensagem…" aria-label="Mensagem"><button class="btn-main">Enviar</button></form></div>`}
function chatMsgHtml(m){const mine=m.user_id===S.user.id,p=profile(m.user_id),st=p.id?p.nick_style:m.nick_style;return`<div class="msg ${mine?'mine':''}" data-mid="${m.id}">${(avOf(p)||m.avatar_url)?`<img class="avatar" src="${esc(avOf(p)||m.avatar_url)}" alt="" loading="lazy">`:'<span class="avatar"></span>'}<div style="min-width:0;flex:1"><div class="who"><button class="linkbtn" data-do="profile" data-id="${esc(m.user_id)}">${nick(p.username||m.username||'Membro',st)}</button>${titleTag(m.title,m.title_rarity)}</div><div class="txt">${esc(m.body)}</div></div>${isAdmin()?`<button class="del" data-do="chat-del" data-id="${m.id}" title="Apagar mensagem" aria-label="Apagar mensagem">✕</button>`:''}</div>`}
function chatRender(){
  const l=$('#chatlist');if(!l)return;
  l.innerHTML=CAS.chat.msgs.map(chatMsgHtml).join('')||'<div class="empty small">Ninguém falou ainda. Mande a primeira mensagem!</div>';
  l.scrollTop=l.scrollHeight;chatDot();
}
function chatDot(){const d=$('#chatdot'),s=$('#chatstate');if(d)d.classList.toggle('on',CAS.chat.live);if(s)s.textContent=CAS.chat.live?'ao vivo':'atualizando a cada poucos segundos'}
function chatPush(m){
  if(!m||CAS.chat.ids.has(m.id))return;CAS.chat.ids.add(m.id);CAS.chat.msgs.push(m);CAS.chat.lastId=Math.max(CAS.chat.lastId,m.id);
  if(CAS.chat.msgs.length>120){const o=CAS.chat.msgs.shift();CAS.chat.ids.delete(o.id)}
  const l=$('#chatlist');
  if(l){const near=l.scrollHeight-l.scrollTop-l.clientHeight<80;const e=l.querySelector('.empty');if(e)e.remove();l.insertAdjacentHTML('beforeend',chatMsgHtml(m));if(near||m.user_id===S.user.id)l.scrollTop=l.scrollHeight;
    if(m.user_id!==S.user.id)SFX.play('chat')}
  else if(m.user_id!==S.user.id&&CAS.chat.loaded){S.unread++;renderRail()}
}
function chatRemove(id){CAS.chat.msgs=CAS.chat.msgs.filter(m=>m.id!==id);const e=document.querySelector(`[data-mid="${id}"]`);if(e)e.remove()}
async function chatFetch(){
  const q=sb.from('chat_messages').select('id,user_id,username,avatar_url,body,created_at,nick_style,title,title_rarity');
  const{data,error}=await(CAS.chat.lastId?q.gt('id',CAS.chat.lastId).order('id',{ascending:true}).limit(100):q.order('id',{ascending:false}).limit(60));
  if(error){console.warn('chat:',error.message);return}
  const rows=CAS.chat.lastId?data:(data||[]).reverse();
  const first=!CAS.chat.loaded;CAS.chat.loaded=true;
  rows.forEach(m=>{if(first){if(!CAS.chat.ids.has(m.id)){CAS.chat.ids.add(m.id);CAS.chat.msgs.push(m);CAS.chat.lastId=Math.max(CAS.chat.lastId,m.id)}}else chatPush(m)});
  if(first)chatRender();
}
function chatStart(){
  if(CAS.chat.sub)return;
  chatFetch();
  try{
    CAS.chat.sub=sb.channel('autsim-chat')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>chatPush(p.new))
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},p=>chatRemove(p.old&&p.old.id))
      .subscribe(s=>{CAS.chat.live=(s==='SUBSCRIBED');chatDot()});
  }catch(e){console.warn('realtime:',e)}
  CAS.chat.fb=setInterval(()=>{if(!CAS.chat.live&&S.user)chatFetch()},5000);
}
function chatStop(){if(CAS.chat.sub){try{sb.removeChannel(CAS.chat.sub)}catch(e){}}CAS.chat.sub=null;CAS.chat.live=false;clearInterval(CAS.chat.fb);CAS.chat.msgs=[];CAS.chat.ids=new Set();CAS.chat.lastId=0;CAS.chat.loaded=false}
async function chatSend(){
  const inp=$('#chatinput'),txt=inp.value.trim();if(!txt)return;inp.value='';
  const{error}=await sb.rpc('send_chat',{p_body:txt});
  if(error){inp.value=txt;toast(errMsg(error),'err',3000)}
  else if(!CAS.chat.live)chatFetch();
}

function resizeImageFile(file,size){
  return new Promise((res,rej)=>{
    if(file.size>6e6){rej(new Error('Imagem muito grande (máximo 6 MB).'));return}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{const sz=size||96,cv=document.createElement('canvas');cv.width=cv.height=sz;const c=cv.getContext('2d');
      const r=Math.min(sz/img.width,sz/img.height),w=img.width*r,h=img.height*r;c.drawImage(img,(sz-w)/2,(sz-h)/2,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/png'))}catch(e){rej(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não consegui ler essa imagem.'))};img.src=url;
  });
}

/* ---------- ações ---------- */
async function admRpc(fn,args,ok,reload=true){
  const{data,error}=await sb.rpc(fn,args);
  if(error)throw error;
  if(ok)toast(ok);
  if(reload){await refreshLight('all');await admLoad()}
  return data;
}
function admAdjust(id){
  const p=profile(id);
  openForm({title:`Dinheiro de ${p.username}`,intro:`Saldo atual: ${fmt(p.balance)} AC`,submit:'Aplicar',

async function admSaveSetting(key,type){
  const el=$('#set_'+key);if(!el)return;
  let val=el.value;if(type==='number'){val=Number(val);if(!Number.isFinite(val)){toast('Informe um número válido.','err');return}}
  const{error}=await sb.rpc('admin_set_setting',{p_key:key,p_value:val});
  if(error){toast(errMsg(error),'err');return}
  S.settings[key]=val;applySettings();toast('Configuração salva.');
}
async function admSaveXp(){
  const base=Number($('#xpbase').value),exp=Number($('#xpexp').value),bonus=Number($('#xpbonus').value);
  if(![base,exp,bonus].every(Number.isFinite)){toast('Confira os valores da curva.','err');return}
  const{error}=await sb.rpc('admin_update_xp_settings',{p_base:base,p_exponent:exp,p_endgame_bonus:bonus});
  if(error){toast(errMsg(error),'err');return}
  S.xpConfig={base,exponent:exp,endgame_bonus:bonus};toast('Curva de níveis salva.');updateUserbar();
}

${table(['Caixa','Preço','Itens','Situação','Ações'],ADM.boxes.map(b=>`<tr><td>${b.image_url?`<img class="ico-img itemimg" src="${esc(b.image_url)}" alt=""> `:'📦 '}<b>${esc(b.name)}</b></td><td>${fmt(b.price,0)} AC</td><td>${(b.items||[]).length}</td><td>${b.active?'<span class="up">à venda</span>':'<span class="dim">oculta</span>'}</td><td><div class="row">${admBtn('adm-box-edit','Editar',`data-id="${esc(b.id)}"`)}${admBtn('adm-box-del','Excluir',`data-id="${esc(b.id)}"`,'btn-sm btn-bad')}</div></td></tr>`).join(''),'Nenhuma caixa.')}`;
}
let BOXF={rows:[],img:null,id:null};
function boxRowHtml(r,i){
  return`<div class="droprow rar-${esc(r.rarity)}" data-i="${i}"><div class="dr-img">${r.image_url?`<img src="${esc(r.image_url)}" alt="">`:'<span>PNG</span>'}<input type="file" accept="image/png,image/jpeg,image/webp" data-dr="img" hidden></div>
<label>Nome<input data-dr="name" maxlength="60" value="${esc(r.name)}"></label>
<label>Raridade<select data-dr="rarity">${ACH_RAR_OPTS.map(o=>`<option value="${o.value}" ${o.value===r.rarity?'selected':''}>${o.label}</option>`).join('')}</select></label>
<label>Chance (peso %)<input data-dr="weight" type="number" min="0.01" step="any" value="${esc(r.weight)}"></label>
<label>Valor (AC)<input data-dr="value" type="number" min="0" step="1" value="${esc(r.value??'')}" placeholder="auto"></label>
<button type="button" class="btn-sm" data-dr="pick">Imagem</button><button type="button" class="btn-sm btn-bad" data-dr="del">✕</button></div>`;
}
function boxRowsPaint(){
  const el=$('#boxrows');if(!el)return;
  el.innerHTML=BOXF.rows.map(boxRowHtml).join('')||'<p class="muted small">Sem itens ainda.</p>';
  const tot=BOXF.rows.reduce((n,r)=>n+(Number(r.weight)||0),0);
  const t=$('#boxtot');if(t)t.innerHTML=BOXF.rows.length?`Soma dos pesos: <b>${fmt(tot,2)}</b> — as chances reais são calculadas sobre esse total.`+['comum','raro','epico','lendario'].map(r=>{const p=BOXF.rows.filter(x=>x.rarity===r).reduce((n,x)=>n+(Number(x.weight)||0),0);return p?` ${rarPill(r)} ${fmt(p/tot*100,1)}%`:''}).join(''):'';
}
function boxFormSyncRows(){
  $$('#boxrows .droprow').forEach(el=>{const r=BOXF.rows[Number(el.dataset.i)];if(!r)return;
    r.name=el.querySelector('[data-dr=name]').value;r.rarity=el.querySelector('[data-dr=rarity]').value;r.weight=el.querySelector('[data-dr=weight]').value;r.value=el.querySelector('[data-dr=value]').value});
}
function admBoxForm(id){
  const b=ADM.boxes.find(x=>x.id===id)||{name:'',price:5000,image_url:'',active:true,sort_order:0,items:[]};
  BOXF={id:id||null,img:null,rows:(b.items||[]).map(i=>({name:i.name,rarity:i.rarity,weight:i.weight,value:i.value,image_url:i.image_url||'',description:i.description||'',file:null}))};
  if(!BOXF.rows.length)BOXF.rows=[{name:'',rarity:'comum',weight:50,value:'',image_url:'',description:'',file:null}];
  openModal(`<h3>${id?'Editar caixa':'Nova caixa'}</h3><form id="boxform"><div class="formgrid">
<label>Nome da caixa<input id="bxName" maxlength="50" value="${esc(b.name)}"></label>
<label>Preço (AC)<input id="bxPrice" type="number" min="0" step="1" value="${Number(b.price)}"></label>
<label>Imagem PNG da caixa${b.image_url?' (já tem; envie outra para trocar)':''}<input id="bxImg" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label>Ordem<input id="bxSort" type="number" step="1" value="${Number(b.sort_order||0)}"></label>
<label class="inline"><input id="bxActive" type="checkbox" ${b.active?'checked':''}> À venda para os jogadores</label></div>
<h4 style="margin:14px 0 6px">Tabela de drops</h4><p class="muted small">Cada item: nome, imagem PNG, raridade (branco, azul, roxo, dourado) e peso/chance. “Valor” é quanto o item vale em AC (vazio = calculado pelo preço da caixa e a raridade); ele conta para a conquista “Worth it”.</p>
<div id="boxrows" class="boxrows"></div><div id="boxtot" class="muted small" style="margin:6px 0"></div>
<div class="row"><button type="button" class="btn-sm" id="bxAdd">+ Adicionar item</button></div>
<div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" id="bxCancel">Cancelar</button><button type="submit" class="btn-main">Salvar caixa</button></div></form>`,true);
  boxRowsPaint();
  $('#bxCancel').onclick=closeModal;
  $('#bxAdd').onclick=()=>{boxFormSyncRows();BOXF.rows.push({name:'',rarity:'comum',weight:10,value:'',image_url:'',description:'',file:null});boxRowsPaint()};
  const rows=$('#boxrows');
  rows.addEventListener('click',e=>{const t=e.target.closest('[data-dr]');if(!t)return;const row=t.closest('.droprow'),i=Number(row.dataset.i);
    if(t.dataset.dr==='del'){boxFormSyncRows();BOXF.rows.splice(i,1);boxRowsPaint()}
    else if(t.dataset.dr==='pick'||t.closest('.dr-img')&&t.tagName!=='INPUT'){row.querySelector('[data-dr=img]').click()}});
  rows.addEventListener('change',e=>{const t=e.target;if(t.dataset.dr==='img'){const f=t.files&&t.files[0];if(!f)return;boxFormSyncRows();const i=Number(t.closest('.droprow').dataset.i);BOXF.rows[i].file=f;BOXF.rows[i].image_url=URL.createObjectURL(f);boxRowsPaint()}
    else if(t.dataset.dr){boxFormSyncRows();boxRowsPaint()}});
  $('#boxform').onsubmit=async ev=>{ev.preventDefault();const btn=ev.submitter||$('#boxform button[type=submit]');btn.disabled=true;
    try{
      boxFormSyncRows();
      const imgF=$('#bxImg').files&&$('#bxImg').files[0];
      const boxImg=imgF?await uploadImage(imgF,{w:512,h:512,mode:'contain',admin:true}):(b.image_url||'');
      const items=[];
      for(const r of BOXF.rows){
        let url=r.file?await uploadImage(r.file,{w:512,h:512,mode:'contain',admin:true}):(/^blob:/.test(r.image_url)?'':r.image_url||'');
        items.push({name:r.name,rarity:r.rarity,weight:Number(r.weight),value:r.value===''||r.value===null?null:Number(r.value),image_url:url,description:r.description||''});
      }
      await admRpc('admin_save_box',{p_id:BOXF.id,p_name:$('#bxName').value,p_price:Number($('#bxPrice').value),p_image:boxImg,p_active:$('#bxActive').checked,p_sort:Math.round(Number($('#bxSort').value)||0),p_items:items},BOXF.id?'Caixa atualizada.':'Caixa criada.');
      SH.boxAt=0;closeModal();
    }catch(e){toast(errMsg(e),'err',5000)}finally{btn.disabled=false}};
}

<h3 style="margin:18px 0 6px">Inventário dos membros</h3>${table(['Membro','Ações'],S.profiles.slice().sort((a,b)=>String(a.username).localeCompare(String(b.username))).map(p=>`<tr><td>${whoTag(p)}</td><td>${admBtn('adm-inv-view','Ver / tirar itens',`data-id="${esc(p.id)}"`)}</td></tr>`).join(''),'')}`;

  openForm({title:base?'Enviar item do site':'Criar item e enviar',wide:true,submit:'Enviar',
    fields:[{name:'user',label:'Para quem',type:'select',value:'',options:[{value:'',label:'Escolha…'},...S.profiles.slice().sort((a,c)=>String(a.username).localeCompare(String(c.username))).map(p=>({value:p.id,label:p.username}))]},
      {name:'name',label:'Nome do item',value:b.name,max:80},{name:'desc',label:'Descrição',type:'textarea',value:b.description||'',max:300},{name:'rarity',label:'Raridade',type:'select',value:b.rarity||'comum',options:ACH_RAR_OPTS},
      {name:'value',label:'Valor (AC)',type:'number',min:0,step:1,value:Number(b.value||0)},{name:'qty',label:'Quantidade de cópias',type:'number',min:1,step:1,value:1},

async function admGiveCatalog(){
  if(!ADM.catalog){const{data,error}=await sb.rpc('admin_item_catalog');if(error)throw error;ADM.catalog=data||[]}
  if(!ADM.catalog.length){toast('O site ainda não tem itens para copiar.','err');return}
  openForm({title:'Escolher item do site',submit:'Continuar',fields:[{name:'i',label:'Item',type:'select',value:'0',options:ADM.catalog.map((c,i)=>({value:String(i),label:`${c.name} — ${c.source}`}))}],
    onSubmit:async v=>{const c=ADM.catalog[Number(v.i)];setTimeout(()=>admGiveForm(c),30)}});
}

/* ============================================================
   Mercado livre (venda entre jogadores) e propostas de troca
   ============================================================ */
const MK={sub:'oficial',list:null,fee:0,max:10,at:0,loading:false,sig:'',trades:null,trAt:0,trLoading:false,trSig:''};

const mkSubtabs=()=>{const n=(MK.list||[]).filter(l=>Number(l.quantity)>0).length;
  return`<div class="subtabs"><button data-do="mk-sub" data-sub="oficial" class="${MK.sub==='oficial'?'active':''}">Preço oficial</button><button data-do="mk-sub" data-sub="jogadores" class="${MK.sub==='jogadores'?'active':''}">Vendas dos jogadores${n?` <span class="pill">${n}</span>`:''}</button></div>`};
const mkMyListed=aid=>(MK.list||[]).filter(l=>l.seller_id===S.user.id&&l.asset_id===aid).reduce((n,l)=>n+Number(l.quantity),0);
function mkBestAsk(aid){
  const l=(MK.list||[]).filter(x=>x.asset_id===aid&&Number(x.quantity)>0&&x.seller_id!==S.user.id);
  if(!l.length)return null;
  return{unit_price:Math.min(...l.map(x=>Number(x.unit_price))),n:l.length};
}
async function mkLoad(force){
  if(!S.user||MK.loading)return;
  if(!force&&MK.list&&Date.now()-MK.at<20000)return;
  MK.loading=true;
  try{
    const{data,error}=await sb.rpc('market_listings_list');if(error)throw error;
    MK.list=data.listings||[];MK.fee=Number(data.fee||0);MK.max=Number(data.max_listings||10);MK.at=Date.now();
    const sig=JSON.stringify(MK.list.map(l=>[l.id,l.quantity,l.unit_price]));
    if(sig!==MK.sig){MK.sig=sig;if(['bolsa','carteira'].includes(S.tab)&&$('#modal').classList.contains('hidden'))keepInputs(renderView)}
  }catch(e){MK.at=Date.now();console.warn('ofertas:',e.message||e)}
  finally{MK.loading=false}
}

function mkListingsHtml(){
  mkLoad();
  const list=(MK.list||[]).filter(l=>Number(l.quantity)>0);
  const mineN=list.filter(l=>l.seller_id===S.user.id).length;
  const sellable=S.holdings.filter(h=>h.user_id===S.user.id).map(h=>({a:asset(h.asset_id),free:Number(h.quantity)-mkMyListed(h.asset_id)})).filter(x=>x.a.id&&x.free>0);
  const first=sellable[0];
  const sellForm=sellable.length
    ?`<div class="formgrid cols3"><label>Moeda<select id="mkAsset">${sellable.map(x=>`<option value="${esc(x.a.id)}">${esc(x.a.symbol)} (você tem ${x.free} livre${x.free>1?'s':''})</option>`).join('')}</select></label><label>Quantidade<input type="number" id="mkQty" min="1" step="1" value="1" style="width:100%"></label><label>Preço de cada ação (AC)<input type="number" id="mkPrice" min="0.01" step="any" value="${first?Number(first.a.price):''}" style="width:100%"></label></div><div class="row"><button class="btn-main" data-do="mk-list">Colocar à venda</button><small>Ofertas abertas: ${mineN} de ${MK.max}</small></div>`
    :`<p class="muted">Você não tem ações livres para vender. Compre ações no preço oficial primeiro.</p>`;
  const rows=list.map(l=>{const a=asset(l.asset_id),mine=l.seller_id===S.user.id,off=price(l.asset_id),diff=off?(Number(l.unit_price)/off-1)*100:0,id=esc(l.id);
    return`<tr class="${mine?'me-row':''}"><td>${coinTag(a)}</td><td>${mine?'<span class="pill acc">você</span>':esc(l.seller_name||'—')}</td><td>${l.quantity}</td><td><b>${fmt(l.unit_price)}</b></td><td><span class="${diff<-0.005?'up':diff>0.005?'down':'dim'}">${pctTxt(diff)}</span></td><td>${mine?`<button class="btn-sm btn-bad" data-do="mk-cancel" data-id="${id}">Cancelar oferta</button>`:`<div class="row" style="flex-wrap:nowrap"><input type="number" id="mkq-${id}" min="1" max="${l.quantity}" step="1" value="1" aria-label="Quantidade"><button class="btn-good btn-sm" data-do="mk-buy" data-id="${id}">Comprar</button></div>`}</td></tr>`}).join('');
  return`<div class="panel"><h3>Vender suas ações para outros jogadores</h3><p class="muted small" style="margin:4px 0 12px">Você escolhe o preço. As ações ficam guardadas na oferta até alguém comprar ou você cancelar.${MK.fee>0?` O site fica com ${fmt(MK.fee,1)}% de cada venda.`:''} Negócios entre jogadores empurram um pouco o preço oficial na direção do preço negociado.</p>${sellForm}</div>
<h3 style="margin:20px 0 4px">Ofertas abertas</h3><small>“Vs. oficial” compara com o preço automático: verde é mais barato que a loja.</small>${table(['Moeda','Vendedor','Qtd','Preço de cada','Vs. oficial',''],rows,MK.list?'Nenhuma oferta aberta agora.':'Carregando ofertas…')}`;
}
async function mkList(){
  const a=$('#mkAsset')?.value,q=Number($('#mkQty')?.value),p=Number($('#mkPrice')?.value);
  if(!a){toast('Escolha uma moeda.','err');return}
  if(!Number.isInteger(q)||q<1){toast('Informe uma quantidade inteira.','err');return}
  if(!(p>0)){toast('Informe o preço de cada ação.','err');return}
  const{error}=await sb.rpc('create_listing',{p_asset:a,p_qty:q,p_price:p});
  if(error){toast(errMsg(error),'err');SFX.play('error');return}
  SFX.play('coin');toast(`Oferta criada: ${q} × ${asset(a).symbol} a ${fmt(p)} AC cada.`);
  await mkLoad(true);keepInputs(renderView);
}
async function mkBuy(id){
  const l=(MK.list||[]).find(x=>x.id===id);if(!l)return;
  const q=Number($('#mkq-'+CSS.escape(id))?.value);
  if(!Number.isInteger(q)||q<1){toast('Informe uma quantidade inteira.','err');return}
  const tot=Math.ceil(Number(l.unit_price)*q*100)/100;
  if(!await confirmBox(`Comprar ${q} × ${asset(l.asset_id).symbol} de ${l.seller_name} por ${fmt(tot)} AC?`,'Comprar'))return;
  const{data,error}=await sb.rpc('buy_listing',{p_id:id,p_qty:q});
  if(error){toast(errMsg(error),'err');SFX.play('error');await mkLoad(true);if(S.tab==='bolsa')renderView();return}
  SFX.play('coin');toast(`Compra feita: ${q} × ${asset(l.asset_id).symbol} por ${fmt(data?.cost)} AC.`);
  await mkLoad(true);await refreshLight(true);
}
async function mkCancel(id){
  const{error}=await sb.rpc('cancel_listing',{p_id:id});
  if(error){toast(errMsg(error),'err');return}
  toast('Oferta cancelada. As ações voltaram para você.');
  await mkLoad(true);await refreshLight(true);
}

/* ============================================================
   TROCAS (propostas diretas entre dois jogadores)
   ============================================================ */
const TR_STATUS={pending:'Aguardando',accepted:'Aceita',rejected:'Recusada',cancelled:'Cancelada',expired:'Expirada'};
function trSide(aid,qty,ac,item){
  const p=[];if(Number(qty)>0)p.push(`<b>${qty} × ${esc(asset(aid).symbol||'moeda')}</b>`);if(Number(ac)>0)p.push(`<b class="gold">${fmt(ac)} AC</b>`);
  if(item)p.push(`<b class="itemtag">${ico('gift')} ${esc(item)}</b>`);
  return p.join(' + ')||'—';
}
const inTrocas=()=>S.tab==='comunidade'&&CM.sub==='trocas';
const trLeft=iso=>{const ms=Date.parse(iso)-Date.now();if(ms<=0)return'expirada';const h=Math.floor(ms/3600e3),m=Math.floor(ms%3600e3/60e3);return h?`expira em ${h} h`:`expira em ${m} min`};
async function trLoad(force){
  if(!S.user||MK.trLoading)return;
  if(!force&&MK.trades&&Date.now()-MK.trAt<15000)return;
  MK.trLoading=true;
  try{
    const{data,error}=await sb.rpc('trades_list');if(error)throw error;
    MK.trades=data.offers||[];MK.trAt=Date.now();
    const sig=JSON.stringify(MK.trades.map(o=>[o.id,o.status]));
    if(sig!==MK.trSig){MK.trSig=sig;if(inTrocas()&&$('#modal').classList.contains('hidden'))renderView()}
  }catch(e){MK.trAt=Date.now();console.warn('trocas:',e.message||e)}
  finally{MK.trLoading=false}
}
function trCard(o){
  const mine=o.from_user===S.user.id,pend=o.status==='pending'&&Date.parse(o.expires_at)>Date.now();
  const other=mine?o.to_name:o.from_name;
  return`<div class="panel offer ${o.status}"><div class="spread"><b>${mine?`Você → ${esc(other)}`:`${esc(other)} → você`}</b><span class="pill ${pend?'acc':''}">${pend?trLeft(o.expires_at):TR_STATUS[o.status]||o.status}</span></div>
<div class="offer-body"><div><small>${mine?'Você dá':`${esc(other)} dá`}</small><div>${trSide(o.give_asset,o.give_qty,o.give_ac,o.give_item_name)}</div></div><span class="swap" aria-hidden="true">⇄</span><div><small>${mine?`Você recebe`:'Você dá'}</small><div>${trSide(o.want_asset,o.want_qty,o.want_ac,o.want_item_name)}</div></div></div>
${o.message?`<p class="muted small offer-msg">“${esc(o.message)}”</p>`:''}
${pend?`<div class="row" style="margin-top:10px">${mine?`<button class="btn-sm btn-bad" data-do="tr-cancel" data-id="${esc(o.id)}">Cancelar proposta</button>`:`<button class="btn-good" data-do="tr-accept" data-id="${esc(o.id)}">Aceitar</button><button class="btn-bad" data-do="tr-reject" data-id="${esc(o.id)}">Recusar</button>`}</div>`:''}</div>`;
}
function trocasHtml(){
  trLoad();
  const all=MK.trades||[],inb=all.filter(o=>o.to_user===S.user.id&&o.status==='pending'&&Date.parse(o.expires_at)>Date.now()),
    out=all.filter(o=>o.from_user===S.user.id&&o.status==='pending'&&Date.parse(o.expires_at)>Date.now()),
    done=all.filter(o=>!inb.includes(o)&&!out.includes(o));
  return`<div class="spread" style="margin-bottom:8px"><p class="muted small" style="max-width:70ch">Proponha uma troca direta com outro membro: ações por ações, ações por AC, itens do inventário, ou até um presente. Só vale se a outra pessoa aceitar, e a proposta expira em 24 horas. Trocas diretas não pagam taxa.</p><button class="btn-main" data-do="tr-new">Nova proposta</button></div>
<h3 style="margin:18px 0 8px">Para você responder ${inb.length?`<span class="badge" style="position:static;margin-left:6px">${inb.length}</span>`:''}</h3>${inb.map(trCard).join('')||`<div class="panel empty">${MK.trades?'Nenhuma proposta esperando por você.':'Carregando…'}</div>`}

function cmChatHtml(){return`<div class="panel chatbox cm-chat"><div class="chat-head"><h3>${ico('com.chat')} Chat da comunidade</h3><small><span class="dot" id="cmdot"></span><span id="cmstate">conectando</span></small></div><div id="cmlist" class="chatlist"></div><form class="chat-form" data-form="cmchat" autocomplete="off"><label class="imgbtn" title="Enviar imagem ou GIF (some em ${chatMins()} min)"><input type="file" id="cmimg" accept="image/png,image/jpeg,image/webp,image/gif" hidden>🖼</label><input id="cminput" maxlength="300" placeholder="Fale com a comunidade…" aria-label="Mensagem"><button class="btn-main">Enviar</button></form><small class="muted chat-note">Imagens e GIFs somem do chat depois de ${chatMins()} minutos.</small></div>`}
const chatMins=()=>Number(S.settings.chat_image_minutes||30);
const chatImgExpired=m=>m.image_url&&Date.now()-Date.parse(m.created_at)>chatMins()*60e3;
function cmMsgHtml(m,room){
  if(m.kind==='system')return`<div class="msg sys" data-mid="${m.id}"><div class="txt">${esc(m.body)}</div></div>`;
  const p=profile(m.user_id),av=avOf(p)||m.avatar_url,mine=m.user_id===S.user.id,st=p.id?p.nick_style:m.nick_style;
  return`<div class="msg ${m.kind==='bid'?'bid':''} ${mine?'mine':''}" data-mid="${m.id}">${av?`<img class="avatar" src="${esc(av)}" alt="" loading="lazy">`:'<span class="avatar"></span>'}<div style="min-width:0;flex:1"><div class="who"><button class="linkbtn" data-do="profile" data-id="${esc(m.user_id)}">${nick(p.username||m.username,st)}</button>${titleTag(m.title,m.title_rarity)}</div><div class="txt">${m.kind==='bid'?'<span class="bidtag">LANCE</span> ':''}${m.body&&m.body!=='📷'?esc(m.body):''}${m.image_url?(chatImgExpired(m)?'<em class="muted small">imagem expirada</em>':`<a href="${esc(m.image_url)}" target="_blank" rel="noopener" class="chatimg"><img src="${esc(m.image_url)}" alt="imagem enviada" loading="lazy"></a>`):''}</div></div>${isAdmin()&&!room?`<button class="del" data-do="cm-del" data-id="${m.id}" title="Apagar mensagem" aria-label="Apagar mensagem">✕</button>`:''}</div>`;
}
function cmChatDot(){const d=$('#cmdot'),s=$('#cmstate');if(d)d.classList.toggle('on',CM.chat.live);if(s)s.textContent=CM.chat.live?'ao vivo':'atualizando a cada poucos segundos'}
function cmChatRender(){
  const l=$('#cmlist');if(!l)return;
  l.innerHTML=CM.chat.msgs.map(m=>cmMsgHtml(m)).join('')||'<div class="empty small">Ninguém falou ainda. Mande a primeira mensagem!</div>';
  l.scrollTop=l.scrollHeight;cmChatDot();
}
function cmChatPush(m){
  if(!m||m.auction_id||CM.chat.ids.has(m.id))return;CM.chat.ids.add(m.id);CM.chat.msgs.push(m);CM.chat.lastId=Math.max(CM.chat.lastId,m.id);
  if(CM.chat.msgs.length>120){const o=CM.chat.msgs.shift();CM.chat.ids.delete(o.id)}
  const l=$('#cmlist');
  if(l&&S.tab==='comunidade'&&CM.sub==='chat'){const near=l.scrollHeight-l.scrollTop-l.clientHeight<80;const e=l.querySelector('.empty');if(e)e.remove();l.insertAdjacentHTML('beforeend',cmMsgHtml(m));if(near||m.user_id===S.user.id)l.scrollTop=l.scrollHeight;if(m.user_id!==S.user.id)SFX.play('chat')}
  else if(m.user_id!==S.user.id&&CM.chat.loaded){CM.chat.unread++;renderRail()}
}
function cmChatRemove(id){CM.chat.msgs=CM.chat.msgs.filter(m=>m.id!==id);const e=document.querySelector(`#cmlist [data-mid="${id}"]`);if(e)e.remove()}
async function cmChatFetch(){
  const q=sb.from('community_messages').select('id,user_id,username,avatar_url,nick_style,body,kind,auction_id,created_at,title,title_rarity,image_url').is('auction_id',null);
  const{data,error}=await(CM.chat.lastId?q.gt('id',CM.chat.lastId).order('id',{ascending:true}).limit(100):q.order('id',{ascending:false}).limit(60));
  if(error){console.warn('chat comunidade:',error.message);return}
  const rows=CM.chat.lastId?data:(data||[]).reverse();
  const first=!CM.chat.loaded;CM.chat.loaded=true;
  rows.forEach(m=>{if(first){if(!CM.chat.ids.has(m.id)){CM.chat.ids.add(m.id);CM.chat.msgs.push(m);CM.chat.lastId=Math.max(CM.chat.lastId,m.id)}}else cmChatPush(m)});
  if(first)cmChatRender();
}
function cmChatStart(){
  if(CM.chat.sub)return;
  cmChatFetch();
  try{
    CM.chat.sub=sb.channel('autsim-community')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'community_messages'},p=>cmChatPush(p.new))
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'community_messages'},p=>cmChatRemove(p.old&&p.old.id))
      .subscribe(s=>{CM.chat.live=(s==='SUBSCRIBED');cmChatDot()});
  }catch(e){console.warn('realtime:',e)}
  CM.chat.fb=setInterval(()=>{if(!CM.chat.live&&S.user)cmChatFetch()},5000);
}
function cmChatStop(){if(CM.chat.sub){try{sb.removeChannel(CM.chat.sub)}catch(e){}}CM.chat.sub=null;CM.chat.live=false;clearInterval(CM.chat.fb);CM.chat.msgs=[];CM.chat.ids=new Set();CM.chat.lastId=0;CM.chat.loaded=false;CM.chat.unread=0}
async function cmChatSend(){
  const inp=$('#cminput'),fi=$('#cmimg'),file=fi&&fi.files&&fi.files[0],txt=(inp?.value||'').trim();if(!txt&&!file)return;inp.value='';

}

function cmRoomOpen(id){CM.roomId=id;CM.room=null;CM.roomMsgs=[];CM.roomIds=new Set();CM.roomLast=0;CM.sub='leiloes';if(S.tab!=='comunidade')S.tab='comunidade';render()}
function cmRoomStop(){clearTimeout(CM.roomT);CM.roomT=0;CM.roomPoll=false}
function cmRoomClose(){cmRoomStop();CM.roomId=null;CM.room=null;CM.aucAt=0;renderView()}
function cmRoomStart(){if(CM.roomPoll)return;CM.roomPoll=true;cmRoomPoll()}
async function cmRoomPoll(){
  if(!CM.roomPoll||!CM.roomId||S.tab!=='comunidade'||CM.sub!=='leiloes'){CM.roomPoll=false;return}
  const id=CM.roomId;
  try{
    const d=await stateRpc2('auction_state',{p_id:id,p_after:CM.roomLast});
    if(id!==CM.roomId)return;
    const prev=CM.room;CM.room=d;
    const fresh=[];(d.messages||[]).forEach(m=>{if(!CM.roomIds.has(m.id)){CM.roomIds.add(m.id);CM.roomMsgs.push(m);CM.roomLast=Math.max(CM.roomLast,m.id);fresh.push(m)}});
    const first=!prev;
    if(first){const box=$('#room');if(box)box.innerHTML=cmRoomInner();cmRoomMsgsPaint(true)}
    else{cmRoomStatPaint();if(fresh.length)cmRoomMsgsAppend(fresh)}
    if(prev&&prev.auction.status==='open'&&d.auction.status!=='open'){
      if(d.auction.winner_id===S.user.id){toast(d.auction.mode==='service'?`Você arrematou "${d.auction.title}"! Combine a entrega com ${d.auction.creator_name}.`:`Você arrematou "${d.auction.title}"! O item está no seu inventário.`,'gain',7000);SFX.play('win');FX.confetti()}
      else if(d.auction.status==='sold')toast(`Leilão encerrado: arrematado por ${d.auction.high_name} por ${fmt(d.auction.current_bid)} AC.`);
      refreshLight(true);S.staticAt=0;
    }
    if(prev&&prev.auction.leading&&!d.auction.leading&&d.auction.status==='open'){toast(`Seu lance foi coberto em "${d.auction.title}". O valor voltou para o seu saldo.`,'err',5000);SFX.play('error');refreshBalance()}
  }catch(e){if(id===CM.roomId){console.warn('sala:',e.message||e);if(/não encontrado/i.test(e.message||'')){toast('Esse leilão não existe mais.','err');cmRoomClose();return}}}
  if(CM.roomPoll&&id===CM.roomId)CM.roomT=setTimeout(cmRoomPoll,document.hidden?5000:isLite()?2500:1500);
}

const FEED={slides:[],ticker:[],preds:[],daily:null,at:0,busy:false,idx:0,t:0,sig:''};

async function feedLoad(force){
  if(!S.user||FEED.busy)return;
  if(!force&&Date.now()-FEED.at<30000)return;
  FEED.busy=true;
  try{
    const f=await sb.rpc('home_feed2');
    if(f.error)throw f.error;
    if(f.data?.now)syncClock(f.data.now,Date.now(),Date.now());
    FEED.slides=f.data.slides||[];FEED.ticker=f.data.ticker||[];FEED.preds=f.data.predictions||[];
    FEED.daily=f.data.daily||null;
    FEED.at=Date.now();
    const sig=JSON.stringify([FEED.slides.map(x=>[x.type,x.id,x.current_bid,x.bid_count]),FEED.ticker.map(x=>[x.id,x.text]),FEED.preds.map(x=>[x.id,x.yes_total,x.no_total]),FEED.daily]);

      FEED.sig=sig;S.tickSig='';renderTicker();
      if(S.tab==='inicio'&&$('#modal').classList.contains('hidden'))keepInputs(renderView);
    }
  }catch(e){FEED.at=Date.now();console.warn('início:',e.message||e)}

const SLIDE_TAG={main:['Notícia principal','gold'],auction:['Leilão mais badalado do dia','acc'],ad:['Anúncio','acc'],closed:['Leilões Fechados','']};
function slideHtml(sl,i){
  const [tag,cls]=SLIDE_TAG[sl.type]||['',''];
  const bg=sl.image_url?`<img src="${esc(sl.image_url)}" alt="" ${i===0?'':'loading="lazy"'} decoding="async">`:`<div class="slide-bg ph-${sl.type}"><span>${sl.type==='auction'?ico('com.leiloes'):sl.type==='closed'?'🔒':ico('com.forum')}</span></div>`;
  let extra='',act='';
  if(sl.type==='auction'){
    extra=`<div class="slide-meta"><span class="pill gold">${ico('coin')} ${fmt(sl.bid_count?sl.current_bid:0,0)} AC</span><span class="pill">${sl.bid_count||0} lance${sl.bid_count==1?'':'s'}</span><span class="pill acc"><b class="ac-cd" data-t="${esc(sl.ends_at)}">${countdownTxt(Date.parse(sl.ends_at)-srvNow())}</b></span></div>`;
    act=`data-do="cm-room" data-id="${esc(sl.id)}"`}
  else if(sl.type==='ad')act=`data-do="cm-go" data-sub="forum"`;
  else if(sl.type==='closed')act=`data-do="cm-go" data-sub="leiloes"`;
  else act=`data-do="cm-go" data-sub="forum"`;
  return`<div class="slide ${i===FEED.idx?'on':''}" data-i="${i}" ${i===FEED.idx?'':'aria-hidden="true"'}><button class="slide-hit" ${act} aria-label="${esc(sl.title||tag)}"></button>${bg}<div class="slide-cap"><div class="row" style="gap:8px">${tag?`<span class="pill ${cls}">${tag}</span>`:''}${sl.type==='ad'&&sl.author_name?`<span class="small">por ${nick(sl.author_name,sl.nick_style)}</span>`:''}</div><h3>${esc(sl.title||'')}</h3>${sl.body?`<p>${esc(String(sl.body).slice(0,160))}</p>`:''}${extra}</div></div>`;
}
function carouselHtml(){
  const sl=FEED.slides;
  if(!sl.length)return`<div class="carousel loading"><div class="slide on"><div class="slide-bg ph-main"><span>${ico('brand')}</span></div><div class="slide-cap"><h3>Carregando as novidades…</h3></div></div></div>`;
  if(FEED.idx>=sl.length)FEED.idx=0;
  return`<div class="carousel" id="car" role="region" aria-roledescription="carrossel" aria-label="Destaques"><div class="car-stage">${sl.map(slideHtml).join('')}</div>
${sl.length>1?`<button class="car-nav prev" data-do="car-prev" aria-label="Slide anterior">‹</button><button class="car-nav next" data-do="car-next" aria-label="Próximo slide">›</button><div class="car-dots">${sl.map((_,i)=>`<button data-do="car-go" data-i="${i}" class="${i===FEED.idx?'on':''}" aria-label="Ir para o slide ${i+1}"></button>`).join('')}</div>`:''}</div>`;
}
function carShow(i){
  const sl=FEED.slides;if(!sl.length)return;
  FEED.idx=(i+sl.length)%sl.length;
  {const nx=sl[(FEED.idx+1)%sl.length];if(nx&&nx.image_url){const im=new Image();im.src=nx.image_url}}
  $$('#car .slide').forEach((el,k)=>{const on=k===FEED.idx;el.classList.toggle('on',on);el.setAttribute('aria-hidden',on?'false':'true')});
  $$('#car .car-dots button').forEach((el,k)=>el.classList.toggle('on',k===FEED.idx));
}
function carStart(){
  clearInterval(FEED.t);
  if(!$('#car')||FEED.slides.length<2||!P.motion)return;
  FEED.t=setInterval(()=>{const c=$('#car');if(!c){clearInterval(FEED.t);return}if(document.hidden||c.matches(':hover')||c.contains(document.activeElement))return;carShow(FEED.idx+1)},6500);
}

const TQ={kind:'',id:'',seq:0,timer:0,last:null};
function tradeModal(kind,id){
  const a=asset(id),buy=kind==='buy_shares';if(!a.id)return;
  TQ.kind=kind;TQ.id=id;TQ.last=null;
  const own=id===S.user.id;
  openModal(`<div class="spread"><h3>${buy?'Comprar':'Vender'} ${esc(a.symbol)}</h3><span id="tqPrice" class="pill gold">${ico('coin')} ${fmt(a.price)}</span></div>
<div style="margin:8px 0 12px">${coinTag(a)}${a.is_system?' <span class="pill acc">moeda do sistema</span>':''}${own?' <span class="pill acc">sua moeda</span>':''}</div>
<div class="tq"><label>Quantidade de ações<input id="tqQty" type="number" min="1" step="1" value="1" inputmode="numeric" style="width:100%"></label>
<div class="chips" id="tqChips"><button type="button" data-do="tq-set" data-v="1">1</button><button type="button" data-do="tq-set" data-v="10">10</button><button type="button" data-do="tq-set" data-v="50">50</button><button type="button" data-do="tq-set" data-v="100">100</button><button type="button" data-do="tq-set" data-v="max">${buy?'Máximo que posso comprar':'Vender tudo'}</button></div>
<div id="tqBox" class="tqbox"><span class="muted">Calculando…</span></div></div>
<div class="row" style="justify-content:flex-end;margin-top:14px"><button id="tqNo">Cancelar</button><button id="tqYes" class="${buy?'btn-good':'btn-bad'} btn-lg" disabled>${buy?'Confirmar compra':'Confirmar venda'}</button></div>`);
  $('#tqNo').onclick=closeModal;
  $('#tqQty').addEventListener('input',()=>tqSchedule());
  $('#tqQty').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!$('#tqYes').disabled)tqConfirm()}});
  $('#tqYes').onclick=tqConfirm;
  tqSchedule(0);
}
function tqSchedule(ms=160){
  clearTimeout(TQ.timer);const box=$('#tqBox');if(box)box.classList.add('stale');
  const yes=$('#tqYes');if(yes)yes.disabled=true;
  TQ.timer=setTimeout(tqQuote,ms);
}
async function tqQuote(){
  const inp=$('#tqQty');if(!inp)return;
  const q=Math.floor(Number(inp.value)),seq=++TQ.seq,buy=TQ.kind==='buy_shares';
  const{data,error}=await sb.rpc('quote_trade',{p_asset:TQ.id,p_qty:Number.isFinite(q)&&q>0?q:0,p_side:buy?'buy':'sell'});
  if(seq!==TQ.seq||!$('#tqBox'))return;
  const box=$('#tqBox');box.classList.remove('stale');
  if(error){box.innerHTML=`<span class="down">${esc(errMsg(error))}</span>`;return}
  TQ.last=data;
  const d=data,a=asset(TQ.id);let msg='',ok=false;
  if(!(q>0)){box.innerHTML='<span class="muted">Digite quantas ações você quer.</span>';return}
  const rows=[];
  if(d.total!==undefined){
    const pa=Number(d.price_after),pb=Number(d.price_before),ch=pb?(pa/pb-1)*100:0;
    rows.push(['Preço de 1 ação agora',fmt(pb)+' AC'],[buy?'Preço médio desta compra':'Preço médio desta venda',fmt(d.avg_price)+' AC'],['Valor das ações',fmt(d.subtotal)+' AC'],[`Taxa do mercado (${fmt(d.fee_percent,0)}%)`,(buy?'+ ':'− ')+fmt(d.fee)+' AC']);
    const after=buy?Number(d.balance)-Number(d.total):Number(d.balance)+Number(d.total);
    box.innerHTML=`<div class="tq-total"><small>${buy?'Você vai pagar':'Você vai receber'}</small><b class="${buy?'down':'up'}">${fmt(d.total)} AC</b></div>
<table class="tq-rows"><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}<tr class="hl"><td>Preço novo da moeda (depois ${buy?'da compra':'da venda'})</td><td><b>${fmt(pa)} AC</b> <span class="${ch>0?'up':ch<0?'down':'dim'}">${ch>0?'▲':ch<0?'▼':'■'} ${pctTxt(ch)}</span></td></tr><tr><td>Seu saldo depois</td><td class="${after<0?'down':''}">${fmt(after)} AC</td></tr></tbody></table>`;
    ok=true;
    if(buy&&Number(d.total)>Number(d.balance)){ok=false;msg=`Saldo insuficiente. Você consegue comprar até <b>${d.max_buy}</b> ação(ões) agora.`}
    if(!buy&&q>Number(d.free)){ok=false;msg=`Você só tem ${d.free} ação(ões) livre(s) para vender.`}
  }else{
    if(buy&&q>Number(d.pool))msg=`O mercado só tem <b>${d.pool}</b> ação(ões) disponíveis agora.`;
    else if(!buy&&q>Number(d.free))msg=`Você só tem ${d.free} ação(ões) livre(s) para vender.`;
    box.innerHTML='';
  }
  if(buy&&d.own_limit!==null&&d.own_limit!==undefined&&q>Number(d.own_limit)){ok=false;msg=`Sua própria moeda: você só pode ter ${ownCap()} ações dela. Você ainda pode comprar ${d.own_limit}.`}
  const info=`<div class="tq-info"><span>Disponíveis no mercado: <b>${Number(d.pool).toLocaleString('pt-BR')}</b></span><span>Você tem: <b>${Number(d.held)}</b></span>${buy?`<span>Dá para comprar até: <b>${d.max_buy}</b></span>`:''}</div>`;
  box.insertAdjacentHTML('beforeend',info+(msg?`<div class="notice" style="margin:8px 0 0">${msg}</div>`:''));
  const yes=$('#tqYes');if(yes)yes.disabled=!ok;
}
async function tqSet(v){
  const inp=$('#tqQty');if(!inp)return;
  if(v==='max'){
    const d=TQ.last;
    if(TQ.kind==='buy_shares')inp.value=Math.max(1,Number(d?.max_buy||1));
    else inp.value=Math.max(1,Number(d?.free||1));
  }else inp.value=v;
  tqSchedule(0);
}
async function tqConfirm(){
  const q=Math.floor(Number($('#tqQty')?.value)),buy=TQ.kind==='buy_shares',a=asset(TQ.id);
  if(!(q>0))return;
  const yes=$('#tqYes');yes.disabled=true;
  const{data,error}=await sb.rpc(TQ.kind,{p_asset_id:TQ.id,p_qty:q});
  if(error){toast(errMsg(error),'err');SFX.play('error');tqSchedule(0);return}
  closeModal();SFX.play('coin');
  if(data?.new_balance!==undefined)setBalance(data.new_balance);
  if(a.id&&data?.new_price!==undefined){const x=S.assets.find(z=>z.id===a.id);if(x){x.price=Number(data.new_price);pxPatchMover(a.id,x.price);renderTicker()}}
  toast(buy?`Compra feita: ${q} × ${a.symbol} por ${fmt(data?.cost)} AC (taxa de ${fmt(data?.fee)} AC). Preço novo: ${fmt(data?.new_price)} AC.`:`Venda feita: ${q} × ${a.symbol}. Você recebeu ${fmt(data?.proceeds)} AC (taxa de ${fmt(data?.fee)} AC).`,'ok',6000);
  refreshLight(true);
}

/* ============================================================
   PREÇOS EM TEMPO REAL: quando alguém compra/vende, o topo e as telas mudam na hora (Realtime do Supabase)
   ============================================================ */
const PX={ch:null,live:false,tk:0,tv:0,th:0,lastH:0};
function pxPatchMover(id,price){
  const m=S.movers[id];if(!m)return;
  m.price=price;const ref=Number(m.ref_price);m.change_pct=ref>0?Math.round((price-ref)/ref*10000)/100:0;
}
function pxApply(n){
  if(!n||!n.id||!S.user||!S.started)return;
  const a=S.assets.find(x=>x.id===n.id);if(!a)return;
  const price=Number(n.price);
  ['name','symbol','avatar_url','total_shares','is_system','pool0'].forEach(k=>{if(n[k]!==undefined)a[k]=n[k]});
  a.price=price;pxPatchMover(a.id,price);
  if(!PX.tk)PX.tk=setTimeout(()=>{PX.tk=0;renderTicker()},250);
  if(!PX.tv&&LIVE_TABS.has(S.tab)&&['inicio','bolsa','carteira','ranking'].includes(S.tab))PX.tv=setTimeout(()=>{PX.tv=0;if($('#modal').classList.contains('hidden'))keepInputs(renderView)},1200);
  /* "Disponíveis" e carteiras mudam junto: busca de novo (1 chamada), no máximo 1 vez a cada 4 s */
  clearTimeout(PX.th);PX.th=setTimeout(()=>{if(Date.now()-PX.lastH<4000){PX.th=setTimeout(()=>{PX.lastH=Date.now();refreshLight()},4000);return}PX.lastH=Date.now();refreshLight()},1500);
}
/* Pulso do mercado: qualquer compra, venda, oferta ou troca avisa todo mundo na hora (tabela market_pulse no Realtime).
   O navegador atualiza no máximo ~1 vez por segundo, juntando vários avisos seguidos. */
const PU={t:0,last:0,kinds:new Set()};
function pxPulse(n){
  if(!S.user||!S.started)return;
  PU.kinds.add((n&&n.kind)||'market');
  if(PU.t)return;
  PU.t=setTimeout(async()=>{
    PU.t=0;PU.last=Date.now();const k=PU.kinds;PU.kinds=new Set();
    if(document.hidden)return;
    try{
      const jobs=[refreshLight(false,true)];
      if(k.has('listing')&&S.tab==='bolsa'&&MK.sub==='jogadores')jobs.push(mkLoad(true));
      if(k.has('trade')&&inTrocas())jobs.push(trLoad(true));
      await Promise.all(jobs);
    }catch(e){}
  },Math.max(120,(isLite()?1300:800)-(Date.now()-PU.last)));
}
function priceStart(){
  if(PX.ch)return;
  try{
    PX.ch=sb.channel('autsim-prices')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'assets'},p=>pxApply(p.new))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'assets'},()=>refreshLight(true))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'market_pulse'},p=>pxPulse(p.new))
      .subscribe(s=>{PX.live=(s==='SUBSCRIBED')});
  }catch(e){console.warn('preços ao vivo:',e)}
}

/* sorteio visual: o servidor já decidiu; a faixa só termina exatamente nele */
const REEL={busy:false,raf:0};
function pickWeighted(items){const tot=items.reduce((n,i)=>n+Number(i.weight||1),0);let r=Math.random()*tot;for(const i of items){r-=Number(i.weight||1);if(r<0)return i}return items[items.length-1]}
function boxOpenModal(id){
  const b=(SH.boxes||[]).find(x=>x.id===id);if(!b)return;
  if(REEL.busy)return;
  openModal(`<div class="reelmodal"><div class="spread"><h3>${esc(b.name)}</h3><span class="pill gold">${ico('coin')} ${fmt(b.price,0)}</span></div>
<div class="reelwrap" id="reelwrap"><div class="reelptr"></div><div class="reelstrip" id="reelstrip"></div></div>
<div id="reelres" class="reelres"></div>
<div class="row" style="justify-content:center;margin-top:14px"><button id="rlClose">Fechar</button><button class="btn-main btn-lg" id="rlGo">Abrir caixa</button></div></div>`,true);
  const strip=$('#reelstrip');
  const demo=Array.from({length:14},()=>pickWeighted(b.items));
  strip.innerHTML=demo.map(i=>itemTile(i,'reel')).join('');
  $('#rlClose').onclick=()=>{if(!REEL.busy)closeModal()};
  $('#rlGo').onclick=()=>boxRun(b);
}
async function boxRun(b){
  if(REEL.busy)return;
  const btn=$('#rlGo');if(btn){btn.disabled=true}
  REEL.busy=true;
  let r;
  try{
    const{data,error}=await sb.rpc('open_box',{p_box:b.id});if(error)throw error;r=data;
  }catch(e){REEL.busy=false;if(btn)btn.disabled=false;toast(errMsg(e),'err');SFX.play('error');return}
  const win=r.item,lite=isLite();
  const T=lite?34:58,wi=lite?5:7;                       // a faixa tem T peças; o vencedor fica na peça "wi" (perto do começo)
  const tiles=[];for(let i=0;i<T;i++)tiles.push(pickWeighted(b.items));
  tiles[wi]=win;
  const strip=$('#reelstrip'),wrap=$('#reelwrap');if(!strip||!wrap){REEL.busy=false;return}
  strip.innerHTML=tiles.map(i=>itemTile(i,'reel')).join('');
  const tw=strip.firstElementChild.getBoundingClientRect().width+Number.parseFloat(getComputedStyle(strip.firstElementChild).marginRight||0)*2;
  const W=wrap.clientWidth,jitter=(Math.random()-.5)*tw*.6;
  const x0=-((T-4)*tw-W/2),x1=-(wi*tw+tw/2-W/2)+jitter;      // x aumenta: a faixa desliza da esquerda para a direita
  const dur=lite?3600:6200;
  strip.style.transform=`translate3d(${x0}px,0,0)`;
  $('#reelres').innerHTML='';
  let last=-1;const t0=performance.now();
  const frame=ts=>{
    const p=Math.min(1,(ts-t0)/dur),x=x0+(x1-x0)*ease.out5(p);
    strip.style.transform=`translate3d(${x}px,0,0)`;
    const idx=Math.floor((W/2-x)/tw);if(idx!==last){last=idx;if(p<.985)SFX.play('tick')}
    if(p<1){REEL.raf=requestAnimationFrame(frame);return}
    boxDone(b,r,tiles[wi]);
  };
  REEL.raf=requestAnimationFrame(frame);
}
function boxDone(b,r,win){
  REEL.busy=false;
  const rar=win.rarity;
  const strip=$('#reelstrip');if(strip&&strip.children[0]){[...strip.children].forEach(c=>c.classList.add('dim'));}
  setBalance(r.balance);
  SFX.play(rar==='lendario'||rar==='epico'?'level':'win');
  if(rar==='lendario'){FX.confetti(innerWidth/2,innerHeight/3,140);FX.rain(18)}else if(rar==='epico')FX.confetti(innerWidth/2,innerHeight/3,70);
  const res=$('#reelres');
  if(res)res.innerHTML=`<div class="reelwin rar-${esc(rar)}">${itemTile(win,'big')}<div><div>${rarPill(rar)}</div><h3 style="margin:6px 0">${esc(win.name)}</h3><small class="muted">vale ~${fmt(win.value,0)} AC${win.description?' · '+esc(win.description):''}</small></div></div>`;
  const go=$('#rlGo');if(go){go.disabled=false;go.textContent=`Abrir de novo (${fmt(b.price,0)} AC)`;go.onclick=()=>{res.innerHTML='';boxRun(b)}}
  const row=go&&go.parentElement;if(row&&!row.querySelector('[data-do=inv-equip]')&&r.inventory_id)row.insertAdjacentHTML('afterbegin',`<button data-do="inv-equip" data-id="${esc(r.inventory_id)}">Equipar no perfil</button>`);
  S.staticAt=0;refreshLight('all');
}

async function refreshLight(force,queue){
  if(!S.user||!S.profile)return;
  if(S.refreshing&&!force){if(queue)S.again=true;return}
  S.refreshing=true;S.lastRefresh=Date.now();
  try{
    const sig=await fetchCore(force);
    if(siteClosed()&&!isAdmin()){showClosed();return}
    const changed=force||sig!==S.viewSig;S.viewSig=sig;
    if(changed){
      updateUserbar();renderRail();renderTicker();
      if(LIVE_TABS.has(S.tab)&&($('#modal').classList.contains('hidden')||force))keepInputs(renderView);
      else if(COM_TABS_LIVE()&&$('#modal').classList.contains('hidden'))keepInputs(renderView);

      else if(S.tab==='adm'&&force)keepInputs(renderView);
      const cb=$('#casbal');if(cb)cb.textContent=fmt(me().balance);
    }
    feedLoad(force&&S.tab==='inicio');
  }catch(e){console.warn('atualização:',e)}
  finally{S.refreshing=false;if(S.again){S.again=false;setTimeout(()=>refreshLight(),60)}}
}

/* ---------- cadastro / login nativos (usuário + senha) ---------- */
const USER_RE=/^[A-Za-z0-9_.-]{3,20}$/;
async function authSubmit(){
  const su=!!$('#auPass2'),u=($('#auUser')?.value||'').trim(),pw=$('#auPass')?.value||'',btn=$('#auGo');
  if(!USER_RE.test(u)){toast('Nome de usuário: de 3 a 20 letras, números, _ . ou -','err');return}
  if(pw.length<6){toast('A senha precisa ter pelo menos 6 caracteres.','err');return}
  btn.disabled=true;
  try{
    if(su){
      if(pw!==$('#auPass2').value){toast('As senhas não são iguais.','err');return}
      if(!$('#termscheck')?.checked){toast('Marque a caixa para aceitar a regra de uma conta por pessoa.','err');return}
      const mail=($('#auMail')?.value||'').trim();
      if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){toast('E-mail inválido. Deixe em branco se preferir.','err');return}
      const av=await sb.rpc('username_available',{p_username:u});
      if(av.error)throw av.error;if(av.data===false){toast('Esse nome de usuário já está em uso. Escolha outro.','err');return}
      const{data,error}=await sb.auth.signUp({email:authEmail(u),password:pw,options:{data:{username:u,contact_email:mail||null,terms:true}}});
      if(error)throw new Error(/already|registered/i.test(error.message||'')?'Esse nome de usuário já está em uso.':/database error/i.test(error.message||'')?'Não foi possível criar a conta. Confira o nome de usuário e tente de novo.':error.message);
      if(!data.session){const r=await sb.auth.signInWithPassword({email:authEmail(u),password:pw});if(r.error)throw new Error('Conta criada! Aguarde o ADM aprovar e entre de novo.')}
    }else{
      const{error}=await sb.auth.signInWithPassword({email:authEmail(u),password:pw});
      if(error)throw new Error(/invalid|credentials/i.test(error.message||'')?'Usuário ou senha incorretos.':error.message);
    }
  }catch(e){toast(errMsg(e),'err',5000)}
  finally{if(btn)btn.disabled=false}
}
let pendingT=0;
function pendingPoll(){
  clearInterval(pendingT);
  pendingT=setInterval(async()=>{
    if(!S.user||document.hidden)return;
    try{const{data}=await sb.rpc('my_status');
      if(data&&data.status==='approved'){clearInterval(pendingT);S.booting=false;S.started=false;enter()}
      else if(data&&data.status==='none'){clearInterval(pendingT);showGate('rejected')}}catch(e){}
  },8000);
}
function showClosed(){
  if(S.closedShown)return;S.closedShown=true;casinoStop();showGate('closed');
  clearInterval(S.closedT);S.closedT=setInterval(async()=>{await loadPublicSettings();if(!siteClosed()){clearInterval(S.closedT);location.reload()}},15000);
}
async function enter(){
  if(S.booting||!S.user)return;
  if(S.started&&S.startedFor===S.user.id)return;
  S.booting=true;
  try{
    const st=await sb.rpc('my_status');
    if(st.error)throw st.error;
    const stt=st.data&&st.data.status;
    if(stt==='pending'){showGate('pending');pendingPoll();return}
    if(stt!=='approved'){showGate('rejected');return}
    clearInterval(pendingT);
    await fetchCore();
    if(!S.profile){showGate('profile');return}
    if(!S.profile.terms_accepted_at){showGate('terms');return}
    if(siteClosed()&&!isAdmin()){showClosed();return}
    startApp();
  }catch(e){console.error(e);toast(/live_core|static_core|my_status/.test(String(e&&e.message))?'Falta rodar a migração 6.0 no Supabase (SQL Editor) e recarregar.':'Não foi possível carregar os dados. Recarregue a página.','err',12000)}
  finally{S.booting=false}
}
function startApp(){
  S.started=true;S.startedFor=S.user.id;S.lastLevel=null;S.day=todaySP();
  S.closedShown=false;$('#ticker').classList.remove('hidden');$('#gate').classList.add('hidden');$('#shell').classList.remove('hidden');$('#bnav').classList.remove('hidden');
  S.viewSig=null;updateUserbar();renderTicker();render();dockUpdate();applyIcons();
  sb.rpc('run_cleanup',{p_force:false}).then(()=>{},()=>{});
  armMusic();musicLoad();chatStart();cmChatStart();priceStart();feedLoad(true);
  if(S.profile.last_daily_date!==todaySP())claimDaily(true);
  if(!S.timersOn){S.timersOn=true;
    setInterval(()=>{if(S.user&&S.started&&!document.hidden&&Date.now()-(S.lastRefresh||0)>=(PX.live?(isLite()?60000:45000):(isLite()?40000:20000)))refreshLight()},5000);
    setInterval(()=>{if(S.user&&S.started)sb.rpc('run_cleanup',{p_force:false}).then(()=>{},()=>{})},30*60*1000);
    setInterval(()=>{if(!S.user)return;const t=countdownTxt(nextResetMs()),a=$('#dailycd'),b=$('#dailycd2');if(a)a.textContent=t;if(b)b.textContent=t;if(S.day!==todaySP()){S.day=todaySP();claimDaily(true)}},1000);
    setInterval(()=>{if(S.user)musicTick()},4000);
    setInterval(()=>{if(S.user&&!document.hidden)cmTick()},1000);
    setInterval(()=>{if(S.user&&!document.hidden)musicLoad()},isLite()?90000:45000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&S.started)refreshLight()});
  }
}

  clearInterval(pendingT);casinoStop();chatStop();cmChatStop();cmRoomStop();CM.roomId=null;CM.room=null;CM.forum=null;CM.aucs=null;CM.prof={};CM.cosm=null;SH.boxes=null;SH.ach=null;SH.sub='itens';FEED.at=0;FEED.slides=[];clearInterval(FEED.t);musicStop();S.started=false;S.startedFor=null;S.profile=null;S.user=null;ADM.loaded=false;ADM.stats=null;S.tab='inicio';S.tradesInit=false;S.tradesPending=0;S.closedShown=false;clearInterval(S.closedT);MK.list=null;MK.trades=null;CMP.series=null;CMP.ids=null;

    case'adm-news-del':if(await confirmBox('Apagar esta notícia?','Apagar'))await admRpc('admin_delete_news',{p_id:Number(d.id)},'Notícia apagada.');break;
    case'adm-icon-save':{const v=($('#'+icKey(d.slot))?.value||'').trim();await admIconSet(d.slot,v,v?'Ícone salvo.':'Ícone restaurado ao padrão.');break}
    case'adm-icon-reset':await admIconSet(d.slot,'','Ícone restaurado ao padrão.');break;
    case'adm-open-toggle':{const open=d.open==='1';if(await confirmBox(open?'Abrir o site para todos os membros agora?':'Fechar o site? Membros comuns ficam sem acesso até você abrir.',open?'Abrir':'Fechar')){
      const{error}=await sb.rpc('admin_set_site_open',{p_open:open});if(error)throw error;S.settings.site_open=open;applySettings();toast(open?'Site aberto!':'Site fechado para os membros.');keepInputs(renderView)}break}
    case'adm-reset':{if(($('#rsConfirm')?.value||'').trim()!=='RESETAR'){toast('Digite RESETAR (em maiúsculas) para confirmar.','err');break}
      if(!await confirmBox('Última chance: resetar TODO o site? Saldos e preços voltam ao início e o histórico é apagado.','Sim, resetar'))break;
      const{error}=await sb.rpc('admin_reset_site',{p_confirm:'RESETAR',p_reset_xp:!!$('#rsXp')?.checked,p_close:!!$('#rsClose')?.checked});if(error)throw error;
      MK.list=null;MK.trades=null;CMP.series=null;ADM.stats=null;S.staticAt=0;await refreshLight('all');await admLoad();toast('Site resetado. Tudo começou do zero.','gain',6000);break}
    case'adm-cleanup':{const{error}=await sb.rpc('run_cleanup',{p_force:true});if(error)throw error;toast('Limpeza feita.');ADM.stats=null;await admStats();break}
    case'adm-stats':ADM.stats=null;keepInputs(renderView);await admStats();break;
    case'adm-slot-del':await admRpc('admin_remove_music_slot',{p_id:d.id,p_refund:d.refund==='1'},d.refund==='1'?'Removida e valor devolvido.':'Removida da fila.');await musicLoad();break;
  }}catch(err){toast(errMsg(err),'err');SFX.play('error')}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;
  if(f.dataset.form==='auth'){e.preventDefault();authSubmit()}
  else if(f.dataset.form==='chat'){e.preventDefault();chatSend()}
  else if(f.dataset.form==='cmchat'){e.preventDefault();cmChatSend()}
  else if(f.dataset.form==='acchat'){e.preventDefault();cmRoomSend()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='cmimg'){if(t.files&&t.files[0])cmChatSend();return}
  if(t.id==='cmpadd'){if(t.value&&CMP.ids.length<8){CMP.ids.push(t.value);CMP.touched=true;renderView()}return}
  if(t.id==='mkAsset'){const p=$('#mkPrice');if(p)p.value=Number(price(t.value))||'';return}
  if(t.dataset&&t.dataset.icfile){
    const f=t.files&&t.files[0];if(!f)return;
    try{const data=await resizeImageFile(f,t.dataset.icfile==='favicon'?64:96);await admIconSet(t.dataset.icfile,data,'Imagem enviada e aplicada.')}
    catch(err){toast(errMsg(err),'err')}
    t.value='';return}
  const pref=t.dataset&&t.dataset.pref;if(!pref)return;
  if(pref==='music'){if(t.checked!==P.music)musicToggle()}
  else if(pref==='sfx'){P.sfx=t.checked;savePrefs();if(P.sfx)SFX.play('coin')}
  else if(pref==='motion'){P.motion=t.checked;savePrefs()}
  else if(pref==='lite'){P.lite=t.value==='auto'?null:t.value==='on';savePrefs();S.tickSig='';render();toast(isLite()?'Modo leve ligado.':'Modo completo ligado.')}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.pref==='volume')musicSetVolume(Number(e.target.value)/100);if(e.target.id==='cmFind')cmFindFilter(e.target.value)});

/* ---------- partida ---------- */
(async()=>{
  FX.init();applySettings();showGate('loading');
  await loadPublicSettings();
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?.user||null,changed=(u&&u.id)!==(S.user&&S.user.id);
    if(!u){if(S.started||ev==='SIGNED_OUT'){teardown()}return}
    S.user=u;if(changed)setTimeout(enter,0);
  });
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){S.user=session.user;await enter()}else showGate('login');
})();


</script>
