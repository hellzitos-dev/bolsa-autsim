<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0919"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Bolsa do Autsim</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:dark;
  --ink:#0b0919; --panel:#15122b; --panel-2:#1e1a3c; --line:#2f2a5c; --line-soft:#231f48;
  --text:#f3f0ff; --muted:#a8a3d1; --dim:#6f6a9c;
  --accent:#8b5cf6; --accent-soft:color-mix(in srgb,var(--accent) 22%,transparent); --accent-hi:color-mix(in srgb,var(--accent) 60%,#fff);
  --gold:#ffc857; --up:#3ddc97; --down:#ff5d73; --red:#d8344d; --black:#1a1830; --green:#17a05d;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --r-panel:4px 22px 4px 22px; --r-btn:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h2{font-size:28px;font-weight:800;line-height:1.1}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent-hi)}
.hidden{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} small,.small{font-size:13px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* fundo */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,200,87,.07),transparent 60%),var(--ink)}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--accent);left:-12vmax;top:-10vmax}
.bg i:nth-child(2){background:#2a7fff;right:-16vmax;top:30vh;animation-duration:34s;opacity:.16}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
html.calm .bg i{animation:none}

/* topo */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px clamp(12px,3vw,28px);background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);border-radius:4px 14px 4px 14px;font-size:18px;box-shadow:0 6px 22px var(--accent-soft)}
.userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.bal{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);padding:4px 12px;border-radius:999px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.25)}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xpbar{width:84px;height:6px;border-radius:9px;background:var(--line-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}

/* ticker */
.ticker{position:relative;overflow:hidden;background:#07061320;border-bottom:1px solid var(--line-soft);height:44px;display:flex;align-items:center}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.ticker::before{left:0;background:linear-gradient(90deg,var(--ink),transparent)} .ticker::after{right:0;background:linear-gradient(270deg,var(--ink),transparent)}
.tk-track{display:flex;width:max-content;animation:marquee var(--dur,60s) linear infinite}
.ticker:hover .tk-track{animation-play-state:paused}
html.calm .tk-track{animation:none} html.calm .ticker{overflow-x:auto}
@keyframes marquee{to{transform:translateX(-50%)}}
.tk{display:flex;align-items:baseline;gap:9px;padding:0 22px;border:0;background:none;white-space:nowrap;cursor:pointer;font-size:14px}
.tk b{font-family:var(--display);font-weight:700;color:var(--muted)}
.tk .pr{font-weight:700}
.tk .ch{font-weight:700;font-size:13px}
.tk:hover b{color:var(--text)}
.tk-empty{margin:auto;color:var(--dim);font-size:13px}
.band{display:flex;justify-content:space-between;gap:16px;padding:6px clamp(12px,3vw,28px);font-size:13px;color:var(--muted);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent);border-bottom:1px solid var(--line-soft)}
.band b{color:var(--gold);font-weight:700}
.band .ann{color:var(--text)}

/* casca */
.shell{display:grid;grid-template-columns:188px minmax(0,1fr);gap:22px;max-width:1380px;margin:0 auto;padding:22px clamp(12px,3vw,28px) 90px}
.rail{position:sticky;top:112px;align-self:start;display:flex;flex-direction:column;gap:3px}
.rail button{display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border:0;background:none;border-radius:4px 14px 4px 14px;color:var(--muted);font-weight:600;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.rail button:hover{background:var(--panel);color:var(--text);transform:translateX(3px)}
.rail button.active{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.rail .ic{width:22px;text-align:center;font-size:17px}
.badge{margin-left:auto;background:var(--down);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
#view{min-width:0;animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
html.calm #view{animation:none}

/* componentes */
.panel{background:linear-gradient(165deg,var(--panel-2),var(--panel));border:1px solid var(--line-soft);border-radius:var(--r-panel);padding:18px;min-width:0;position:relative}
.panel.glow{border-color:var(--line);box-shadow:0 18px 60px -28px var(--accent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:14px 0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.page-head p{max-width:60ch;margin-top:6px}
.stat-label{color:var(--muted);font-size:13px}
.stat{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.hero-bal{font-size:clamp(40px,7vw,68px);color:var(--gold);line-height:1}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.acc{color:var(--accent-hi);border-color:var(--accent)}
.notice{padding:12px 14px;border-radius:4px 14px 4px 14px;border:1px solid var(--line);background:var(--accent-soft);color:#e6defc;margin:12px 0;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--dim)}

button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-btn);padding:8px 14px;font-weight:600;transition:transform .12s,filter .15s,background .15s}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
button:disabled{opacity:.42;cursor:not-allowed}
.btn-main{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 26px -10px var(--accent)}
.btn-good{background:#0f8f62;border-color:transparent;color:#fff}
.btn-bad{background:#b3304a;border-color:transparent;color:#fff}
.btn-gold{background:var(--gold);border-color:transparent;color:#2a1c00}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-lg{padding:14px 22px;font-size:17px}
input,select,textarea{background:#0a0817;border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-width:100%;width:100%}
input[type=number]{width:112px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=color]{padding:2px;height:38px;width:64px}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:9px;color:var(--text);font-size:14px}

.tablewrap{overflow:auto;border:1px solid var(--line-soft);border-radius:4px 16px 4px 16px;margin:10px 0 20px}
table{border-collapse:collapse;width:100%;background:#0d0b20}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--dim);font-weight:600;background:#110e26}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s} tbody tr:hover{background:#15122b}
.coin{display:inline-flex;align-items:center;gap:8px}
.coin img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line)}
.coin .sym{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
.coin .nm{color:var(--muted);font-size:13px}
.spark{display:block}
.me-row{background:var(--accent-soft)}
.podium td:first-child{font-family:var(--display);font-weight:800;font-size:18px}
.rank1{color:var(--gold)} .rank2{color:#cfd3e6} .rank3{color:#d79a6a}

/* loja */
.items{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.item{display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.item:hover{transform:translateY(-3px) rotate(-.4deg)}
.item .em{font-size:38px;line-height:1}
.item .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slotcard{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,var(--panel-2)),var(--panel))}

/* cassino */
.casino{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border-radius:99px;background:var(--panel);padding:8px 18px}
.subtabs button.active{background:var(--accent);border-color:transparent;color:#fff}
.arena{position:relative;overflow:hidden}
.cv-wrap{position:relative;width:100%;aspect-ratio:16/9;max-height:430px;border-radius:4px 18px 4px 18px;overflow:hidden;background:#07051a;border:1px solid var(--line-soft)}
.cv-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv-over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.cv-over .big{font-family:var(--display);font-weight:800;font-size:clamp(42px,9vw,92px);letter-spacing:-.04em;text-shadow:0 4px 40px #000}
.cv-over .sub{color:var(--muted);font-size:15px;margin-top:4px}
.crashed .big{color:var(--down)}
.betbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 10px;font-size:13px;border-radius:99px}
.colorbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.colorbtns button{padding:14px 8px;font-weight:800;font-size:16px;border:0;color:#fff;display:flex;flex-direction:column;gap:2px;align-items:center}
.colorbtns small{color:rgba(255,255,255,.75);font-weight:600}
.cb-red{background:var(--red)} .cb-black{background:#2a2750;border:1px solid var(--line)!important} .cb-green{background:var(--green)}
.hist{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 4px}
.hist span{min-width:30px;height:30px;padding:0 7px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.hist .h-red{background:var(--red)} .hist .h-black{background:#2a2750} .hist .h-green{background:var(--green)}
.hist .h-lo{background:#4a2740;color:#ff8da0} .hist .h-mid{background:#1e3a5a;color:#8dd0ff} .hist .h-hi{background:#4b3a12;color:var(--gold)}
.hist span:first-child{animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.livebets{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:12px}
.livebets .col{background:#0d0b20;border-radius:4px 14px 4px 14px;padding:10px;min-height:70px;font-size:13px}
.livebets .col h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.betline{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.betline.win{color:var(--up)} .betline.lose{color:var(--dim);text-decoration:line-through}
.rocketbets{margin-top:12px;display:grid;gap:4px;font-size:13px}
.rocketbets .betline{background:#0d0b20;padding:6px 10px;border-radius:8px}
.cash-btn{width:100%;margin-top:0;font-size:20px;padding:16px;animation:throb .9s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 8px rgba(61,220,151,.18)}}
html.calm .cash-btn{animation:none}

.chatbox{display:flex;flex-direction:column;height:min(640px,calc(100vh - 150px));position:sticky;top:112px;padding:0;overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.dot.on{background:var(--up);box-shadow:0 0 10px var(--up)}
#chatlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:9px;align-items:flex-start;animation:msgIn .25s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg .avatar{width:26px;height:26px;margin-top:2px}
.msg .who{font-weight:700;font-size:13px;color:var(--accent-hi)}
.msg.mine .who{color:var(--gold)}
.msg .txt{font-size:14px;overflow-wrap:anywhere;color:#e6e2fb}
.msg .del{margin-left:auto;padding:0 6px;font-size:12px;background:none;border:0;color:var(--dim)}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line-soft)}

.market{display:flex;flex-direction:column;gap:12px}
.poolbar{height:12px;border-radius:99px;overflow:hidden;display:flex;background:#0d0b20}
.poolbar i{display:block;height:100%;transition:width .6s}
.poolbar .y{background:var(--up)} .poolbar .n{background:var(--down)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sides>div{background:#0d0b20;border-radius:4px 14px 4px 14px;padding:10px 12px}

/* modal / toast / fx */
#modal{position:fixed;inset:0;z-index:100;background:rgba(5,4,14,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetIn{from{transform:translateY(24px) scale(.97);opacity:0}}
.sheet.wide{width:min(760px,100%)}
.formgrid{display:grid;gap:12px;margin:14px 0}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw);pointer-events:none}
.toast{pointer-events:auto;padding:11px 16px;border-radius:4px 14px 4px 14px;background:#191433;border:1px solid var(--accent);box-shadow:0 14px 40px #000a;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
.toast.err{border-color:var(--down)} .toast.gain{border-color:var(--gold);color:var(--gold)}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}}
#fx{position:fixed;inset:0;z-index:110;pointer-events:none}

/* musica */
.dock{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dock-bar{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:99px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);max-width:min(300px,calc(100vw - 28px));box-shadow:0 10px 30px #0008}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.eq i{width:3px;background:var(--accent-hi);border-radius:2px;height:4px}
.dock.playing .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{50%{height:16px}}
.dock-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dock-title small{display:block;line-height:1.1}
#spwrap{width:300px;max-width:calc(100vw - 28px);border-radius:12px;overflow:hidden}
#ytp{position:fixed;left:-20px;bottom:-20px;width:2px;height:2px;opacity:.01;pointer-events:none}

/* gate */
.gate{max-width:760px;margin:6vh auto;padding:0 16px;text-align:center}
.gate h1{font-size:clamp(42px,9vw,88px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:6px 0 18px}
.gate p.lead{color:var(--muted);max-width:52ch;margin:0 auto 22px;font-size:17px}
.gate .panel{text-align:left;max-width:520px;margin:0 auto}
.floaty{display:inline-block;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(6deg)}}
html.calm .floaty{animation:none}

/* admin */
.admtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.admtabs button{border-radius:99px;background:var(--panel)} .admtabs button.active{background:var(--accent);border-color:transparent;color:#fff}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border:0}

@media(max-width:1000px){.casino{grid-template-columns:1fr}.chatbox{position:static;height:460px}.cols{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;gap:10px;padding-top:12px}
  .rail{position:sticky;top:96px;z-index:30;flex-direction:row;overflow-x:auto;background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(10px);padding:6px 0;margin:0 -4px}
  .rail button{flex:none;padding:8px 12px} .rail button:hover{transform:none}
  .livebets{grid-template-columns:1fr}
  th,td{padding:9px}
}
@media(prefers-reduced-motion:reduce){.bg i,.tk-track,.floaty,.cash-btn,#view{animation:none!important}}

/* ============================================================
   4.0 — ícones personalizados, notícias, gráficos, mercado livre, celular e modo leve
   ============================================================ */
.hico{display:inline-flex;vertical-align:middle;margin-right:2px}
.ico-img{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;border-radius:3px}
.brand .logo.has-img{background:none;box-shadow:none}
.brand .logo .ico-img{width:100%;height:100%;border-radius:0}
.rail .ic,.bnav .ic{display:inline-grid;place-items:center}
.rail .ic .ico-img{width:22px;height:22px}
.item .em .ico-img{width:42px;height:42px}
.hero-bal .ico-img{width:.8em;height:.8em}
.bal .ico-img{width:20px;height:20px}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
fieldset{border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px 12px;margin:0;min-width:0}
legend{padding:0 6px;color:var(--muted);font-size:13px}
.note{white-space:normal;max-width:260px;color:var(--muted);font-size:13px}

/* faixa de notícias dentro do ticker */
.tk{align-items:center}
.tk-news{gap:10px}
.tk-news .nb{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--down);color:#fff}
.tk-news.info .nb{background:#2a7fff}
.tk-news.alert .nb{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{filter:brightness(1.5)}}
.tk-news .nt{font-weight:600;color:var(--text);max-width:560px;overflow:hidden;text-overflow:ellipsis}
.tk-news .nb .ico-img{width:14px;height:14px}

/* top 10 em barras divergentes */
.movers{display:flex;flex-direction:column;gap:3px;margin-top:12px}
.mv{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 74px 74px;align-items:center;gap:10px;padding:6px 8px;border:0;background:none;border-radius:8px;text-align:left;font-weight:600}
.mv:hover:not(:disabled){background:#15122b;filter:none;transform:none}
.mv-n .coin img{width:22px;height:22px}
.mv-bar{display:grid;grid-template-columns:1fr 1fr;height:20px;position:relative}
.mv-bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.mv-bar .neg,.mv-bar .pos{display:flex;align-items:center;height:100%}
.mv-bar .neg{justify-content:flex-end}
.mv-bar i{display:block;height:14px;min-width:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mv-bar .pos i{background:linear-gradient(90deg,#1c8f63,var(--up));border-radius:0 7px 7px 0}
.mv-bar .neg i{background:linear-gradient(270deg,#b3304a,var(--down));border-radius:7px 0 0 7px}
.mv-v{text-align:right;font-weight:800}
.mv-p{text-align:right;color:var(--muted);font-size:13px}

/* comparador */
.subtabs button .pill{margin-left:4px;padding:0 7px}
.cmp-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:7px 14px}
.seg button.active{background:var(--accent);color:#fff}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.selchip{display:inline-flex;align-items:center;gap:7px;padding:3px 4px 3px 11px;border-radius:99px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:700;font-size:14px}
.selchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.selchip button{padding:0 8px;border:0;background:none;color:var(--muted);border-radius:99px}
.chips-sel select{width:auto;min-width:190px}
.presets{margin-top:10px;gap:8px}
.chartbox{position:relative;height:340px;margin-top:12px}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.chart-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);pointer-events:none}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block}
.wealth{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.donutbox{height:260px;position:relative}.donutbox canvas{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-direction:column;gap:6px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 54px;gap:10px;align-items:center;font-size:14px}
.lg i{width:12px;height:12px;border-radius:4px}.lg small{text-align:right}

/* trocas */
.offer{margin-bottom:10px}
.offer-body{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
.offer-body>div{background:#0d0b20;border-radius:4px 14px 4px 14px;padding:10px 12px;overflow-wrap:anywhere}
.swap{color:var(--accent-hi);font-size:22px}
.offer-msg{margin-top:8px}
.offer.accepted{border-color:#1c8f63}.offer.rejected,.offer.cancelled,.offer.expired{opacity:.7}

/* ícones no painel ADM */
.iclist{padding:6px 16px}
.icrow{display:grid;grid-template-columns:44px minmax(120px,1fr) minmax(150px,1.2fr) 290px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.icrow:last-child{border:0}
.iclabel{display:flex;flex-direction:column;min-width:0}
.icprev{width:42px;height:42px;display:grid;place-items:center;font-size:24px;background:var(--panel);border-radius:10px}
.icprev .ico-img{width:30px;height:30px}
.filebtn{cursor:pointer;display:inline-block;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--panel-2);padding:5px 10px;font-weight:600;color:var(--text);font-size:13px;white-space:nowrap}
.filebtn:hover{filter:brightness(1.2)}

/* menu inferior (celular) */
.bnav{display:none}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.moregrid button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:4px 14px 4px 14px;font-size:15px}
.moregrid button.active{background:var(--accent);border-color:transparent;color:#fff}

/* modo leve: sem desfoques, sem fundo animado, quase sem animação */
html.lite .bg i{display:none}
html.lite .bg{background:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),var(--ink)}
html.lite header.top{backdrop-filter:none;background:var(--ink)}
html.lite #modal{backdrop-filter:none;background:rgba(5,4,14,.88)}
html.lite .dock-bar,html.lite .rail,html.lite .bnav{backdrop-filter:none}
html.lite .floaty,html.lite .cash-btn,html.lite .dock.playing .eq i,html.lite .tk-news.alert .nb,html.lite #view,html.lite .toast,html.lite .sheet,html.lite .msg,html.lite .hist span:first-child{animation:none}
html.lite .panel.glow,html.lite .btn-main{box-shadow:none}
html.lite button,html.lite .rail button,html.lite .item,html.lite tbody tr,html.lite .xpbar i,html.lite .mv-bar i,html.lite .poolbar i{transition:none}
html.lite .item:hover,html.lite button:hover:not(:disabled),html.lite .rail button:hover{transform:none}
html.lite .toast{box-shadow:none}
html.lite .brand .logo{box-shadow:none}

@media(max-width:1000px){.wealth{grid-template-columns:1fr}.donutbox{max-width:260px;margin:0 auto}}
@media(max-width:860px){
  .rail{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom));gap:2px}
  .bnav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600}
  .bnav button.active{color:var(--text);background:var(--accent-soft)}
  .bnav .ic{font-size:21px;line-height:1.1}.bnav .ic .ico-img{width:24px;height:24px}
  .bnav .badge{position:absolute;top:1px;right:calc(50% - 22px);margin:0}
  .shell{padding:12px 12px calc(150px + env(safe-area-inset-bottom))}
  .dock{bottom:calc(66px + env(safe-area-inset-bottom));left:10px}
  #toasts{bottom:calc(78px + env(safe-area-inset-bottom))}
  header.top{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .brand{font-size:18px;gap:8px;min-width:0}.brand .logo{width:30px;height:30px;font-size:16px;flex:none}
  #brandname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .userbar{gap:6px;flex-wrap:nowrap;flex:none}
  .bal{font-size:15px;padding:3px 9px}.iconbtn{width:32px;height:32px}
  h2{font-size:23px}
  .band{font-size:12px;padding:5px 12px}.band span:last-child{display:none}
  .mv{grid-template-columns:minmax(80px,112px) minmax(0,1fr) 62px;gap:8px}.mv-p{display:none}
  .chartbox{height:280px}
  .offer-body{grid-template-columns:1fr}.swap{text-align:center;transform:rotate(90deg)}
  .icrow{grid-template-columns:44px minmax(0,1fr)}.icrow .row{flex-wrap:wrap!important}.icrow input,.icrow .row{grid-column:1/-1}
  .casino .chatbox{height:380px}
  /* tabelas viram cartões */
  .tablewrap{border:0;overflow:visible;margin:10px 0 14px}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%;background:none}
  table.rt thead{display:none}
  table.rt tr{background:#0d0b20;border:1px solid var(--line-soft);border-radius:4px 14px 4px 14px;margin-bottom:10px;padding:6px 4px}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 10px;white-space:normal;text-align:right;min-height:30px}
  table.rt td::before{content:attr(data-l);color:var(--dim);font-size:12px;text-align:left;flex:none}
  table.rt td:not([data-l])::before{display:none}
  table.rt td:not([data-l]){justify-content:flex-end}
  table.rt td.empty{display:block;text-align:center}
  table.rt td .row{justify-content:flex-end}
  table.rt td.note{max-width:none}
  table.rt td:empty{display:none}
  table.rt tr.podium td:first-child{font-size:inherit}
}
@media(max-width:520px){
  .uname,.lvl,.adm-pill{display:none}
  .userbar .avatar{display:none}
  .btn-out{display:none}
  .gate h1{font-size:40px}
  .cols3{grid-template-columns:1fr}
  .sheet{padding:14px}
  .grid{grid-template-columns:1fr 1fr}
  .stat{font-size:22px}
  .setrow{grid-template-columns:1fr}
}

/* ============================================================
   5.0 — nicks coloridos, carrossel, cotação, comunidade, leilões, perfis
   ============================================================ */
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.itemimg{width:28px;height:28px;object-fit:cover;border-radius:6px;vertical-align:middle}
.filepv img{max-width:100%;max-height:150px;margin-top:6px;border-radius:8px;border:1px solid var(--line)}
.nick{font-weight:800}
.nk-gold{background:linear-gradient(90deg,#ffd76a,#ffb300,#fff1b0,#ffb300);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nkShine 4s linear infinite}
.nk-silver{background:linear-gradient(90deg,#e8ecf5,#9aa4b8,#ffffff,#9aa4b8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nkShine 5s linear infinite}
.nk-rainbow{background:linear-gradient(90deg,#ff5d73,#ffc857,#3ddc97,#5cc8ff,#a06bff,#ff5d73);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nkShine 3s linear infinite}
.nk-fire{background:linear-gradient(90deg,#ff3d00,#ffab00,#ff3d00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nkShine 2.4s linear infinite}
.nk-ice{background:linear-gradient(90deg,#8be9ff,#e3fbff,#4aa8ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nkShine 4s linear infinite}
.nk-neon{color:#39ff88;text-shadow:0 0 8px rgba(57,255,136,.7)}
.nk-rose{color:#ff7ac8;text-shadow:0 0 8px rgba(255,122,200,.45)}
@keyframes nkShine{to{background-position:200% center}}
html.lite .nick{animation:none!important}
html.lite .nk-gold,html.lite .nk-silver,html.lite .nk-rainbow,html.lite .nk-fire,html.lite .nk-ice{background-size:100% auto}
.uname.linkbtn{font-weight:700}
.tokpill{cursor:default}

/* anúncios na faixa do topo */
.tk-ad{gap:10px}
.tk-ad .nb{display:inline-flex;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--gold);color:#241a00}
.tk-ad .nt{font-weight:600;color:var(--text)}

/* carrossel 1080×720 (3:2) */
.carousel{position:relative;width:100%;max-width:1080px;margin:0 auto 4px;aspect-ratio:3/2;border-radius:4px 26px 4px 26px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 22px 70px -34px var(--accent)}
.car-stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s}
.slide.on{opacity:1;visibility:visible;z-index:1}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide-bg{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,14vw,150px);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#10082a),#0b0919 70%)}
.slide-bg.ph-auction{background:linear-gradient(135deg,#3b1d6e,#0b0919 70%)}
.slide-bg.ph-closed{background:linear-gradient(135deg,#2a2a44,#0b0919 70%)}
.slide-bg.ph-ad{background:linear-gradient(135deg,#6d4a00,#0b0919 70%)}
.slide-bg span{opacity:.5}
.slide-hit{position:absolute;inset:0;z-index:2;background:none;border:0;cursor:pointer;padding:0}
.slide-cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:clamp(14px,3vw,28px) clamp(14px,3vw,30px) clamp(30px,5vw,44px);background:linear-gradient(0deg,rgba(7,5,20,.92),rgba(7,5,20,.55) 60%,transparent);pointer-events:none}
.slide-cap h3{font-size:clamp(18px,3.4vw,34px);font-weight:800;margin-top:8px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.slide-cap p{margin-top:6px;color:#e6e2fb;font-size:clamp(13px,1.6vw,16px);max-width:60ch;overflow-wrap:anywhere}
.slide-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.car-nav{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;padding:0;font-size:26px;line-height:1;background:rgba(10,8,28,.6);border:1px solid var(--line);color:#fff}
.car-nav.prev{left:10px}.car-nav.next{right:10px}
.car-dots{position:absolute;left:0;right:0;bottom:10px;z-index:3;display:flex;justify-content:center;gap:8px}
.car-dots button{width:10px;height:10px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);border:0}
.car-dots button.on{background:var(--gold);width:24px;border-radius:99px}
html.lite .slide{transition:none}

/* apostas badaladas */
.hotrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line-soft)}
.hotrow:first-of-type{margin-top:10px}
.hot-main{min-width:0;flex:1}.hot-main b{display:block;overflow-wrap:anywhere}
.hot-main small{display:block;margin-top:2px}
.hotbar{height:6px;border-radius:9px;background:var(--down);margin-top:8px;overflow:hidden}
.hotbar i{display:block;height:100%;background:var(--up)}

/* janela de compra e venda */
.tq .chips{margin:8px 0}
.tqbox{margin-top:10px;transition:opacity .15s}
.tqbox.stale{opacity:.5}
.tq-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:4px 14px 4px 14px;background:var(--accent-soft);border:1px solid var(--line)}
.tq-total b{font-family:var(--display);font-size:28px}
.tq-rows{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tq-rows td{padding:6px 2px;border-bottom:1px solid var(--line-soft)}
.tq-rows td:last-child{text-align:right;font-weight:600}
.tq-rows tr.hl td{color:var(--gold)}
.tq-info{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}

/* comunidade */
.subtabs.sm button{padding:6px 14px;font-size:14px}
.cm-chat{height:min(620px,calc(100vh - 220px));position:static}
.msg.bid{background:linear-gradient(90deg,rgba(255,200,87,.16),transparent);border-left:3px solid var(--gold);padding:6px 8px;border-radius:6px}
.msg.sys{justify-content:center}.msg.sys .txt{color:var(--muted);font-size:13px;text-align:center}
.bidtag{display:inline-block;background:var(--gold);color:#241a00;font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:99px}
.postlist{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.post{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:3/2;background:var(--panel-2);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg.ph{display:grid;place-items:center;font-size:54px;opacity:.7}
.pimg.big{border-radius:12px;max-height:520px}
.pbody{padding:14px 16px 16px}
.post.is-fake{border-color:var(--down)}.post.is-fake .pimg img{filter:grayscale(.8) brightness(.7)}
.post.is-exp{opacity:.65}
.fakeseal{display:inline-block;transform:rotate(-3deg);border:2px solid var(--down);color:var(--down);font-weight:900;letter-spacing:.1em;padding:1px 10px;border-radius:6px;font-size:13px;background:rgba(255,93,115,.1)}
.vote{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
.vote.on.up{border-color:var(--up);color:var(--up)}.vote.on.down{border-color:var(--down);color:var(--down)}
.vote.ro{opacity:.7;cursor:default}
.aucgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.acard{padding:0;overflow:hidden;text-align:left;cursor:pointer;display:block;width:100%}
.acard:hover{border-color:var(--accent)}
.roomgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr);align-items:start}
.roomgrid .chatbox{position:sticky;top:112px}
.mgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.mcard{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;padding:12px}
.mcard:hover{border-color:var(--accent)}
.mname{font-family:var(--display);font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.avatar.lg{width:48px;height:48px}.avatar.xl{width:84px;height:84px;border:3px solid var(--panel)}

/* perfil */
.profmodal{max-width:100%}
.pbanner{height:140px;border-radius:4px 18px 4px 18px;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 60%,#10082a),#0b0919)}
.pbanner img{width:100%;height:100%;object-fit:cover;display:block}
.phead{display:flex;gap:14px;align-items:flex-end;margin:-38px 0 8px 14px;position:relative;flex-wrap:wrap}
.pblock{margin-top:14px}.pblock h3{margin-bottom:6px}
.vitrine{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.vit{position:relative;border:1px solid var(--line-soft);background:var(--panel-2);border-radius:12px;padding:8px;text-align:center;overflow:hidden}
.vit img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px}
.vit .vemo{display:block;font-size:34px;padding:10px 0}
.vit .vn{display:block;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vit .nft{position:absolute;top:6px;right:6px;padding:0 7px;font-size:10px}
.wall{display:flex;gap:10px;flex-wrap:wrap}
.ach{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:5px 14px 5px 6px;font-size:13px}
.ach img{width:30px;height:30px;object-fit:cover;border-radius:50%}
.ach .aemo{font-size:22px}
.ach.cas{border-color:var(--gold)}

/* cosméticos */
.cos-prev{font-family:var(--display);font-size:26px;padding:10px 0}
.itemtag{display:inline-flex;gap:4px;align-items:center}

@media(max-width:1000px){.roomgrid{grid-template-columns:1fr}.roomgrid .chatbox{position:static;height:460px}}
@media(max-width:520px){
  .car-nav{width:34px;height:34px;font-size:22px}
  .carousel{border-radius:4px 18px 4px 18px}
  .hotrow{flex-direction:column;align-items:stretch}
  .pbanner{height:96px}.avatar.xl{width:68px;height:68px}
  .tq-total b{font-size:23px}
}

/* início 5.0: carrossel ao lado das apostas badaladas */
.home-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start;margin-bottom:4px}
.home-top .carousel{max-width:none;margin:0}
@media(max-width:1100px){.home-top{grid-template-columns:minmax(0,1fr)}}
.home-top>.panel{margin-top:0!important}

/* ticker: número que acabou de mudar pisca */

@keyframes slidein{from{opacity:0}to{opacity:1}}

/* ============================================================ 6.0 ============================================================ */
:root{--r-comum:#e5e7eb;--r-raro:#3b82f6;--r-epico:#a855f7;--r-lendario:#f5b301}
.rar-comum{--rc:var(--r-comum)} .rar-raro{--rc:var(--r-raro)} .rar-epico{--rc:var(--r-epico)} .rar-lendario{--rc:var(--r-lendario)}
.rar{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--rc);border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.ttl{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle;color:var(--rc,#e5e7eb);border:1px solid var(--rc,#e5e7eb);background:color-mix(in srgb,var(--rc,#e5e7eb) 14%,transparent);font-family:var(--body);cursor:default}
button.ttl{cursor:pointer;margin:0;padding:5px 14px;font-size:13px}
.ttl.on{background:color-mix(in srgb,var(--rc) 35%,transparent)}
.rar-lendario .ttl,.ttl.rar-lendario{box-shadow:0 0 10px color-mix(in srgb,var(--r-lendario) 45%,transparent)}
.iam{font-size:16px;line-height:1.9}
.iam .ttl{margin:0 3px;padding:2px 12px;font-size:13px}

/* peças de item */
.itile{position:relative;width:118px;flex:none;border-radius:10px;padding:8px 6px 6px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,var(--panel-2)),var(--panel-2));border:1px solid color-mix(in srgb,var(--rc) 70%,transparent);border-bottom:4px solid var(--rc)}
.itile img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block;pointer-events:none;user-select:none}
.itile .iph{display:grid;place-items:center;aspect-ratio:3/2;font-size:30px}
.itile .itn{display:block;font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e6e2fb}
.itile.sm{width:92px}.itile.big{width:150px}
.itile.dim{opacity:.45}

/* loja de caixas */
.boxgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.boxcard{display:flex;flex-direction:column;gap:8px}

.bximg{display:grid;place-items:center;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%)}

.bph{font-size:64px}
.boxcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.rarbar{display:flex;height:7px;border-radius:9px;overflow:hidden;gap:2px;background:var(--line-soft)}
.rarbar i{display:block;background:var(--rc)}
.oddslist{display:grid;gap:6px;max-height:60vh;overflow:auto}
.oddrow{display:flex;align-items:center;gap:12px;padding:4px;border-radius:10px;border:1px solid var(--line-soft)}

/* roleta de abertura (estilo CS:GO) */
.reelmodal{width:100%;min-width:0}
.reelwin{flex-wrap:wrap;text-align:left}
.reelwrap{position:relative;overflow:hidden;margin:14px 0;border-radius:12px;background:#0a0816;border:1px solid var(--line);padding:14px 0}
.reelwrap::before,.reelwrap::after{content:"";position:absolute;top:0;bottom:0;width:14%;z-index:2;pointer-events:none}
.reelwrap::before{left:0;background:linear-gradient(90deg,#0a0816,transparent)}
.reelwrap::after{right:0;background:linear-gradient(270deg,#0a0816,transparent)}
.reelptr{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--gold);z-index:3;box-shadow:0 0 12px var(--gold)}
.reelptr::before{content:"";position:absolute;top:-1px;left:-6px;border:7px solid transparent;border-top-color:var(--gold)}
.reelstrip{display:flex;width:max-content;will-change:transform}
.itile.reel{margin:0 5px;width:130px}
.itile.reel.dim{opacity:.35;transition:opacity .4s}
.reelres{min-height:90px}
.reelwin{display:flex;gap:16px;align-items:center;justify-content:center;padding:12px;border-radius:14px;border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,transparent);animation:pop .5s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
html.lite .reelwrap::before,html.lite .reelwrap::after{display:none}

/* inventário */
.invgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.achmodal{text-align:center;padding:6px 6px 0}
.achbig{width:120px;height:120px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;border:3px solid var(--rc);background:var(--panel-2);overflow:hidden;box-shadow:0 0 30px color-mix(in srgb,var(--rc) 40%,transparent)}

.achbig .aemo{font-size:60px}
button.ach{cursor:pointer;border-color:var(--rc);color:inherit}
button.ach:hover{background:color-mix(in srgb,var(--rc) 14%,var(--panel-2))}
.ach.rar-lendario{box-shadow:0 0 10px color-mix(in srgb,var(--r-lendario) 40%,transparent)}
.vit{border-bottom:3px solid var(--rc,var(--line-soft))}

/* login / aprovação */

/* chat com imagem */
.imgbtn{display:grid;place-items:center;width:42px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:18px;flex:none}

.chatimg{display:block;margin-top:4px}
.chatimg img{max-width:min(260px,100%);max-height:200px;border-radius:10px;display:block}

/* painel ADM: tabela de drops */
.boxrows{display:grid;gap:8px;max-height:46vh;overflow:auto}
.droprow{display:grid;grid-template-columns:64px 1.4fr 1fr .8fr .8fr auto auto;gap:8px;align-items:end;padding:8px;border-radius:10px;border:1px solid var(--rc);border-left-width:5px;background:var(--panel-2)}
.droprow label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.droprow input,.droprow select{width:100%;min-width:0}
.dr-img{width:64px;height:48px;border-radius:8px;background:var(--panel);display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--dim)}
.dr-img img{width:100%;height:100%;object-fit:contain}
@media(max-width:720px){.droprow{grid-template-columns:1fr 1fr}.itile.reel{width:104px}.reelmodal{min-width:0}}
.badge{white-space:nowrap}
.pbanner.bn-plain{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--rc) 55%,#10082a),#0b0919);box-shadow:0 0 0 2px var(--rc)}
.bn-name{font-family:var(--display);font-weight:800;font-size:28px;color:#fff;text-shadow:0 2px 12px var(--rc)}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
/* ============================================================
   BOLSA DO AUTSIM 6.0 — núcleo: config, estado, utilitários, sons, efeitos
   ============================================================ */
const SUPABASE_URL='https://vyhhbepqikaizjyuogxk.supabase.co';
const SUPABASE_KEY='sb_publishable_te15kBxoDWsrWci0NhVY3w_M8ZC38XB';
// Login nativo: o e-mail interno do Supabase é sempre "usuario@autsim.app" (o jogador só vê usuário + senha).
const authEmail=u=>String(u||'').trim().toLowerCase()+'@autsim.app';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtMult=m=>fmt(m,2)+'x';
const pctTxt=p=>(p>0?'+':'')+fmt(p,2)+'%';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease={out3:t=>1-Math.pow(1-t,3),out5:t=>1-Math.pow(1-t,5)};
const TYPE_NAMES={buy:'Compra',sell:'Venda',bonus:'Bônus',game:'Jogo',adjust:'Ajuste do ADM',shop:'Loja',daily:'Bônus diário',bet:'Aposta',win:'Prêmio',refund:'Devolução',music:'Música',trade:'Troca',fine:'Multa',auction:'Leilão',ad:'Anúncio',cosmetic:'Cosmético',box:'Caixa',level:'Reset de nível'};

/* ---------- preferências (neste navegador) ---------- */
const PREFS_KEY='autsim_prefs_v3';
// lite: null = automático (celular e PC fraco ficam no modo leve), true = sempre leve, false = sempre completo
const P={music:false,volume:0.5,sfx:true,motion:!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),lite:null};
try{Object.assign(P,JSON.parse(localStorage.getItem(PREFS_KEY)||'{}'))}catch(e){}
const isLite=()=>document.documentElement.classList.contains('lite');
function applyPerf(){const lite=P.lite===true||(P.lite!==false&&!!window.__LITE_AUTO);document.documentElement.classList.toggle('lite',lite);document.documentElement.classList.toggle('calm',!P.motion)}
function savePrefs(){try{localStorage.setItem(PREFS_KEY,JSON.stringify(P))}catch(e){}applyPerf()}
applyPerf();
/* ---------- estado ---------- */
const S={user:null,profile:null,profiles:[],assets:[],holdings:[],tx:[],items:[],inventory:[],
  movers:{},news:[],icons:{},settings:{site_name:'Bolsa do Autsim',announcement:'',accent_color:'#8b5cf6',daily_bonus:500,site_open:true},
  xpConfig:{base:100,exponent:1.55,endgame_bonus:18000},tab:'inicio',charts:{},chartAsset:null,unread:0,dailyChecked:false,lastLevel:null};
const me=()=>S.profile||{balance:0,xp:0,username:'Membro'};
const profile=id=>S.profiles.find(x=>x.id===id)||{};
const asset=id=>S.assets.find(x=>x.id===id)||{};
const held=(uid,aid)=>Number(S.holdings.find(x=>x.user_id===uid&&x.asset_id===aid)?.quantity||0);
const sold=aid=>S.holdings.filter(x=>x.asset_id===aid).reduce((n,x)=>n+Number(x.quantity||0),0);
const price=aid=>Number(asset(aid).price||0);
const worth=uid=>Number(profile(uid).balance||0)+S.holdings.filter(x=>x.user_id===uid).reduce((n,x)=>n+Number(x.quantity)*price(x.asset_id),0);
const isAdmin=()=>!!me().is_admin;

function xpForLevel(l){if(l<=1)return 0;const x=(l-1)/98;return Math.round(Number(S.xpConfig.base||100)*Math.pow(l-1,Number(S.xpConfig.exponent||1.55))+Number(S.xpConfig.endgame_bonus||18000)*Math.pow(x,5))}
const maxLevel=()=>clamp(Number(S.settings.max_level||50),2,99);
function levelOf(xp){let l=1;const m=maxLevel();while(l<m&&xp>=xpForLevel(l+1))l++;return l}
function xpProgress(xp){const m=maxLevel(),l=levelOf(xp),lo=xpForLevel(l),hi=xpForLevel(Math.min(m,l+1));return{l,lo,hi,max:m,pct:l>=m?100:clamp((xp-lo)/(hi-lo)*100,0,100)}}

/* ---------- relógio do servidor (para animações sincronizadas) ---------- */
let clockOffset=0,clockInit=false;
const srvNow=()=>Date.now()+clockOffset;
function syncClock(iso,t0,t1){const t=Date.parse(iso);if(isNaN(t))return;const off=t-(t0+t1)/2;clockOffset=clockInit?clockOffset*.7+off*.3:off;clockInit=true}
async function stateRpc2(fn,args){const t0=Date.now();const r=await sb.rpc(fn,args);const t1=Date.now();if(r.error)throw r.error;if(r.data?.now)syncClock(r.data.now,t0,t1);return r.data}
async function stateRpc(fn){const t0=Date.now();const r=await sb.rpc(fn);const t1=Date.now();if(r.error)throw r.error;if(r.data?.now)syncClock(r.data.now,t0,t1);return r.data}

/* ---------- toasts, modal ---------- */
function toast(msg,kind='ok',ms=4200){const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+(kind==='ok'?'':kind);t.textContent=msg;box.appendChild(t);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>t.remove(),ms)}
const errMsg=e=>(e&&(e.message||e.error_description))||'Algo deu errado. Tente de novo.';
function openModal(html,wide=false){const m=$('#modal');m.innerHTML=`<div class="panel sheet${wide?' wide':''}">${html}</div>`;m.classList.remove('hidden');const f=m.querySelector('input,select,textarea,button.btn-main');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
document.addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
function confirmBox(msg,okLabel='Confirmar'){return new Promise(res=>{openModal(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:18px;justify-content:flex-end"><button id="cfNo">Cancelar</button><button id="cfYes" class="btn-main">${esc(okLabel)}</button></div>`);$('#cfNo').onclick=()=>{closeModal();res(false)};$('#cfYes').onclick=()=>{closeModal();res(true)}})}
/* Formulário genérico: fields=[{name,label,type,value,options,hint,required}] */
function openForm({title,intro,fields,submit='Salvar',onSubmit,wide=false}){
  const inputs=fields.map(f=>{const id='f_'+f.name,v=f.value??'';let c;
    if(f.type==='textarea')c=`<textarea id="${id}" rows="3" ${f.max?`maxlength="${f.max}"`:''}>${esc(v)}</textarea>`;
    else if(f.type==='select')c=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    else if(f.type==='file')c=`<input id="${id}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-pv="${id}_pv"><div class="filepv" id="${id}_pv"></div>`;
    else if(f.type==='checkbox')return `<label class="inline"><input id="${id}" type="checkbox" ${v?'checked':''}> ${esc(f.label)}</label>`;
    else c=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max&&f.type!=='number'?`maxlength="${f.max}"`:''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.type==='number'?'style="width:100%"':''}>`;
    return `<label>${esc(f.label)}${c}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`}).join('');
  openModal(`<h3>${esc(title)}</h3>${intro?`<p class="muted" style="margin-top:6px">${esc(intro)}</p>`:''}<form id="genform"><div class="formgrid">${inputs}</div><div class="row" style="justify-content:flex-end"><button type="button" id="gfCancel">Cancelar</button><button type="submit" class="btn-main">${esc(submit)}</button></div></form>`,wide);
  $('#gfCancel').onclick=closeModal;
  $$('#genform input[type=file]').forEach(inp=>inp.addEventListener('change',()=>{const pv=$('#'+inp.dataset.pv),f=inp.files&&inp.files[0];if(!pv)return;pv.innerHTML='';if(f&&/^image\//.test(f.type)){const u=URL.createObjectURL(f);pv.innerHTML=`<img src="${u}" alt="prévia">`}}));
  $('#genform').onsubmit=async ev=>{ev.preventDefault();const vals={};for(const f of fields){const el=$('#f_'+f.name);vals[f.name]=f.type==='checkbox'?el.checked:f.type==='file'?((el.files&&el.files[0])||null):(f.type==='number'?(el.value===''?null:Number(el.value)):el.value)}
    const btn=ev.submitter||$('#genform button[type=submit]');btn.disabled=true;try{await onSubmit(vals);closeModal()}catch(e){toast(errMsg(e),'err')}finally{btn.disabled=false}};
}

/* ---------- números animados ---------- */
function countTo(el,to,dur=700,dec=2){if(!el)return;to=Number(to||0);const from=el.dataset.v!==undefined?Number(el.dataset.v):to;el.dataset.v=to;
  if(!P.motion||isLite()||from===to){el.textContent=fmt(to,dec);return}
  const t0=performance.now();const f=t=>{const p=clamp((t-t0)/dur,0,1);el.textContent=fmt(from+(to-from)*ease.out3(p),dec);if(p<1&&el.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- efeitos sonoros (sintetizados, sem arquivos) ---------- */
const SFX={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,d=.08,type='sine',vol=.05,at=0,to=0){const c=this.ctx;if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)},
  play(n){if(!P.sfx)return;this.init();if(!this.ctx)return;
    switch(n){
      case'click':this.tone(520,.05,'triangle',.03);break;
      case'coin':this.tone(988,.07,'square',.03);this.tone(1319,.14,'square',.03,.07);break;
      case'win':[523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.05,i*.08));break;
      case'lose':this.tone(240,.28,'sawtooth',.04,0,110);break;
      case'tick':this.tone(1200,.03,'square',.015);break;
      case'launch':this.tone(120,.6,'sawtooth',.04,0,520);break;
      case'cash':this.tone(784,.08,'triangle',.06);this.tone(1175,.18,'triangle',.06,.08);break;
      case'crash':this.tone(180,.45,'sawtooth',.07,0,40);break;
      case'chat':this.tone(740,.06,'sine',.03);break;
      case'error':this.tone(200,.15,'square',.03);break;
      case'level':[392,523,659,784,1047].forEach((f,i)=>this.tone(f,.18,'triangle',.05,i*.07));break;
    }}};

/* ---------- confete e chuva de moedas ---------- */
const FX={cv:null,cx:null,parts:[],run:false,
  init(){this.cv=$('#fx');this.cx=this.cv&&this.cv.getContext?this.cv.getContext('2d'):null;this.resize();addEventListener('resize',()=>this.resize())},
  resize(){if(this.cv){this.cv.width=innerWidth;this.cv.height=innerHeight}},
  add(p){this.parts.push(p);if(!this.run&&this.cx){this.run=true;requestAnimationFrame(()=>this.step())}},
  confetti(x=innerWidth/2,y=innerHeight/3,n=70){if(!P.motion||isLite()||!this.cx)return;const cols=['#ffc857','#8b5cf6','#3ddc97','#ff5d73','#5cc8ff','#fff'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,g:.28,life:90+Math.random()*50,c:cols[i%cols.length],w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4})}},
  rain(n=26){if(!P.motion||isLite()||!this.cx)return;for(let i=0;i<n;i++)this.add({x:Math.random()*innerWidth,y:-30-Math.random()*400,vx:(Math.random()-.5)*1.5,vy:3+Math.random()*4,g:.05,life:200,emoji:'🪙',size:20+Math.random()*16,r:0,vr:(Math.random()-.5)*.1})},
  step(){const c=this.cx;c.clearRect(0,0,this.cv.width,this.cv.height);this.parts=this.parts.filter(p=>{p.life--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.life<=0||p.y>innerHeight+60)return false;
      c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=clamp(p.life/30,0,1);if(p.emoji){c.font=p.size+'px serif';c.fillText(p.emoji,-p.size/2,0)}else{c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h)}c.restore();return true});
    if(this.parts.length)requestAnimationFrame(()=>this.step());else{this.run=false;c.clearRect(0,0,this.cv.width,this.cv.height)}}};

/* ---------- sparkline em SVG ---------- */
function spark(arr,w=96,h=28){arr=(arr||[]).map(Number);if(arr.length<2)return`<svg class="spark" width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#4a4580" stroke-dasharray="3 3"/></svg>`;
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1,up=arr[arr.length-1]>=arr[0];
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*(w-2)+1).toFixed(1)},${(h-3-((v-mn)/rg)*(h-6)).toFixed(1)}`).join(' ');
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'#3ddc97':'#ff5d73'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

function imgToBlob(file,w,h,mode){
  return new Promise((res,rej)=>{
    if(!file){rej(new Error('Escolha uma imagem.'));return}
    if(!/^image\//.test(file.type)){rej(new Error('O arquivo precisa ser uma imagem.'));return}
    if(file.size>12e6){rej(new Error('Imagem muito grande (máximo 12 MB).'));return}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
      const big=w>=600,r=mode==='contain'?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height),dw=img.width*r,dh=img.height*r;
      if(big){c.fillStyle='#0b0919';c.fillRect(0,0,w,h)}
      c.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(url);
      /* banners grandes saem em JPEG (uns 100–250 KB em vez de 1–2 MB): o site carrega muito mais rápido */
      if(big){cv.toBlob(j=>j?res(j):rej(new Error('Não consegui converter a imagem.')),'image/jpeg',.82);return}
      cv.toBlob(b=>{if(!b){rej(new Error('Não consegui converter a imagem.'));return}
        if(b.size>150e3)cv.toBlob(j=>j?res(j):res(b),'image/jpeg',.85);else res(b)},'image/png')}catch(e){rej(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não consegui ler essa imagem.'))};img.src=url;
  });
}
/* Envia para o Storage do Supabase (bucket "autsim") e devolve o link público. opts: {w,h,mode:'cover'|'contain',admin} */
async function uploadImage(file,o){
  const blob=await imgToBlob(file,o.w,o.h,o.mode||'cover');
  const ext=blob.type==='image/png'?'png':'jpg',name=Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;
  const path=(o.admin&&isAdmin()?'admin/':'u/'+S.user.id+'/')+name;
  const{error}=await sb.storage.from('autsim').upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});
  if(error)throw new Error(/bucket|not found/i.test(error.message||'')?'O armazenamento de imagens ainda não foi criado. Rode a migração 5.0 no Supabase.':(error.message||'Falha no envio da imagem.'));
  return sb.storage.from('autsim').getPublicUrl(path).data.publicUrl;
}

/* Imagem/GIF do chat: vai para a pasta "chat/" e some em 30 minutos. GIF sobe como está (até 1,5 MB). */
async function uploadChatImage(file){
  if(!file||!/^image\//.test(file.type))throw new Error('Escolha uma imagem ou GIF.');
  let blob=file,ext='gif';
  if(file.type==='image/gif'){if(file.size>1.5e6)throw new Error('O GIF pode ter no máximo 1,5 MB.')}
  else{blob=await imgToBlob(file,800,800,'contain');ext=blob.type==='image/png'?'png':'jpg'}
  const path='chat/'+S.user.id+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.'+ext;
  const{error}=await sb.storage.from('autsim').upload(path,blob,{contentType:blob.type||file.type,cacheControl:'3600'});
  if(error)throw new Error(error.message||'Falha no envio da imagem.');
  const url=sb.storage.from('autsim').getPublicUrl(path).data.publicUrl;
  setTimeout(()=>{sb.storage.from('autsim').remove([path]).then(()=>{},()=>{})},31*60*1000);
  return url;
}

/* ============================================================
   Gráficos próprios (canvas, sem biblioteca): linhas com comparação e rosca
   ============================================================ */
const SERIES_COLORS=['#8b5cf6','#3ddc97','#ffc857','#ff5d73','#5cc8ff','#f472b6','#fb923c','#a3e635'];

function niceTicks(lo,hi,n=5){
  const span=hi-lo||1,raw=span/(n-1),mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<1.5?1:f<3?2:f<7?5:10)*mag,start=Math.floor(lo/step)*step,out=[];
  for(let v=start;v<=hi+step*.5;v+=step)out.push(+v.toFixed(10));
  return out;
}
function timeLabel(ms,spanH){
  const d=new Date(ms),hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(spanH<=30)return hh;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+hh;
}
function valueAt(pts,t){ // último ponto até o instante t (o preço fica igual até a próxima mudança)
  let lo=0,hi=pts.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(pts[m][0]<=t){r=m;lo=m+1}else hi=m-1}
  return r;
}

/* cfg: {series:[{id,name,color,hidden,pts:[[ms,preço]]}], mode:'price'|'pct', fill:boolean} */
function lineChart(cv,cfg){
  if(!cv)return;
  const st=cv._c||(cv._c={});st.cfg=cfg;
  if(!st.bound){
    st.bound=true;
    const mv=e=>{const r=cv.getBoundingClientRect();st.hx=e.clientX-r.left;st.hy=e.clientY-r.top;chartSchedule(cv)};
    cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
    cv.addEventListener('pointerleave',()=>{st.hx=null;chartSchedule(cv)});
    if(window.ResizeObserver){const ro=new ResizeObserver(()=>chartSchedule(cv));ro.observe(cv)}
  }
  chartSchedule(cv);
}
function chartSchedule(cv){const st=cv._c;if(!st||st.raf)return;st.raf=requestAnimationFrame(()=>{st.raf=0;if(cv.isConnected)chartPaint(cv)})}

function chartPaint(cv){
  const st=cv._c,cfg=st.cfg;if(!cfg)return;
  const dpr=Math.min(isLite()?1:2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const pct=cfg.mode==='pct';
  const vis=cfg.series.filter(s=>!s.hidden&&s.pts&&s.pts.length);
  const padL=pct?58:62,padR=16,padT=14,padB=28,pw=W-padL-padR,ph=H-padT-padB;
  c.font='11px Inter,system-ui,sans-serif';c.textBaseline='middle';
  if(!vis.length){c.fillStyle='#6f6a9c';c.textAlign='center';c.fillText('Escolha ao menos uma moeda para ver o gráfico.',W/2,H/2);return}
  // dados na escala certa (preço ou % sobre o primeiro ponto)
  const data=vis.map(s=>{const base=Number(s.pts[0][1])||1;return{s,pts:s.pts.map(p=>[p[0],pct?(Number(p[1])/base-1)*100:Number(p[1])])}});
  let t0=Infinity,t1=-Infinity,lo=Infinity,hi=-Infinity;
  for(const d of data)for(const p of d.pts){if(p[0]<t0)t0=p[0];if(p[0]>t1)t1=p[0];if(p[1]<lo)lo=p[1];if(p[1]>hi)hi=p[1]}
  if(pct){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  if(t1<=t0)t1=t0+60000;
  if(hi-lo<1e-9){const e=Math.abs(hi)*.02||1;lo-=e;hi+=e}
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const X=t=>padL+(t-t0)/(t1-t0)*pw,Y=v=>padT+ph-(v-lo)/(hi-lo)*ph;
  // grade e eixo Y
  const ticks=niceTicks(lo,hi,5).filter(v=>v>=lo&&v<=hi);
  c.lineWidth=1;c.textAlign='right';
  for(const v of ticks){const y=Math.round(Y(v))+.5;c.strokeStyle=pct&&Math.abs(v)<1e-9?'#4a4580':'#221e45';c.beginPath();c.moveTo(padL,y);c.lineTo(W-padR,y);c.stroke();
    c.fillStyle='#8a85b8';c.fillText(pct?pctTxt(v):fmt(v,hi-lo<10?2:hi-lo<100?1:0),padL-8,y)}
  // eixo X
  const spanH=(t1-t0)/3600e3;c.textAlign='center';c.fillStyle='#8a85b8';
  const nx=W<420?3:5;
  for(let i=0;i<nx;i++){const t=t0+(t1-t0)*i/(nx-1);c.textAlign=i===0?'left':i===nx-1?'right':'center';c.fillText(timeLabel(t,spanH),X(t)+(i===0?-4:i===nx-1?4:0),H-10)}
  // linhas
  const single=data.length===1;
  for(const d of data){
    const col=d.s.color;c.beginPath();
    d.pts.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);if(i===0)c.moveTo(x,y);else c.lineTo(x,y)});
    // estende até o fim do gráfico (o preço atual continua valendo)
    const last=d.pts[d.pts.length-1];if(last[0]<t1)c.lineTo(X(t1),Y(last[1]));
    c.lineWidth=isLite()?2:2.4;c.lineJoin='round';c.lineCap='round';c.strokeStyle=col;c.stroke();
    if(single&&cfg.fill!==false){
      c.lineTo(X(Math.max(last[0],t1)),padT+ph);c.lineTo(X(d.pts[0][0]),padT+ph);c.closePath();
      const g=c.createLinearGradient(0,padT,0,padT+ph);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');c.fillStyle=g;c.fill();
    }
    c.beginPath();c.arc(X(t1),Y(last[1]),3.5,0,7);c.fillStyle=col;c.fill();
  }
  // cursor
  if(st.hx!=null&&st.hx>=padL&&st.hx<=W-padR){
    const tx=t0+(st.hx-padL)/pw*(t1-t0);
    c.strokeStyle='#8a85b8';c.setLineDash([4,4]);c.lineWidth=1;c.beginPath();c.moveTo(Math.round(st.hx)+.5,padT);c.lineTo(Math.round(st.hx)+.5,padT+ph);c.stroke();c.setLineDash([]);
    const rows=[];
    for(const d of data){const i=valueAt(d.pts,tx);const p=d.pts[Math.max(0,i)];const raw=d.s.pts[Math.max(0,i)][1];
      c.beginPath();c.arc(X(Math.max(p[0],t0)<X(t0)?t0:Math.min(Math.max(p[0],t0),t1)),Y(p[1]),4,0,7);c.fillStyle=d.s.color;c.fill();c.strokeStyle='#0b0919';c.lineWidth=1.5;c.stroke();
      rows.push([d.s.color,d.s.name,pct?pctTxt(p[1])+'  ('+fmt(raw)+')':fmt(raw)])}
    const title=timeLabel(tx,spanH);
    c.font='12px Inter,system-ui,sans-serif';
    const wTxt=Math.max(c.measureText(title).width,...rows.map(r=>c.measureText(r[1]+'   '+r[2]).width+18))+20,hBox=26+rows.length*18;
    let bx=st.hx+14;if(bx+wTxt>W-4)bx=st.hx-14-wTxt;let by=Math.max(padT,Math.min(padT+ph-hBox,(st.hy||padT)-hBox/2));
    c.fillStyle='#191433f2';c.strokeStyle='#2f2a5c';c.lineWidth=1;c.beginPath();c.roundRect?c.roundRect(bx,by,wTxt,hBox,8):c.rect(bx,by,wTxt,hBox);c.fill();c.stroke();
    c.textAlign='left';c.fillStyle='#a8a3d1';c.fillText(title,bx+10,by+13);
    rows.forEach((r,i)=>{const y=by+30+i*18;c.fillStyle=r[0];c.beginPath();c.arc(bx+13,y,4,0,7);c.fill();c.fillStyle='#f3f0ff';c.textAlign='left';c.fillText(r[1],bx+23,y);c.textAlign='right';c.fillStyle='#cfcaf5';c.fillText(r[2],bx+wTxt-10,y)});
  }
}

/* rosca: items=[{label,value,color}] */
function donutChart(cv,items,centerTxt,centerSub){
  if(!cv)return;
  const dpr=Math.min(isLite()?1:2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)/2-4,r=R*.62,tot=items.reduce((n,i)=>n+i.value,0);
  if(tot<=0){c.beginPath();c.arc(cx,cy,R,0,7);c.arc(cx,cy,r,0,7,true);c.fillStyle='#221e45';c.fill('evenodd');return}
  let a=-Math.PI/2;
  for(const it of items){const da=it.value/tot*Math.PI*2;c.beginPath();c.arc(cx,cy,R,a,a+da);c.arc(cx,cy,r,a+da,a,true);c.closePath();c.fillStyle=it.color;c.fill();a+=da}
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#f3f0ff';c.font=`800 ${Math.round(R*.2)}px 'Bricolage Grotesque',system-ui,sans-serif`;c.fillText(centerTxt||'',cx,cy-(centerSub?7:0));
  if(centerSub){c.fillStyle='#8a85b8';c.font=`${Math.round(R*.11)}px Inter,system-ui,sans-serif`;c.fillText(centerSub,cx,cy+R*.16)}
}

/* ============================================================
   Música de fundo: playlist do ADM (YouTube/Spotify) + fila paga pelos membros (Spotify)
   ============================================================ */
const MUS={tracks:[],slots:[],idx:0,cur:null,yt:null,ytReady:false,ytLoading:false,pendingYt:null,gesture:false,price:100,minutes:10,sync:null,dur:0,lastSeek:0};

async function musicLoad(){
  try{const d=await stateRpc('music_state');MUS.tracks=d.tracks||[];MUS.slots=d.slots||[];MUS.price=Number(d.price||100);MUS.minutes=Number(d.minutes||10);MUS.sync=d.yt||null;musicTick()}
  catch(e){console.warn('música:',e.message||e)}
}
function musicActiveSlot(){const n=srvNow();return MUS.slots.find(s=>Date.parse(s.starts_at)<=n&&n<Date.parse(s.ends_at))||null}
function musicDesired(){
  const s=musicActiveSlot();
  if(s)return{key:'slot:'+s.id,kind:'spotify',type:s.ref_type,id:s.ref_id,title:s.title,by:s.username};
  const y=MUS.sync;
  if(y&&Date.parse(y.ends_at)>srvNow()-1500)return{key:'yt:'+y.track_id+':'+y.started_at,kind:'youtube',type:y.ref_type,id:y.ref_id,title:y.title,sync:true,startedAt:Date.parse(y.started_at),cap:Number(y.cap_seconds||600)};
  const t=MUS.tracks.filter(x=>x.active&&x.kind==='spotify');if(!t.length)return null;
  const x=t[MUS.idx%t.length];
  return{key:'trk:'+x.id,kind:x.kind,type:x.ref_type,id:x.ref_id,title:x.title};
}
function musicTick(){
  if(!S.user){return}
  if(!P.music||!MUS.gesture){dockUpdate();return}
  const want=musicDesired();
  if(MUS.sync&&Date.parse(MUS.sync.ends_at)<=srvNow()&&!MUS.loadingSync){MUS.loadingSync=true;musicLoad().finally(()=>{MUS.loadingSync=false})}
  if(!want){musicStop();MUS.cur=null;dockUpdate();return}
  if(!MUS.cur||MUS.cur.key!==want.key)musicPlay(want);
  else{if(want.sync)ytKeepSync();dockUpdate()}
}
function musicPlay(w){
  MUS.cur=w;
  if(w.kind==='youtube'){spHide();ytPlay()}
  else{ytStop();spShow(w)}
  dockUpdate();
}
function musicStop(){ytStop();spHide();MUS.cur=null;dockUpdate()}
async function musicNext(){
  if(MUS.sync){
    if(!isAdmin()){toast('A música é a mesma para todos. Só o ADM pode pular.','err');return}
    const yts=MUS.tracks.filter(x=>x.active&&x.kind==='youtube');if(!yts.length)return;
    const i=yts.findIndex(x=>x.id===MUS.sync.track_id),nx=yts[(i+1)%yts.length];
    const{error}=await sb.rpc('admin_play_track',{p_id:nx.id});if(error){toast(errMsg(error),'err');return}
    await musicLoad();return}
  MUS.idx++;MUS.cur=null;if(P.music)musicTick();else dockUpdate()}
function musicToggle(){
  MUS.gesture=true;P.music=!P.music;savePrefs();
  if(P.music)musicTick();else musicStop();
  dockUpdate();const c=$('#prefMusic');if(c)c.checked=P.music;
}

/* YouTube */
function ytEnsure(cb){
  if(window.YT&&YT.Player){cb();return}
  MUS.pendingYt=cb;if(MUS.ytLoading)return;MUS.ytLoading=true;
  window.onYouTubeIframeAPIReady=()=>{MUS.ytLoading=false;const c=MUS.pendingYt;MUS.pendingYt=null;if(c)c()};
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{MUS.ytLoading=false;toast('Não foi possível carregar o player do YouTube.','err')};document.head.appendChild(s);
}
function ytPlay(){
  ytEnsure(()=>{
    if(!MUS.yt){
      const holder=document.createElement('div');holder.id='ytinner';$('#ytp').appendChild(holder);
      MUS.yt=new YT.Player('ytinner',{width:'200',height:'200',playerVars:{playsinline:1,controls:0,rel:0},events:{
        onReady:()=>{MUS.ytReady=true;ytLoadCur()},
        onStateChange:e=>{
          const w=MUS.cur;
          if(e.data===1&&w&&w.sync){try{MUS.dur=Math.floor(MUS.yt.getDuration()||0)}catch(x){}ytKeepSync()}
          if(e.data===0){
            if(w&&w.sync){ytKeepSync(true)}          // vídeo curto: repete até completar o tempo da faixa
            else musicNext()}},
        onError:()=>{toast('Essa faixa do YouTube não pôde tocar.','err');if(!MUS.cur||!MUS.cur.sync)setTimeout(musicNext,900)}}});
    }else if(MUS.ytReady)ytLoadCur();
  });
}
/* Segundo exato em que a faixa deve estar agora: tempo desde o started_at do servidor; vídeos curtos dão a volta (loop), longos são cortados em 10 min. */
function ytTarget(w){
  const el=Math.max(0,(srvNow()-w.startedAt)/1000);
  if(el>=w.cap)return -1;
  const d=MUS.dur;
  return d>0&&d<w.cap?el%d:el;
}
function ytLoadCur(){
  const w=MUS.cur;if(!w||w.kind!=='youtube'||!MUS.ytReady)return;
  MUS.dur=0;
  try{MUS.yt.setVolume(Math.round(P.volume*100));
    if(w.sync&&w.type!=='playlist'){const t=ytTarget(w);if(t<0){musicLoad();return}MUS.yt.loadVideoById({videoId:w.id,startSeconds:Math.max(0,t)})}
    else if(w.type==='playlist')MUS.yt.loadPlaylist({list:w.id,listType:'playlist',index:0});
    else MUS.yt.loadVideoById(w.id)}catch(e){console.warn(e)}
}
/* Mantém todo mundo no mesmo segundo (corrige atraso de rede, aba em segundo plano, pausas) */
function ytKeepSync(force){
  const w=MUS.cur;if(!w||!w.sync||!MUS.yt||!MUS.ytReady||w.type==='playlist')return;
  try{
    const t=ytTarget(w);
    if(t<0){ytStop();musicLoad();return}
    const st=MUS.yt.getPlayerState(),cur=MUS.yt.getCurrentTime();
    if(st===2&&P.music){MUS.yt.playVideo()}
    if(st===0||force||Math.abs(cur-t)>2.5){if(Date.now()-MUS.lastSeek>1200){MUS.lastSeek=Date.now();MUS.yt.seekTo(t,true);if(st!==1)MUS.yt.playVideo()}}
  }catch(e){}
}
function ytStop(){try{if(MUS.yt&&MUS.ytReady)MUS.yt.stopVideo()}catch(e){}}
function musicSetVolume(v){P.volume=clamp(v,0,1);savePrefs();try{if(MUS.yt&&MUS.ytReady)MUS.yt.setVolume(Math.round(P.volume*100))}catch(e){}}

function wealthItems(){
  const mine=S.holdings.filter(h=>h.user_id===S.user.id&&Number(h.quantity)*price(h.asset_id)>0).map(h=>({label:asset(h.asset_id).symbol||'Ativo',value:Number(h.quantity)*price(h.asset_id)})).sort((a,b)=>b.value-a.value);
  const all=[{label:'Saldo em AC',value:Number(me().balance||0)},...mine].filter(x=>x.value>0);
  let out=all.slice(0,7);const rest=all.slice(7).reduce((n,x)=>n+x.value,0);if(rest>0)out.push({label:'Outras',value:rest});
  return out.map((x,i)=>({...x,color:x.label==='Outras'?'#6f6a9c':SERIES_COLORS[i%SERIES_COLORS.length]}));
}
function drawWealth(){
  const cv=$('#wealthchart');if(!cv)return;
  const it=wealthItems(),tot=it.reduce((n,x)=>n+x.value,0);
  donutChart(cv,it,fmt(tot,0),'AC no total');
}
async function cmpLoad(force){
  const cv=$('#cmpchart');if(!cv)return;
  const ld=$('#cmpload');
  if(!CMP.ids.length){CMP.series={};if(ld)ld.classList.add('hidden');cmpDraw();return}
  const key=CMP.ids.join(',')+'|'+CMP.hours;
  if(!force&&CMP.key===key&&CMP.series&&Date.now()-CMP.at<60000){if(ld)ld.classList.add('hidden');cmpDraw();return}
  CMP.loading=true;if(ld)ld.classList.remove('hidden');
  try{
    const{data,error}=await sb.rpc('price_series',{p_asset_ids:CMP.ids,p_hours:CMP.hours,p_points:isLite()?60:110});
    if(error)throw error;
    if(CMP.ids.join(',')+'|'+CMP.hours!==key)return; // o usuário mudou a escolha enquanto carregava
    CMP.series=data.series||{};CMP.key=key;CMP.at=Date.now();
  }catch(e){toast('Não foi possível carregar o gráfico: '+errMsg(e),'err')}
  finally{CMP.loading=false;const l=$('#cmpload');if(l)l.classList.add('hidden')}
  if(S.tab==='graficos'&&CMP.sub==='comparar')cmpDraw();
}
function cmpSeries(){
  const now=Date.now();
  return CMP.ids.map(id=>{const a=asset(id);let pts=((CMP.series&&CMP.series[id])||[]).map(p=>[Number(p[0]),Number(p[1])]);
    if(!pts.length)pts=[[now-CMP.hours*3600e3,Number(a.price)]];
    if(now-pts[pts.length-1][0]>1500)pts.push([now,Number(a.price)]);
    return{id,name:a.symbol||'?',color:cmpColor(id),pts}});
}
function cmpDraw(){
  const cv=$('#cmpchart');if(!cv)return;
  const series=cmpSeries();
  lineChart(cv,{series,mode:CMP.mode,fill:true});
  const box=$('#cmpstats');if(!box)return;
  box.innerHTML=table(['Moeda','Preço agora','No período','Mínimo','Máximo'],series.map(s=>{const v=s.pts.map(p=>p[1]),first=v[0],last=v[v.length-1],ch=first?(last/first-1)*100:0;
    return`<tr><td><span class="coin"><i class="dotc" style="background:${s.color}"></i><span class="sym">${esc(s.name)}</span></span></td><td><b>${fmt(last)}</b></td><td>${changeTag(ch)}</td><td>${fmt(Math.min(...v))}</td><td>${fmt(Math.max(...v))}</td></tr>`}).join(''),'Escolha uma moeda para ver os números.');
  labelTables(box);
}
function cmpPreset(p){
  CMP.touched=true;
  const by=fn=>S.assets.map(a=>({a,c:changeOf(a.id)})).sort(fn).slice(0,5).map(x=>x.a.id);
  if(p==='up')CMP.ids=by((x,y)=>y.c-x.c);
  else if(p==='down')CMP.ids=by((x,y)=>x.c-y.c);
  else if(p==='top')CMP.ids=S.assets.slice().sort((a,b)=>b.price-a.price).slice(0,5).map(a=>a.id);
  else if(p==='mine')CMP.ids=S.holdings.filter(h=>h.user_id===S.user.id&&Number(h.quantity)>0).map(h=>h.asset_id).filter((x,i,a)=>a.indexOf(x)===i).slice(0,8);
  else CMP.ids=[];
  renderView();
}

async function rlPoll(g){

function rlApply(st){
  const prev=CAS.rl.st;CAS.rl.st=st;const r=st.round;
  const same=prev&&prev.round.id===r.id;
  if(r.status==='spinning'&&CAS.rl.phase!=='spin:'+r.id){CAS.rl.phase='spin:'+r.id;if(same||!prev)SFX.play('launch')}
  if(r.status==='settled'&&CAS.rl.phase!=='done:'+r.id){
    const announce=CAS.rl.phase==='spin:'+r.id||(same&&prev.round.status!=='settled');
    CAS.rl.phase='done:'+r.id;
    if(announce)rlAnnounce(st);
    refreshBalance();
  }
  if(r.status==='betting'&&CAS.rl.phase&&CAS.rl.phase!=='bet:'+r.id)CAS.rl.phase='bet:'+r.id;
  rlSide(st);
}
function rlAnnounce(st){

  const bet=mine.reduce((n,b)=>n+Number(b.amount),0),pay=mine.reduce((n,b)=>n+Number(b.payout||0),0),net=pay-bet;
  if(net>0){toast(`Deu ${COLOR_PT[st.round.result_color].toLowerCase()} ${st.round.result_number}! Você ganhou +${fmt(net)} AC 🎉`,'gain',5500);SFX.play('win');FX.confetti()}
  else if(pay>0){toast(`Deu ${st.round.result_number}. Você recuperou ${fmt(pay)} AC.`)}
  else{toast(`Deu ${COLOR_PT[st.round.result_color].toLowerCase()} ${st.round.result_number}. Você perdeu ${fmt(bet)} AC.`);SFX.play('lose')}
}
function rlSide(st){

  const mx=$('#rlmax');if(mx)mx.textContent=`Aposta máxima: ${fmt(st.max_bet,0)} AC`;

  }
  const s=$('#rlstatus');if(s){
