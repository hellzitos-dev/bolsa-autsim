    case'car-go':carShow(Number(d.i));carStart();break;
    case'tq-set':tqSet(d.v==='max'?'max':Number(d.v));break;
    case'rk-bet-token':el.disabled=true;await rkBet(true);el.disabled=false;break;
    case'tr-accept':el.disabled=true;await trRespond(d.id,true);break;
    case'tr-reject':el.disabled=true;await trRespond(d.id,false);break;
    case'tr-cancel':await trCancel(d.id);break;
    case'cmp-sub':CMP.sub=d.sub;renderView();break;
    case'cmp-hours':CMP.hours=Number(d.h);renderView();break;
    case'cmp-mode':CMP.mode=d.m;renderView();break;
    case'cmp-del':CMP.ids=CMP.ids.filter(x=>x!==d.id);CMP.touched=true;renderView();break;
    case'cmp-preset':cmpPreset(d.p);break;
    case'auth-mode':showGate(d.m==='signup'?'signup':'login');break;
    case'logout':await sb.auth.signOut();teardown();break;
    case'reload':location.reload();break;
    case'accept-terms':{if(!$('#accepttermscheck')?.checked){toast('Você precisa aceitar os termos para continuar.','err');break}
      el.disabled=true;const{error}=await sb.rpc('accept_terms',{p_version:'autsim-terms-r'+((await termsFetch()).rev||0)});el.disabled=false;if(error){toast(errMsg(error),'err');break}
      await fetchCore(true);if(S.profile?.terms_accepted_at){if(siteClosed()&&!isAdmin())showClosed();else startApp()}break}
    case'refresh':await refreshLight('all');toast('Dados atualizados.');break;
    case'trade':el.disabled=true;try{await trade(d.kind,d.id)}finally{el.disabled=false}break;
    case'claim-daily':await claimDaily(false);break;
    case'buy-item':await buyItem(d.id);break;
    case'edit-coin':editCoinForm(d.id);break;
    case'music-buy':musicBuyModal();break;
    case'music-toggle':musicToggle();break;
    case'music-next':MUS.gesture=true;musicNext();break;
    case'cas-tab':if(d.tab!==CAS.tab){casinoSwitch(d.tab)}break;
    case'chip':{const inp=$('#'+d.for);if(!inp||inp.disabled)break;let v=Number(inp.value)||0;
      if(d.v==='half')v=Math.floor(v/2);else if(d.v==='double')v=v*2;
      else if(d.v==='max'){const mx=Number((d.for==='rlamt'?CAS.rl.st?.max_bet:CAS.rk.st?.max_bet)||2000);v=Math.floor(Math.min(mx,Number(me().balance)))}
      else v+=Number(d.v);inp.value=Math.max(1,Math.floor(v));break}
    case'rl-bet':el.disabled=true;await rlBet(d.color);break;
    case'rk-bet':el.disabled=true;await rkBet();el.disabled=false;break;
    case'rk-cash':await rkCash();break;
    case'chat-del':{const{error}=await sb.rpc('admin_delete_chat',{p_id:Number(d.id)});if(error)toast(errMsg(error),'err');break}
    case'pr-new':prNewForm();break;
    case'pr-bet':prBetForm(d.id,d.side);break;
    case'pr-resolve':await prResolve(d.id,d.out);break;
    case'pr-cancel':await prCancel(d.id);break;
    /* painel ADM */
    case'adm-tab':ADM.tab=d.tab;keepInputs(renderView);break;
    case'adm-refresh':await refreshLight(true);await admLoad();toast('Painel atualizado.');break;
    case'adm-set':await admSaveSetting(d.key,d.type);break;
    case'adm-xpcurve':await admSaveXp();break;
    case'adm-clear-chat':if(await confirmBox('Apagar todas as mensagens do chat do cassino?','Apagar tudo')){const{error}=await sb.rpc('admin_clear_chat');if(error)throw error;chatStop();chatStart();toast('Chat limpo.')}break;
    case'adm-adjust':admAdjust(d.id);break;
    case'adm-xp':admXp(d.id);break;
    case'adm-toggle-admin':{const p=profile(d.id);if(await confirmBox(`${p.is_admin?'Tirar':'Dar'} permissão de ADM para ${p.username}?`)){await admRpc('admin_set_admin',{p_user:d.id,p_flag:!p.is_admin},'Permissão alterada.')}break}
    case'adm-coin':admCoinForm(d.id);break;
    case'adm-item-new':admItemForm(null);break;
    case'adm-item-edit':admItemForm(d.id);break;
    case'adm-item-del':if(await confirmBox('Excluir este item da loja? Pedidos já feitos continuam no histórico.','Excluir'))await admRpc('admin_delete_shop_item',{p_id:d.id},'Item excluído.');break;
    case'adm-order-done':await admRpc('admin_set_delivered',{p_id:d.id,p_flag:true},'Pedido marcado como entregue.',false);await admLoad();break;
    case'adm-order-undo':await admRpc('admin_set_delivered',{p_id:d.id,p_flag:false},null,false);await admLoad();break;
    case'adm-req-ok':await admRpc('admin_approve_user',{p_id:d.id},'Conta aprovada! A moeda do jogador já foi criada.');break;
    case'adm-req-no':if(await confirmBox('Rejeitar e excluir esta conta? Ela some e não dá para desfazer.','Rejeitar'))await admRpc('admin_reject_user',{p_id:d.id},'Solicitação rejeitada.');break;
    case'adm-nav-save':await admSaveNav();break;
    case'adm-box-new':admBoxForm(null);break;
    case'adm-box-edit':admBoxForm(d.id);break;
    case'adm-box-del':if(await confirmBox('Excluir esta caixa? Itens que já estão nos inventários continuam com os jogadores.','Excluir')){await admRpc('admin_delete_box',{p_id:d.id},'Caixa excluída.',false);SH.boxAt=0;await admLoad()}break;
    case'adm-give-new':admGiveForm(null);break;
    case'adm-give-cat':await admGiveCatalog();break;
    case'adm-inv-view':await admInvView(d.id);break;
    case'adm-take-item':if(await confirmBox('Tirar este item do jogador?','Tirar')){await admRpc('admin_take_item',{p_inv:d.id},'Item removido.',false);await admInvView(d.u)}break;
    case'adm-setpw':admSetPassword(d.id);break;
    case'adm-email':await admShowEmail(d.id);break;
    case'adm-terms-save':{const txt=$('#trmText').value,again=$('#trmAgain').checked;
      if(again&&!await confirmBox('Todos os jogadores vão precisar aceitar os termos de novo. Continuar?','Continuar'))break;
      const r=await admRpc('admin_set_terms',{p_text:txt,p_require_again:again},null,false);TERMS.text=txt;TERMS.rev=Number(r.rev);
      toast(again?`Termos salvos. ${r.reset} jogador(es) terão que aceitar de novo.`:'Termos salvos.');renderView();break}
    case'terms-read':termsModal();break;
    case'adm-music-add':admMusicForm();break;
    case'adm-music-bulk':admMusicBulkForm();break;
    case'adm-music-cfg':{const r=Math.round(Number($('#mscRot').value)),sh=$('#mscShuf').checked?1:0;
      if(!(r>=1&&r<=10)){toast('Os minutos de cada música vão de 1 a 10.','err');break}
      await admRpc('admin_set_setting',{p_key:'music_rotate_minutes',p_value:r},null,false);await admRpc('admin_set_setting',{p_key:'music_shuffle',p_value:sh},null,false);
      S.settings.music_rotate_minutes=r;S.settings.music_shuffle=sh;toast('Playlist atualizada.');await musicLoad();renderView();break}
    case'adm-sfx-del':await admRpc('admin_set_sfx',{p_slot:d.slot,p_url:''},'Som padrão restaurado.',false);{const c={...(S.settings.sfx_custom||{})};delete c[d.slot];S.settings.sfx_custom=c}renderView();break;
    case'adm-sfx-play':{const a=SFX.file(d.slot,.9);if(!a)toast('Ative os efeitos sonoros nas preferências para ouvir.','err');break}
    case'adm-leg-save':{const url=$('#lgUrl').value.trim();if(!url){toast('Cole o link do vídeo.','err');break}
      await admRpc('admin_set_legendary_music',{p_url:url,p_title:$('#lgTitle').value,p_start:Math.max(0,Math.round(Number($('#lgStart').value)||0))},'Música lendária salva.',false);
      const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);if(m)S.settings.legendary_music={id:m[1],title:$('#lgTitle').value||'Música lendária',start:Math.max(0,Math.round(Number($('#lgStart').value)||0))};S.staticAt=0;renderView();break}
    case'adm-leg-del':await admRpc('admin_set_legendary_music',{p_url:'',p_title:'',p_start:0},'Música lendária removida.',false);delete S.settings.legendary_music;renderView();break;
    case'adm-leg-test':await admRpc('admin_test_legendary',{},'Aviso lendário disparado!',false);break;
    case'adm-music-play':await admRpc('admin_play_track',{p_id:d.id},'Tocando para todo mundo agora.',false);await musicLoad();await admLoad();break;
    case'adm-sys-new':admSysForm();break;
    case'adm-sys-del':if(await confirmBox('Apagar esta moeda do sistema? As ações em carteiras somem junto.','Apagar')){await admRpc('admin_delete_system_coin',{p_asset_id:d.id},'Moeda apagada.')}break;
    case'adm-fine':admFineForm(d.id);break;
    case'adm-cos-new':admCosForm(null);break;
    case'adm-cos-edit':admCosForm(d.id);break;
    case'adm-cos-del':if(await confirmBox('Excluir este cosmético? Quem já comprou continua com o estilo equipado.','Excluir'))await admRpc('admin_delete_cosmetic',{p_id:d.id},'Cosmético excluído.');break;
    case'adm-ach-new':admAchForm(null);break;
    case'adm-ach-edit':admAchForm(d.id);break;
    case'adm-ach-del':if(await confirmBox('Excluir esta conquista? Ela some do mural de quem já ganhou.','Excluir'))await admRpc('admin_delete_achievement',{p_id:d.id},'Conquista excluída.');break;
    case'adm-ach-give':admAchGive(d.id);break;
    case'adm-grand-new':admGrandForm();break;
    case'adm-music-toggle':await admRpc('admin_toggle_music',{p_id:d.id,p_active:d.on==='1'},null,false);await musicLoad();await admLoad();break;
    case'adm-music-del':if(await confirmBox('Remover esta música da playlist?','Remover')){await admRpc('admin_delete_music',{p_id:d.id},'Música removida.',false);await musicLoad();await admLoad()}break;
    case'adm-news-add':{const body=($('#nwBody')?.value||'').trim(),h=$('#nwHours')?.value;if(body.length<3){toast('Escreva a notícia (mínimo 3 letras).','err');break}
      await admRpc('admin_add_news',{p_body:body,p_kind:$('#nwKind').value,p_hours:h===''?null:Number(h)},'Notícia publicada! Já está rolando no topo.');break}
    case'adm-news-toggle':await admRpc('admin_set_news_active',{p_id:Number(d.id),p_active:d.on==='1'},null);break;
    case'adm-news-del':if(await confirmBox('Apagar esta notícia?','Apagar'))await admRpc('admin_delete_news',{p_id:Number(d.id)},'Notícia apagada.');break;
    case'adm-icon-save':{const v=($('#'+icKey(d.slot))?.value||'').trim();await admIconSet(d.slot,v,v?'Ícone salvo.':'Ícone restaurado ao padrão.');break}
    case'adm-icon-reset':await admIconSet(d.slot,'','Ícone restaurado ao padrão.');break;
    case'adm-open-toggle':{const open=d.open==='1';if(await confirmBox(open?'Abrir o site para todos os membros agora?':'Fechar o site? Membros comuns ficam sem acesso até você abrir.',open?'Abrir':'Fechar')){
      const{error}=await sb.rpc('admin_set_site_open',{p_open:open});if(error)throw error;S.settings.site_open=open;applySettings();toast(open?'Site aberto!':'Site fechado para os membros.');keepInputs(renderView)}break}
    case'adm-reset':{if(($('#rsConfirm')?.value||'').trim()!=='RESETAR'){toast('Digite RESETAR (em maiúsculas) para confirmar.','err');break}
      if(!await confirmBox('Última chance: resetar TODO o site? Saldos e preços voltam ao início e o histórico é apagado.','Sim, resetar'))break;
      const{error}=await sb.rpc('admin_reset_site',{p_confirm:'RESETAR',p_reset_xp:!!$('#rsXp')?.checked,p_close:!!$('#rsClose')?.checked});if(error)throw error;
      MK.list=null;MK.trades=null;CMP.series=null;ADM.stats=null;S.staticAt=0;await refreshLight('all');await admLoad();toast('Site resetado. Tudo começou do zero.','gain',6000);break}
    case'adm-cleanup':{const{error}=await sb.rpc('run_cleanup',{p_force:true});if(error)throw error;toast('Limpeza feita.');ADM.stats=null;await admStats();break}
    case'adm-stats':ADM.stats=null;keepInputs(renderView);await admStats();break;
    case'adm-slot-del':await admRpc('admin_remove_music_slot',{p_id:d.id,p_refund:d.refund==='1'},d.refund==='1'?'Removida e valor devolvido.':'Removida da fila.');await musicLoad();break;
  }}catch(err){toast(errMsg(err),'err');SFX.play('error')}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;
  if(f.dataset.form==='auth'){e.preventDefault();authSubmit()}
  else if(f.dataset.form==='chat'){e.preventDefault();chatSend()}
  else if(f.dataset.form==='cmchat'){e.preventDefault();cmChatSend()}
  else if(f.dataset.form==='acchat'){e.preventDefault();cmRoomSend()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='cmimg'){if(t.files&&t.files[0])cmChatSend();return}
  if(t.id==='cmpadd'){if(t.value&&CMP.ids.length<8){CMP.ids.push(t.value);CMP.touched=true;renderView()}return}
  if(t.id==='mkAsset'){const p=$('#mkPrice');if(p)p.value=Number(price(t.value))||'';return}
  if(t.dataset&&t.dataset.sfxfile){
    const f=t.files&&t.files[0];if(!f)return;const slot=t.dataset.sfxfile;
    try{const url=await uploadAudio(f);await admRpc('admin_set_sfx',{p_slot:slot,p_url:url},'Som salvo!',false);S.settings.sfx_custom={...(S.settings.sfx_custom||{}),[slot]:url};renderView();SFX.file(slot,.9)}
    catch(err){toast(errMsg(err),'err',6000)}
    t.value='';return}
  if(t.dataset&&t.dataset.icfile){
    const f=t.files&&t.files[0];if(!f)return;
    try{const data=await resizeImageFile(f,t.dataset.icfile==='favicon'?64:96);await admIconSet(t.dataset.icfile,data,'Imagem enviada e aplicada.')}
    catch(err){toast(errMsg(err),'err')}
    t.value='';return}
  const pref=t.dataset&&t.dataset.pref;if(!pref)return;
  if(pref==='music'){if(t.checked!==P.music)musicToggle()}
  else if(pref==='sfx'){P.sfx=t.checked;savePrefs();if(P.sfx)SFX.play('coin')}
  else if(pref==='motion'){P.motion=t.checked;savePrefs()}
  else if(pref==='lite'){P.lite=t.value==='auto'?null:t.value==='on';savePrefs();S.tickSig='';render();toast(isLite()?'Modo leve ligado.':'Modo completo ligado.')}
});
document.addEventListener('input',e=>{if(e.target.id==='trmText'){const c=$('#trmCount');if(c)c.textContent=e.target.value.length+' / 12000'}
  if(e.target.dataset&&e.target.dataset.pref==='volume')musicSetVolume(Number(e.target.value)/100);if(e.target.id==='cmFind')cmFindFilter(e.target.value)});

/* ---------- partida ---------- */
(async()=>{
  FX.init();applySettings();showGate('loading');
  await loadPublicSettings();
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?.user||null,changed=(u&&u.id)!==(S.user&&S.user.id);
    if(!u){if(S.started||ev==='SIGNED_OUT'){teardown()}return}
    S.user=u;if(changed)setTimeout(enter,0);
  });
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){S.user=session.user;await enter()}else showGate('login');
})();


</script>
</body>
</html>
