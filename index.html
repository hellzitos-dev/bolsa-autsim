<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0919"><title>Bolsa do Autsim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0b0919; --panel:#15122b; --panel-2:#1e1a3c; --line:#2f2a5c; --line-soft:#231f48;
  --text:#f3f0ff; --muted:#a8a3d1; --dim:#6f6a9c;
  --accent:#8b5cf6; --accent-soft:color-mix(in srgb,var(--accent) 22%,transparent); --accent-hi:color-mix(in srgb,var(--accent) 60%,#fff);
  --gold:#ffc857; --up:#3ddc97; --down:#ff5d73; --red:#d8344d; --black:#1a1830; --green:#17a05d;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --r-panel:4px 22px 4px 22px; --r-btn:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h2{font-size:28px;font-weight:800;line-height:1.1}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent-hi)}
.hidden{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} small,.small{font-size:13px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* fundo */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,200,87,.07),transparent 60%),var(--ink)}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--accent);left:-12vmax;top:-10vmax}
.bg i:nth-child(2){background:#2a7fff;right:-16vmax;top:30vh;animation-duration:34s;opacity:.16}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
html.calm .bg i{animation:none}

/* topo */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px clamp(12px,3vw,28px);background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);border-radius:4px 14px 4px 14px;font-size:18px;box-shadow:0 6px 22px var(--accent-soft)}
.userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.bal{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);padding:4px 12px;border-radius:999px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.25)}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xpbar{width:84px;height:6px;border-radius:9px;background:var(--line-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}

/* ticker */
.ticker{position:relative;overflow:hidden;background:#07061320;border-bottom:1px solid var(--line-soft);height:44px;display:flex;align-items:center}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.ticker::before{left:0;background:linear-gradient(90deg,var(--ink),transparent)} .ticker::after{right:0;background:linear-gradient(270deg,var(--ink),transparent)}
.tk-track{display:flex;width:max-content;animation:marquee var(--dur,60s) linear infinite}
.ticker:hover .tk-track{animation-play-state:paused}
html.calm .tk-track{animation:none} html.calm .ticker{overflow-x:auto}
@keyframes marquee{to{transform:translateX(-50%)}}
.tk{display:flex;align-items:baseline;gap:9px;padding:0 22px;border:0;background:none;white-space:nowrap;cursor:pointer;font-size:14px}
.tk b{font-family:var(--display);font-weight:700;color:var(--muted)}
.tk .pr{font-weight:700}
.tk .ch{font-weight:700;font-size:13px}
.tk:hover b{color:var(--text)}
.tk-empty{margin:auto;color:var(--dim);font-size:13px}
.band{display:flex;justify-content:space-between;gap:16px;padding:6px clamp(12px,3vw,28px);font-size:13px;color:var(--muted);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent);border-bottom:1px solid var(--line-soft)}
.band b{color:var(--gold);font-weight:700}
.band .ann{color:var(--text)}

/* casca */
.shell{display:grid;grid-template-columns:188px minmax(0,1fr);gap:22px;max-width:1380px;margin:0 auto;padding:22px clamp(12px,3vw,28px) 90px}
.rail{position:sticky;top:112px;align-self:start;display:flex;flex-direction:column;gap:3px}
.rail button{display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border:0;background:none;border-radius:4px 14px 4px 14px;color:var(--muted);font-weight:600;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.rail button:hover{background:var(--panel);color:var(--text);transform:translateX(3px)}
.rail button.active{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.rail .ic{width:22px;text-align:center;font-size:17px}
.badge{margin-left:auto;background:var(--down);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
#view{min-width:0;animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
html.calm #view{animation:none}

/* componentes */
.panel{background:linear-gradient(165deg,var(--panel-2),var(--panel));border:1px solid var(--line-soft);border-radius:var(--r-panel);padding:18px;min-width:0;position:relative}
.panel.glow{border-color:var(--line);box-shadow:0 18px 60px -28px var(--accent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:14px 0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.page-head p{max-width:60ch;margin-top:6px}
.stat-label{color:var(--muted);font-size:13px}
.stat{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.hero-bal{font-size:clamp(40px,7vw,68px);color:var(--gold);line-height:1}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.acc{color:var(--accent-hi);border-color:var(--accent)}
.notice{padding:12px 14px;border-radius:4px 14px 4px 14px;border:1px solid var(--line);background:var(--accent-soft);color:#e6defc;margin:12px 0;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--dim)}

button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-btn);padding:8px 14px;font-weight:600;transition:transform .12s,filter .15s,background .15s}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
button:disabled{opacity:.42;cursor:not-allowed}
.btn-main{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 26px -10px var(--accent)}
.btn-good{background:#0f8f62;border-color:transparent;color:#fff}
.btn-bad{background:#b3304a;border-color:transparent;color:#fff}
.btn-gold{background:var(--gold);border-color:transparent;color:#2a1c00}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-lg{padding:14px 22px;font-size:17px}
input,select,textarea{background:#0a0817;border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-width:100%;width:100%}
input[type=number]{width:112px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=color]{padding:2px;height:38px;width:64px}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:9px;color:var(--text);font-size:14px}

.tablewrap{overflow:auto;border:1px solid var(--line-soft);border-radius:4px 16px 4px 16px;margin:10px 0 20px}
table{border-collapse:collapse;width:100%;background:#0d0b20}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--dim);font-weight:600;background:#110e26}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s} tbody tr:hover{background:#15122b}
.coin{display:inline-flex;align-items:center;gap:8px}
.coin img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line)}
.coin .sym{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
.coin .nm{color:var(--muted);font-size:13px}
.spark{display:block}
.me-row{background:var(--accent-soft)}
.podium td:first-child{font-family:var(--display);font-weight:800;font-size:18px}
.rank1{color:var(--gold)} .rank2{color:#cfd3e6} .rank3{color:#d79a6a}

/* loja */
.items{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.item{display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.item:hover{transform:translateY(-3px) rotate(-.4deg)}
.item .em{font-size:38px;line-height:1}
.item .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slotcard{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,var(--panel-2)),var(--panel))}

/* cassino */
.casino{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border-radius:99px;background:var(--panel);padding:8px 18px}
.subtabs button.active{background:var(--accent);border-color:transparent;color:#fff}
.arena{position:relative;overflow:hidden}
.cv-wrap{position:relative;width:100%;aspect-ratio:16/9;max-height:430px;border-radius:4px 18px 4px 18px;overflow:hidden;background:#07051a;border:1px solid var(--line-soft)}
.cv-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv-over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.cv-over .big{font-family:var(--display);font-weight:800;font-size:clamp(42px,9vw,92px);letter-spacing:-.04em;text-shadow:0 4px 40px #000}
.cv-over .sub{color:var(--muted);font-size:15px;margin-top:4px}
.crashed .big{color:var(--down)}
.betbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 10px;font-size:13px;border-radius:99px}
.colorbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.colorbtns button{padding:14px 8px;font-weight:800;font-size:16px;border:0;color:#fff;display:flex;flex-direction:column;gap:2px;align-items:center}
.colorbtns small{color:rgba(255,255,255,.75);font-weight:600}
.cb-red{background:var(--red)} .cb-black{background:#2a2750;border:1px solid var(--line)!important} .cb-green{background:var(--green)}
.hist{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 4px}
.hist span{min-width:30px;height:30px;padding:0 7px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.hist .h-red{background:var(--red)} .hist .h-black{background:#2a2750} .hist .h-green{background:var(--green)}
.hist .h-lo{background:#4a2740;color:#ff8da0} .hist .h-mid{background:#1e3a5a;color:#8dd0ff} .hist .h-hi{background:#4b3a12;color:var(--gold)}
.hist span:first-child{animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.livebets{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:12px}
.livebets .col{background:#0d0b20;border-radius:4px 14px 4px 14px;padding:10px;min-height:70px;font-size:13px}
.livebets .col h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.betline{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.betline.win{color:var(--up)} .betline.lose{color:var(--dim);text-decoration:line-through}
.rocketbets{margin-top:12px;display:grid;gap:4px;font-size:13px}
.rocketbets .betline{background:#0d0b20;padding:6px 10px;border-radius:8px}
.cash-btn{width:100%;margin-top:0;font-size:20px;padding:16px;animation:throb .9s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 8px rgba(61,220,151,.18)}}
html.calm .cash-btn{animation:none}

.chatbox{display:flex;flex-direction:column;height:min(640px,calc(100vh - 150px));position:sticky;top:112px;padding:0;overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.dot.on{background:var(--up);box-shadow:0 0 10px var(--up)}
#chatlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:9px;align-items:flex-start;animation:msgIn .25s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg .avatar{width:26px;height:26px;margin-top:2px}
.msg .who{font-weight:700;font-size:13px;color:var(--accent-hi)}
.msg.mine .who{color:var(--gold)}
.msg .txt{font-size:14px;overflow-wrap:anywhere;color:#e6e2fb}
.msg .del{margin-left:auto;padding:0 6px;font-size:12px;background:none;border:0;color:var(--dim)}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line-soft)}

.market{display:flex;flex-direction:column;gap:12px}
.poolbar{height:12px;border-radius:99px;overflow:hidden;display:flex;background:#0d0b20}
.poolbar i{display:block;height:100%;transition:width .6s}
.poolbar .y{background:var(--up)} .poolbar .n{background:var(--down)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sides>div{background:#0d0b20;border-radius:4px 14px 4px 14px;padding:10px 12px}

/* modal / toast / fx */
#modal{position:fixed;inset:0;z-index:100;background:rgba(5,4,14,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetIn{from{transform:translateY(24px) scale(.97);opacity:0}}
.sheet.wide{width:min(760px,100%)}
.formgrid{display:grid;gap:12px;margin:14px 0}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw);pointer-events:none}
.toast{pointer-events:auto;padding:11px 16px;border-radius:4px 14px 4px 14px;background:#191433;border:1px solid var(--accent);box-shadow:0 14px 40px #000a;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
.toast.err{border-color:var(--down)} .toast.gain{border-color:var(--gold);color:var(--gold)}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}}
#fx{position:fixed;inset:0;z-index:110;pointer-events:none}

/* musica */
.dock{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dock-bar{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:99px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);max-width:min(300px,calc(100vw - 28px));box-shadow:0 10px 30px #0008}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.eq i{width:3px;background:var(--accent-hi);border-radius:2px;height:4px}
.dock.playing .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{50%{height:16px}}
.dock-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dock-title small{display:block;line-height:1.1}
#spwrap{width:300px;max-width:calc(100vw - 28px);border-radius:12px;overflow:hidden}
#ytp{position:fixed;left:-20px;bottom:-20px;width:2px;height:2px;opacity:.01;pointer-events:none}

/* gate */
.gate{max-width:760px;margin:6vh auto;padding:0 16px;text-align:center}
.gate h1{font-size:clamp(42px,9vw,88px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:6px 0 18px}
.gate p.lead{color:var(--muted);max-width:52ch;margin:0 auto 22px;font-size:17px}
.gate .panel{text-align:left;max-width:520px;margin:0 auto}
.floaty{display:inline-block;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(6deg)}}
html.calm .floaty{animation:none}

/* admin */
.admtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.admtabs button{border-radius:99px;background:var(--panel)} .admtabs button.active{background:var(--accent);border-color:transparent;color:#fff}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border:0}

@media(max-width:1000px){.casino{grid-template-columns:1fr}.chatbox{position:static;height:460px}.cols{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;gap:10px;padding-top:12px}
  .rail{position:sticky;top:96px;z-index:30;flex-direction:row;overflow-x:auto;background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(10px);padding:6px 0;margin:0 -4px}
  .rail button{flex:none;padding:8px 12px} .rail button:hover{transform:none}
  .livebets{grid-template-columns:1fr}
  th,td{padding:9px}
}
@media(prefers-reduced-motion:reduce){.bg i,.tk-track,.floaty,.cash-btn,#view{animation:none!important}}

</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<header class="top">
  <button class="brand" data-do="tab" data-tab="inicio" aria-label="Início"><span class="logo">📈</span><span id="brandname">Bolsa do Autsim</span></button>
  <div id="userbar" class="userbar"></div>
</header>
<div class="ticker" id="ticker" aria-label="Maiores variações de preço"><div class="tk-empty">Carregando o mercado…</div></div>
<div class="band"><span class="ann" id="annc"></span><span>Bônus diário reseta em <b id="dailycd">--:--:--</b></span></div>
<section id="gate" class="gate"><div class="muted">Carregando…</div></section>
<div class="shell hidden" id="shell"><nav class="rail" id="rail" aria-label="Seções"></nav><main id="view"></main></div>
<div class="dock hidden" id="dock">
  <div id="spwrap" class="hidden"><div id="spembed"></div></div>
  <div class="dock-bar">
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="dock-title" id="docktitle">Música desligada</div>
    <button class="iconbtn" data-do="music-toggle" id="dockplay" title="Ligar ou desligar a música" aria-label="Ligar ou desligar a música">▶</button>

/* ---------- estado ---------- */
const S={user:null,profile:null,profiles:[],assets:[],holdings:[],tx:[],items:[],inventory:[],missions:[],completions:[],
  movers:{},settings:{site_name:'Bolsa do Autsim',announcement:'',accent_color:'#8b5cf6',daily_bonus:50},

function xpForLevel(l){if(l<=1)return 0;const x=(l-1)/98;return Math.round(Number(S.xpConfig.base||100)*Math.pow(l-1,Number(S.xpConfig.exponent||1.55))+Number(S.xpConfig.endgame_bonus||18000)*Math.pow(x,5))}
function levelOf(xp){let l=1;while(l<99&&xp>=xpForLevel(l+1))l++;return l}
function xpProgress(xp){const l=levelOf(xp),lo=xpForLevel(l),hi=xpForLevel(Math.min(99,l+1));return{l,lo,hi,pct:l>=99?100:clamp((xp-lo)/(hi-lo)*100,0,100)}}

/* ---------- relógio do servidor (para animações sincronizadas) ---------- */
let clockOffset=0,clockInit=false;
const srvNow=()=>Date.now()+clockOffset;
function syncClock(iso,t0,t1){const t=Date.parse(iso);if(isNaN(t))return;const off=t-(t0+t1)/2;clockOffset=clockInit?clockOffset*.7+off*.3:off;clockInit=true}
async function stateRpc(fn){const t0=Date.now();const r=await sb.rpc(fn);const t1=Date.now();if(r.error)throw r.error;if(r.data?.now)syncClock(r.data.now,t0,t1);return r.data}

/* ---------- toasts, modal ---------- */
function toast(msg,kind='ok',ms=4200){const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+(kind==='ok'?'':kind);t.textContent=msg;box.appendChild(t);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>t.remove(),ms)}
const errMsg=e=>(e&&(e.message||e.error_description))||'Algo deu errado. Tente de novo.';
function openModal(html,wide=false){const m=$('#modal');m.innerHTML=`<div class="panel sheet${wide?' wide':''}">${html}</div>`;m.classList.remove('hidden');const f=m.querySelector('input,select,textarea,button.btn-main');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
document.addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
function confirmBox(msg,okLabel='Confirmar'){return new Promise(res=>{openModal(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:18px;justify-content:flex-end"><button id="cfNo">Cancelar</button><button id="cfYes" class="btn-main">${esc(okLabel)}</button></div>`);$('#cfNo').onclick=()=>{closeModal();res(false)};$('#cfYes').onclick=()=>{closeModal();res(true)}})}
/* Formulário genérico: fields=[{name,label,type,value,options,hint,required}] */
function openForm({title,intro,fields,submit='Salvar',onSubmit,wide=false}){
  const inputs=fields.map(f=>{const id='f_'+f.name,v=f.value??'';let c;
    if(f.type==='textarea')c=`<textarea id="${id}" rows="3" ${f.max?`maxlength="${f.max}"`:''}>${esc(v)}</textarea>`;
    else if(f.type==='select')c=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    else if(f.type==='checkbox')return `<label class="inline"><input id="${id}" type="checkbox" ${v?'checked':''}> ${esc(f.label)}</label>`;
    else c=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max&&f.type!=='number'?`maxlength="${f.max}"`:''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.type==='number'?'style="width:100%"':''}>`;
    return `<label>${esc(f.label)}${c}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`}).join('');
  openModal(`<h3>${esc(title)}</h3>${intro?`<p class="muted" style="margin-top:6px">${esc(intro)}</p>`:''}<form id="genform"><div class="formgrid">${inputs}</div><div class="row" style="justify-content:flex-end"><button type="button" id="gfCancel">Cancelar</button><button type="submit" class="btn-main">${esc(submit)}</button></div></form>`,wide);
  $('#gfCancel').onclick=closeModal;
  $('#genform').onsubmit=async ev=>{ev.preventDefault();const vals={};for(const f of fields){const el=$('#f_'+f.name);vals[f.name]=f.type==='checkbox'?el.checked:(f.type==='number'?(el.value===''?null:Number(el.value)):el.value)}
    const btn=ev.submitter||$('#genform button[type=submit]');btn.disabled=true;try{await onSubmit(vals);closeModal()}catch(e){toast(errMsg(e),'err')}finally{btn.disabled=false}};
}

/* ---------- números animados ---------- */
function countTo(el,to,dur=700,dec=2){if(!el)return;to=Number(to||0);const from=el.dataset.v!==undefined?Number(el.dataset.v):to;el.dataset.v=to;
  if(!P.motion||from===to){el.textContent=fmt(to,dec);return}
  const t0=performance.now();const f=t=>{const p=clamp((t-t0)/dur,0,1);el.textContent=fmt(from+(to-from)*ease.out3(p),dec);if(p<1&&el.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- efeitos sonoros (sintetizados, sem arquivos) ---------- */
const SFX={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,d=.08,type='sine',vol=.05,at=0,to=0){const c=this.ctx;if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)},
  play(n){if(!P.sfx)return;this.init();if(!this.ctx)return;
    switch(n){
      case'click':this.tone(520,.05,'triangle',.03);break;
      case'coin':this.tone(988,.07,'square',.03);this.tone(1319,.14,'square',.03,.07);break;
      case'win':[523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.05,i*.08));break;
      case'lose':this.tone(240,.28,'sawtooth',.04,0,110);break;
      case'tick':this.tone(1200,.03,'square',.015);break;
      case'launch':this.tone(120,.6,'sawtooth',.04,0,520);break;
      case'cash':this.tone(784,.08,'triangle',.06);this.tone(1175,.18,'triangle',.06,.08);break;
      case'crash':this.tone(180,.45,'sawtooth',.07,0,40);break;
      case'chat':this.tone(740,.06,'sine',.03);break;
      case'error':this.tone(200,.15,'square',.03);break;
      case'level':[392,523,659,784,1047].forEach((f,i)=>this.tone(f,.18,'triangle',.05,i*.07));break;
    }}};
document.addEventListener('click',e=>{if(e.target.closest('button,.tk'))SFX.play('click')},true);

/* ---------- confete e chuva de moedas ---------- */
const FX={cv:null,cx:null,parts:[],run:false,
  init(){this.cv=$('#fx');this.cx=this.cv&&this.cv.getContext?this.cv.getContext('2d'):null;this.resize();addEventListener('resize',()=>this.resize())},
  resize(){if(this.cv){this.cv.width=innerWidth;this.cv.height=innerHeight}},
  add(p){this.parts.push(p);if(!this.run&&this.cx){this.run=true;requestAnimationFrame(()=>this.step())}},
  confetti(x=innerWidth/2,y=innerHeight/3,n=70){if(!P.motion||!this.cx)return;const cols=['#ffc857','#8b5cf6','#3ddc97','#ff5d73','#5cc8ff','#fff'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,g:.28,life:90+Math.random()*50,c:cols[i%cols.length],w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4})}},
  rain(n=26){if(!P.motion||!this.cx)return;for(let i=0;i<n;i++)this.add({x:Math.random()*innerWidth,y:-30-Math.random()*400,vx:(Math.random()-.5)*1.5,vy:3+Math.random()*4,g:.05,life:200,emoji:'🪙',size:20+Math.random()*16,r:0,vr:(Math.random()-.5)*.1})},
  step(){const c=this.cx;c.clearRect(0,0,this.cv.width,this.cv.height);this.parts=this.parts.filter(p=>{p.life--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.life<=0||p.y>innerHeight+60)return false;
      c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=clamp(p.life/30,0,1);if(p.emoji){c.font=p.size+'px serif';c.fillText(p.emoji,-p.size/2,0)}else{c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h)}c.restore();return true});
    if(this.parts.length)requestAnimationFrame(()=>this.step());else{this.run=false;c.clearRect(0,0,this.cv.width,this.cv.height)}}};

/* ---------- sparkline em SVG ---------- */
function spark(arr,w=96,h=28){arr=(arr||[]).map(Number);if(arr.length<2)return`<svg class="spark" width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#4a4580" stroke-dasharray="3 3"/></svg>`;
  const mn=Math.min(...arr),mx=Math.max(...arr),rg=mx-mn||1,up=arr[arr.length-1]>=arr[0];
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*(w-2)+1).toFixed(1)},${(h-3-((v-mn)/rg)*(h-6)).toFixed(1)}`).join(' ');
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'#3ddc97':'#ff5d73'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

/* ---------- peças de UI repetidas ---------- */
function coinTag(a){return`<span class="coin">${a.avatar_url?`<img src="${esc(a.avatar_url)}" alt="" loading="lazy">`:''}<span><span class="sym">${esc(a.symbol||'MOEDA$')}</span> <span class="nm">${esc(a.name||'')}</span></span></span>`}
function whoTag(p){return`<span class="coin">${p.avatar_url?`<img class="avatar" style="width:26px;height:26px" src="${esc(p.avatar_url)}" alt="" loading="lazy">`:''}<span>${esc(p.username||'Membro')}</span></span>`}
function table(headers,rows,empty='Nada por aqui ainda.'){return`<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
const fmtDate=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function countdownTxt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}

/* ============================================================
   Música de fundo: playlist do ADM (YouTube/Spotify) + fila paga pelos membros (Spotify)
   ============================================================ */
const MUS={tracks:[],slots:[],idx:0,cur:null,yt:null,ytReady:false,ytLoading:false,pendingYt:null,gesture:false,price:100,minutes:60};

async function musicLoad(){
  try{const d=await stateRpc('music_state');MUS.tracks=d.tracks||[];MUS.slots=d.slots||[];MUS.price=Number(d.price||100);MUS.minutes=Number(d.minutes||60);musicTick()}
  catch(e){console.warn('música:',e.message||e)}
}
function musicActiveSlot(){const n=srvNow();return MUS.slots.find(s=>Date.parse(s.starts_at)<=n&&n<Date.parse(s.ends_at))||null}
function musicDesired(){
  const s=musicActiveSlot();
  if(s)return{key:'slot:'+s.id,kind:'spotify',type:s.ref_type,id:s.ref_id,title:s.title,by:s.username};
  const t=MUS.tracks.filter(x=>x.active);if(!t.length)return null;
  const x=t[MUS.idx%t.length];
  return{key:'trk:'+x.id,kind:x.kind,type:x.ref_type,id:x.ref_id,title:x.title};
}
function musicTick(){
  if(!S.user){return}
  if(!P.music||!MUS.gesture){dockUpdate();return}
  const want=musicDesired();
  if(!want){musicStop();MUS.cur=null;dockUpdate();return}
  if(!MUS.cur||MUS.cur.key!==want.key)musicPlay(want);
  else dockUpdate();
}
function musicPlay(w){
  MUS.cur=w;
  if(w.kind==='youtube'){spHide();ytPlay()}
  else{ytStop();spShow(w)}
  dockUpdate();
}
function musicStop(){ytStop();spHide();MUS.cur=null;dockUpdate()}
function musicNext(){MUS.idx++;MUS.cur=null;if(P.music)musicTick();else dockUpdate()}
function musicToggle(){
  MUS.gesture=true;P.music=!P.music;savePrefs();
  if(P.music)musicTick();else musicStop();
  dockUpdate();const c=$('#prefMusic');if(c)c.checked=P.music;
}

/* YouTube */
function ytEnsure(cb){
  if(window.YT&&YT.Player){cb();return}
  MUS.pendingYt=cb;if(MUS.ytLoading)return;MUS.ytLoading=true;
  window.onYouTubeIframeAPIReady=()=>{MUS.ytLoading=false;const c=MUS.pendingYt;MUS.pendingYt=null;if(c)c()};
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{MUS.ytLoading=false;toast('Não foi possível carregar o player do YouTube.','err')};document.head.appendChild(s);
}
function ytPlay(){
  ytEnsure(()=>{
    if(!MUS.yt){
      const holder=document.createElement('div');holder.id='ytinner';$('#ytp').appendChild(holder);
      MUS.yt=new YT.Player('ytinner',{width:'200',height:'200',playerVars:{playsinline:1,controls:0,rel:0},events:{
        onReady:()=>{MUS.ytReady=true;ytLoadCur()},
        onStateChange:e=>{if(e.data===0)musicNext()},
        onError:()=>{toast('Essa faixa do YouTube não pôde tocar. Pulando para a próxima.','err');setTimeout(musicNext,900)}}});
    }else if(MUS.ytReady)ytLoadCur();
  });
}
function ytLoadCur(){
  const w=MUS.cur;if(!w||w.kind!=='youtube'||!MUS.ytReady)return;
  try{MUS.yt.setVolume(Math.round(P.volume*100));
    if(w.type==='playlist')MUS.yt.loadPlaylist({list:w.id,listType:'playlist',index:0});else MUS.yt.loadVideoById(w.id)}catch(e){console.warn(e)}
}
function ytStop(){try{if(MUS.yt&&MUS.ytReady)MUS.yt.stopVideo()}catch(e){}}
function musicSetVolume(v){P.volume=clamp(v,0,1);savePrefs();try{if(MUS.yt&&MUS.ytReady)MUS.yt.setVolume(Math.round(P.volume*100))}catch(e){}}

/* Spotify (embed oficial; o navegador exige apertar play dentro do player) */
function spShow(w){
  $('#spwrap').classList.remove('hidden');
  $('#spembed').innerHTML=`<iframe title="Spotify" src="https://open.spotify.com/embed/${esc(w.type)}/${esc(w.id)}?theme=0" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" style="border-radius:12px;display:block"></iframe>`;
}
function spHide(){$('#spwrap').classList.add('hidden');$('#spembed').innerHTML=''}

function dockUpdate(){
  const dock=$('#dock');if(!dock)return;
  dock.classList.toggle('hidden',!S.user);
  const w=MUS.cur;
  dock.classList.toggle('playing',!!(P.music&&w));
  $('#dockplay').textContent=P.music?'⏸':'▶';
  let t;
  if(!P.music)t='Música desligada';
  else if(!w)t=MUS.tracks.some(x=>x.active)?'Carregando…':'Sem faixas — o ADM ainda não adicionou músicas';
  else t=`<span>♪ ${esc(w.title)}</span><small>${w.by?`pedida por ${esc(w.by)}`:(w.kind==='spotify'?'Spotify':'YouTube')}${w.kind==='spotify'?' · aperte ▶ no player':''}</small>`;
  $('#docktitle').innerHTML=t;
}
/* O navegador só libera som depois de um clique: o primeiro clique "arma" a música. */
function armMusic(){
  const go=()=>{MUS.gesture=true;if(P.music)musicTick();removeEventListener('pointerdown',go,true);removeEventListener('keydown',go,true)};
  addEventListener('pointerdown',go,true);addEventListener('keydown',go,true);
}

/* ============================================================
   Telas: início, mercado, carteira, gráficos, loja, missões, ranking, extrato, perfil, configurações
   ============================================================ */
const TABS=[['inicio','🏠','Início'],['bolsa','📈','Mercado'],['carteira','💼','Carteira'],['graficos','📊','Gráficos'],['cassino','🎰','Cassino'],['loja','🛍️','Loja'],['missoes','🎯','Missões'],['ranking','🏅','Ranking'],['extrato','🧾','Extrato'],['perfil','👤','Perfil'],['config','⚙️','Configurações']];
const todaySP=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const nextResetMs=()=>{const t=Date.now()-3*3600e3;return (Math.floor(t/86400e3)+1)*86400e3+3*3600e3-Date.now()};
const rankedProfiles=()=>S.profiles.slice().sort((a,b)=>worth(b.id)-worth(a.id));
const changeOf=id=>Number(S.movers[id]?.change_pct||0);
const changeTag=c=>`<span class="${c>0?'up':c<0?'down':'dim'}">${c>0?'▲':c<0?'▼':'■'} ${pctTxt(c)}</span>`;
const topMovers=(n=10)=>S.assets.map(a=>({a,c:changeOf(a.id)})).sort((x,y)=>Math.abs(y.c)-Math.abs(x.c)).slice(0,n);

/* ---------- topo: ticker, barra do usuário, faixa de aviso ---------- */
function renderTicker(){
  const el=$('#ticker');if(!el)return;
  const list=topMovers(10);
  const sig=JSON.stringify(list.map(x=>[x.a.id,x.a.symbol,x.a.price,x.c]));
  if(sig===S.tickSig)return;S.tickSig=sig;
  if(!list.length){el.innerHTML='<div class="tk-empty">O mercado ainda não tem moedas.</div>';return}
  const one=list.map(({a,c})=>`<button class="tk" data-do="coin" data-id="${esc(a.id)}" title="Variação em 24h — clique para ver o gráfico"><b>${esc(a.symbol)}</b><span class="pr">${fmt(a.price)}</span><span class="ch ${c>0?'up':c<0?'down':'dim'}">${c>0?'▲':c<0?'▼':'■'} ${pctTxt(c)}</span></button>`).join('');
  const k=Math.max(1,Math.ceil(1700/(list.length*200)));
  const group=one.repeat(k);
  const dur=Math.max(24,Math.round(list.length*k*200/55));
  el.innerHTML=`<div class="tk-track" style="--dur:${dur}s">${group}${group}</div>`;
}

function renderRail(){
  const tabs=TABS.slice();if(isAdmin())tabs.push(['adm','🛡️','Painel ADM']);
  $('#rail').innerHTML=tabs.map(([k,i,n])=>`<button data-do="tab" data-tab="${k}" class="${S.tab===k?'active':''}"><span class="ic">${i}</span>${n}${k==='cassino'&&S.unread&&S.tab!=='cassino'?`<span class="badge">${S.unread>9?'9+':S.unread}</span>`:''}</button>`).join('');
}
function keepInputs(fn){
  const snap={};$$('#view input,#view select,#view textarea').forEach(el=>{if(el.id)snap[el.id]=el.type==='checkbox'?el.checked:el.value});
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart!==undefined?[ae.selectionStart,ae.selectionEnd]:null;
  fn();
  for(const[id,v]of Object.entries(snap)){const el=document.getElementById(id);if(el){if(el.type==='checkbox')el.checked=v;else el.value=v}}
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{if(pos)el.setSelectionRange(...pos)}catch(e){}}}
}
function renderView(){
  const fn=V[S.tab]||V.inicio;
  $('#view').innerHTML=fn();
  const after=AFTER[S.tab];if(after)after();
}
function render(){
  if(CAS.running&&S.tab!=='cassino')casinoStop();
  if(S.tab==='cassino')S.unread=0;
  renderRail();renderView();
  const v=$('#view');v.style.animation='none';void v.offsetWidth;v.style.animation='';
  if(S.tab==='cassino'&&!CAS.running)casinoStart();
  window.scrollTo({top:0});
}
function goTab(t){if(t==='adm'&&!isAdmin())t='inicio';S.tab=t;render()}

function drawWealth(){
  const el=$('#wealthchart');if(!el||typeof Chart==='undefined')return;
  if(S.charts.wealth){S.charts.wealth.destroy();delete S.charts.wealth}
  const mine=S.holdings.filter(h=>h.user_id===S.user.id&&Number(h.quantity)*price(h.asset_id)>0);
  const labels=['Saldo',...mine.map(h=>asset(h.asset_id).symbol||'Ativo')],vals=[Number(me().balance||0),...mine.map(h=>Number(h.quantity)*price(h.asset_id))];
  S.charts.wealth=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data:vals,borderWidth:0,backgroundColor:['#8b5cf6','#3ddc97','#ffc857','#ff5d73','#5cc8ff','#c084fc','#f472b6','#34d399']}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:P.motion?700:0},plugins:{legend:{position:'right',labels:{color:'#cfcaf5'}}}}});
}
async function drawPrice(id){
  const el=$('#pricechart');if(!el||!id)return;
  const {data,error}=await sb.from('price_history').select('price,created_at').eq('asset_id',id).order('created_at',{ascending:true}).limit(400);
  if(S.tab!=='graficos'||S.chartAsset!==id)return;
  if(error){toast('Não foi possível carregar o histórico.','err');return}
  const rows=data||[];
  const ps=rows.map(r=>Number(r.price)),cur=price(id);
  const box=$('#chartstats');if(box&&ps.length)box.innerHTML=`<span class="pill">Atual ${fmt(cur)}</span><span class="pill up">Máx ${fmt(Math.max(...ps))}</span><span class="pill down">Mín ${fmt(Math.min(...ps))}</span><span class="pill">24h ${pctTxt(changeOf(id))}</span>`;
  if(typeof Chart==='undefined')return;
  if(S.charts.price){S.charts.price.destroy();delete S.charts.price}
  const ctx=el.getContext('2d'),g=ctx.createLinearGradient(0,0,0,300);g.addColorStop(0,'rgba(139,92,246,.45)');g.addColorStop(1,'rgba(139,92,246,0)');
  S.charts.price=new Chart(el,{type:'line',data:{labels:rows.map(r=>fmtDate(r.created_at)),datasets:[{label:'Preço (AC)',data:ps,borderColor:'#b49aff',backgroundColor:g,fill:true,tension:.3,pointRadius:ps.length>60?0:3,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:P.motion?800:0},interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8a85b8',maxTicksLimit:7},grid:{color:'#221e45'}},y:{ticks:{color:'#8a85b8'},grid:{color:'#221e45'}}}}});
}

/* ---------- ações das telas ---------- */
async function trade(kind,id){
  const q=Number($('#qty-'+CSS.escape(id))?.value);
  if(!Number.isInteger(q)||q<1){toast('Informe uma quantidade inteira maior que zero.','err');return}
  const{data,error}=await sb.rpc(kind,{p_asset_id:id,p_qty:q});
  if(error){toast(errMsg(error),'err');SFX.play('error');return}
  SFX.play('coin');
  toast(kind==='buy_shares'?`Compra feita: ${q} × ${asset(id).symbol} por ${fmt(data?.cost)} AC`:`Venda feita: ${q} × ${asset(id).symbol} por ${fmt(data?.proceeds)} AC`);
  await refreshLight();
}
async function claimDaily(silent){
  const{data,error}=await sb.rpc('claim_daily');
  if(error){if(!silent)toast(errMsg(error),'err');return}
  if(data?.claimed){toast(`+${fmt(data.amount,0)} AC de bônus diário! 🎁`,'gain',5200);SFX.play('win');FX.rain();if(S.profile){S.profile.last_daily_date=todaySP()}setBalance(data.balance)}
  else if(S.profile)S.profile.last_daily_date=todaySP();
  if(S.tab==='inicio')renderView();
}
async function buyItem(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  if(!await confirmBox(`Comprar "${it.name}" por ${fmt(it.price)} AC?`,'Comprar'))return;
  const{data,error}=await sb.rpc('purchase_shop_item',{p_item_id:id,p_quantity:1});
  if(error){toast(errMsg(error),'err');SFX.play('error');return}
  SFX.play('coin');toast(`Item comprado: ${data?.item||it.name}. Agora é só esperar o ADM entregar.`,'gain');
  await refreshLight(true);
}

async function rlPoll(g){
  if(g!==CAS.gen)return;
  try{const st=await stateRpc('roulette_state');if(g!==CAS.gen)return;rlApply(st)}catch(e){if(g===CAS.gen)console.warn('roleta:',e.message||e)}
  if(g===CAS.gen)casinoTimer(()=>rlPoll(g),1100);
}
function rlApply(st){
  const prev=CAS.rl.st;CAS.rl.st=st;const r=st.round;
  const same=prev&&prev.round.id===r.id;
  if(r.status==='spinning'&&CAS.rl.phase!=='spin:'+r.id){CAS.rl.phase='spin:'+r.id;if(same||!prev)SFX.play('launch')}
  if(r.status==='settled'&&CAS.rl.phase!=='done:'+r.id){
    const announce=CAS.rl.phase==='spin:'+r.id||(same&&prev.round.status!=='settled');
    CAS.rl.phase='done:'+r.id;
    if(announce)rlAnnounce(st);
    refreshBalance();
  }
  if(r.status==='betting'&&CAS.rl.phase&&CAS.rl.phase!=='bet:'+r.id)CAS.rl.phase='bet:'+r.id;
  rlSide(st);
}
function rlAnnounce(st){
  const mine=(st.bets||[]).filter(b=>b.user_id===S.user.id);if(!mine.length)return;
  const bet=mine.reduce((n,b)=>n+Number(b.amount),0),pay=mine.reduce((n,b)=>n+Number(b.payout||0),0),net=pay-bet;
  if(net>0){toast(`Deu ${COLOR_PT[st.round.result_color].toLowerCase()} ${st.round.result_number}! Você ganhou +${fmt(net)} AC 🎉`,'gain',5500);SFX.play('win');FX.confetti()}
  else if(pay>0){toast(`Deu ${st.round.result_number}. Você recuperou ${fmt(pay)} AC.`)}
  else{toast(`Deu ${COLOR_PT[st.round.result_color].toLowerCase()} ${st.round.result_number}. Você perdeu ${fmt(bet)} AC.`);SFX.play('lose')}
}
function rlSide(st){
  const r=st.round,betting=r.status==='betting';
  const mx=$('#rlmax');if(mx)mx.textContent=`Aposta máxima: ${fmt(st.max_bet,0)} AC`;
  $$('[data-do=rl-bet]').forEach(b=>b.disabled=!betting);
  const h=$('#rlhist');if(h)h.innerHTML=(st.history||[]).map(x=>`<span class="h-${x.color}" title="${COLOR_PT[x.color]}">${x.n}</span>`).join('')||'<small>Nenhuma rodada ainda.</small>';
  const box=$('#rlbets');if(box){
    const cols=['red','black','green'];
    box.innerHTML=cols.map(c=>{const list=(st.bets||[]).filter(b=>b.color===c),tot=list.reduce((n,b)=>n+Number(b.amount),0);
      return`<div class="col"><h4><span>${COLOR_PT[c]}</span><span class="gold">${fmt(tot,0)} AC</span></h4>${list.map(b=>{const done=b.payout!==null&&b.payout!==undefined,won=done&&Number(b.payout)>0;return`<div class="betline ${done?(won?'win':'lose'):''}"><span>${esc(b.username)}${b.user_id===S.user.id?' (você)':''}</span><span>${won?'+'+fmt(b.payout,0):fmt(b.amount,0)}</span></div>`}).join('')||'<small class="dim">sem apostas</small>'}</div>`}).join('');
  }
  const s=$('#rlstatus');if(s){
    let t;if(r.status==='betting')t=r.betting_ends_at?'':'Faça a primeira aposta para iniciar a rodada.';
    else if(r.status==='spinning')t='A bola está girando…';
    else t=`Saiu ${r.result_number} (${COLOR_PT[r.result_color].toLowerCase()}). Nova rodada em instantes.`;
    if(t||r.status!=='betting')s.textContent=t;
  }
}

function rlFrame(){
  if(!CAS.running||CAS.tab!=='roleta')return;
  CAS.raf=requestAnimationFrame(rlFrame);
  const cv=$('#rlcv');if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,N=37,step=Math.PI*2/N,now=srvNow(),st=CAS.rl.st,r=st&&st.round;
  const wa=((now/1000)*0.32)%(Math.PI*2); // reduzido a uma volta: ângulos enormes quebram o arc() do canvas
  // aro externo
  const rim=c.createRadialGradient(cx,cy,R*.9,cx,cy,R);rim.addColorStop(0,'#3a2d73');rim.addColorStop(1,'#120d2e');
  c.beginPath();c.arc(cx,cy,R,0,7);c.fillStyle=rim;c.fill();
  c.lineWidth=2;c.strokeStyle='#5b49b0';c.stroke();
  // casas
  for(let i=0;i<N;i++){
    const n=WHEEL[i],a0=wa+i*step-step/2-Math.PI/2,a1=a0+step;
    c.beginPath();c.moveTo(cx+Math.cos(a0)*R*.62,cy+Math.sin(a0)*R*.62);c.arc(cx,cy,R*.88,a0,a1);c.arc(cx,cy,R*.62,a1,a0,true);c.closePath();
    c.fillStyle=n===0?'#17a05d':REDS.has(n)?'#d8344d':'#1a1830';c.fill();c.strokeStyle='#8f7be0';c.lineWidth=.8;c.stroke();
    const am=a0+step/2;c.save();c.translate(cx+Math.cos(am)*R*.8,cy+Math.sin(am)*R*.8);c.rotate(am+Math.PI/2);
    c.fillStyle='#f3f0ff';c.font=`700 ${Math.max(9,R*.075)}px Inter,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(n,0,0);c.restore();
  }
  // miolo
  c.beginPath();c.arc(cx,cy,R*.6,0,7);const hub=c.createRadialGradient(cx,cy,0,cx,cy,R*.6);hub.addColorStop(0,'#2a2158');hub.addColorStop(1,'#0e0a24');c.fillStyle=hub;c.fill();c.strokeStyle='#5b49b0';c.lineWidth=2;c.stroke();
  // texto central
  c.textAlign='center';c.textBaseline='middle';
  if(r&&(r.status==='settled'||(r.status==='spinning'&&now>=Date.parse(r.spin_ends_at)))&&r.result_number!==null){
    c.beginPath();c.arc(cx,cy,R*.3,0,7);c.fillStyle=r.result_color==='red'?'#d8344d':r.result_color==='green'?'#17a05d':'#26224a';c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
    c.fillStyle='#fff';c.font=`800 ${R*.26}px 'Bricolage Grotesque',sans-serif`;c.fillText(r.result_number,cx,cy+2);
  }else if(r&&r.status==='betting'){
    c.fillStyle='#f3f0ff';
    if(r.betting_ends_at){const left=Math.max(0,Math.ceil((Date.parse(r.betting_ends_at)-now)/1000));c.font=`800 ${R*.34}px 'Bricolage Grotesque',sans-serif`;c.fillText(left,cx,cy);c.font=`600 ${R*.075}px sans-serif`;c.fillStyle='#a8a3d1';c.fillText('apostas fecham',cx,cy+R*.26);
      if(left!==CAS.rl.lastTick&&left<=5&&left>0){CAS.rl.lastTick=left;SFX.play('tick')}}
    else{c.font=`${R*.3}px serif`;c.fillText('🎰',cx,cy)}
  }else if(r){c.fillStyle='#a8a3d1';c.font=`700 ${R*.12}px sans-serif`;c.fillText('girando…',cx,cy)}
  // bola
  let ang,rad,show=true;
  if(!r||r.status==='betting'){ang=-(now/1000)*0.9;rad=R*.935}
  else if(r.result_number!==null&&r.result_number!==undefined){
    const idx=WHEEL.indexOf(r.result_number),spinEnd=Date.parse(r.spin_ends_at),p=clamp(1-(spinEnd-now)/8000,0,1);
    const rel=idx*step-Math.PI/2,D=Math.PI*2*8,e=ease.out5(p);
    ang=wa+rel+D*(1-e);rad=R*(.935-.2*ease.out3(clamp((p-.55)/.45,0,1)));
  }else show=false;
  if(show){const bx=cx+Math.cos(ang)*rad,by=cy+Math.sin(ang)*rad;
    c.beginPath();c.arc(bx,by,Math.max(5,R*.032),0,7);const bg=c.createRadialGradient(bx-2,by-2,1,bx,by,R*.04);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#cfd3e6');c.fillStyle=bg;c.shadowColor='#0008';c.shadowBlur=6;c.fill();c.shadowBlur=0}
  // marcador
  c.beginPath();c.moveTo(cx,cy-R-2);c.lineTo(cx-8,cy-R-16);c.lineTo(cx+8,cy-R-16);c.closePath();c.fillStyle='#ffc857';c.fill();
}

function rkFrame(){
  if(!CAS.running||CAS.tab!=='foguete')return;
  CAS.raf=requestAnimationFrame(rkFrame);
  const cv=$('#rkcv');if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const st=CAS.rk.st,now=srvNow(),r=st&&st.round,g=st?Number(st.growth):.12;
  let t=0,m=1,status=r?r.status:'betting';
  if(r&&status==='flying'){t=Math.max(0,(now-Date.parse(r.started_at))/1000);m=Math.exp(g*t)}
  else if(r&&status==='crashed'){t=Math.max(0,(Date.parse(r.crashed_at)-Date.parse(r.started_at))/1000);m=Number(r.crash_point)}
  // estrelas
  if(!CAS.rk.stars)CAS.rk.stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.3,v:Math.random()*.5+.2}));
  for(const s of CAS.rk.stars){const yy=((s.y+(status==='flying'?t*s.v*.05:0))%1);c.globalAlpha=.25+s.s*.25;c.fillStyle='#fff';c.fillRect(s.x*W,yy*H,s.s,s.s)}c.globalAlpha=1;
  const padL=46,padB=34,padT=20,padR=26,pw=W-padL-padR,ph=H-padB-padT;
  const tMax=Math.max(10,t*1.12),mMax=Math.max(2,m*1.22);
  const X=tt=>padL+tt/tMax*pw,Y=mm=>padT+ph-((mm-1)/(mMax-1))*ph;
  // grade
  c.strokeStyle='#241f4d';c.lineWidth=1;c.fillStyle='#6f6a9c';c.font='11px sans-serif';c.textAlign='right';
  const stepM=mMax>40?10:mMax>16?5:mMax>8?2:mMax>4?1:.5;
  for(let v=1;v<=mMax;v+=stepM){const y=Y(v);c.beginPath();c.moveTo(padL,y);c.lineTo(W-padR,y);c.stroke();c.fillText(fmt(v,v%1?1:0)+'x',padL-6,y+4)}
  const crashed=status==='crashed';
  let tipX=X(0),tipY=Y(1),ang=-Math.PI/2.6;
  if(status==='flying'||crashed){
    const N=90;c.beginPath();
    for(let i=0;i<=N;i++){const tt=i/N*t,mm=Math.exp(g*tt);const x=X(tt),y=Y(mm);if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}
    tipX=X(t);tipY=Y(Math.min(m,mMax));
    const ex=X(Math.max(0,t-.15)),ey=Y(Math.exp(g*Math.max(0,t-.15)));ang=Math.atan2(tipY-ey,tipX-ex);
    c.lineWidth=4;c.lineCap='round';c.strokeStyle=crashed?'#ff5d73':'#b49aff';c.shadowColor=crashed?'#ff5d73':'#8b5cf6';c.shadowBlur=14;c.stroke();c.shadowBlur=0;
    c.lineTo(tipX,padT+ph);c.lineTo(X(0),padT+ph);c.closePath();
    const gr=c.createLinearGradient(0,padT,0,padT+ph);gr.addColorStop(0,crashed?'rgba(255,93,115,.28)':'rgba(139,92,246,.32)');gr.addColorStop(1,'rgba(139,92,246,0)');c.fillStyle=gr;c.fill();
  }
  c.save();c.translate(tipX,tipY);
  if(crashed){c.font='44px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('💥',0,0)}
  else{c.rotate(ang+Math.PI/4);c.font='34px serif';c.textAlign='center';c.textBaseline='middle';if(status==='flying'){c.shadowColor='#ffb347';c.shadowBlur=18}c.fillText('🚀',0,0)}
  c.restore();
  // textos
  const big=$('#rkbig'),sub=$('#rksub'),wrap=$('#rkwrap');let bt,stx='';
  if(status==='betting'){if(r&&r.betting_ends_at){const left=Math.max(0,(Date.parse(r.betting_ends_at)-now)/1000);bt=left>0?`Decola em ${Math.ceil(left)}s`:'Preparar…';stx='Faça sua aposta'}else{bt='Aguardando apostas';stx='A contagem começa com a primeira aposta'}}
  else if(status==='flying'){bt=fmtMult(Math.floor(m*100)/100);const my=st&&rkMy(st);if(my&&!my.cashed_mult){const pay=Math.floor(Number(my.amount)*m*100)/100;stx=`Sacar agora rende ${fmt(pay)} AC`;const cb=$('#rkcash');if(cb)cb.textContent=`Sacar ${fmt(pay)} AC (${fmtMult(Math.floor(m*100)/100)})`}}
  else{bt=`Explodiu em ${fmtMult(m)}`;stx='Próxima rodada em instantes'}
  wrap.classList.toggle('crashed',crashed);
  if(CAS.rk.lastTxt!==bt+'|'+stx){CAS.rk.lastTxt=bt+'|'+stx;big.textContent=bt;sub.textContent=stx}
}

function chatHtml(){return`<div class="panel chatbox"><div class="chat-head"><h3>💬 Chat do cassino</h3><small><span class="dot" id="chatdot"></span><span id="chatstate">conectando</span></small></div><div id="chatlist"></div><form class="chat-form" id="chatform" data-form="chat" autocomplete="off"><input id="chatinput" maxlength="300" placeholder="Mande uma mensagem…" aria-label="Mensagem"><button class="btn-main">Enviar</button></form></div>`}
function chatMsgHtml(m){const mine=m.user_id===S.user.id;return`<div class="msg ${mine?'mine':''}" data-mid="${m.id}">${m.avatar_url?`<img class="avatar" src="${esc(m.avatar_url)}" alt="" loading="lazy">`:'<span class="avatar"></span>'}<div style="min-width:0;flex:1"><div class="who">${esc(m.username||'Membro')}</div><div class="txt">${esc(m.body)}</div></div>${isAdmin()?`<button class="del" data-do="chat-del" data-id="${m.id}" title="Apagar mensagem" aria-label="Apagar mensagem">✕</button>`:''}</div>`}
function chatRender(){
  const l=$('#chatlist');if(!l)return;
  l.innerHTML=CAS.chat.msgs.map(chatMsgHtml).join('')||'<div class="empty small">Ninguém falou ainda. Mande a primeira mensagem!</div>';
  l.scrollTop=l.scrollHeight;chatDot();
}
function chatDot(){const d=$('#chatdot'),s=$('#chatstate');if(d)d.classList.toggle('on',CAS.chat.live);if(s)s.textContent=CAS.chat.live?'ao vivo':'atualizando a cada poucos segundos'}
function chatPush(m){
  if(!m||CAS.chat.ids.has(m.id))return;CAS.chat.ids.add(m.id);CAS.chat.msgs.push(m);CAS.chat.lastId=Math.max(CAS.chat.lastId,m.id);
  if(CAS.chat.msgs.length>120){const o=CAS.chat.msgs.shift();CAS.chat.ids.delete(o.id)}
  const l=$('#chatlist');
  if(l){const near=l.scrollHeight-l.scrollTop-l.clientHeight<80;const e=l.querySelector('.empty');if(e)e.remove();l.insertAdjacentHTML('beforeend',chatMsgHtml(m));if(near||m.user_id===S.user.id)l.scrollTop=l.scrollHeight;
    if(m.user_id!==S.user.id)SFX.play('chat')}
  else if(m.user_id!==S.user.id&&CAS.chat.loaded){S.unread++;renderRail()}
}
function chatRemove(id){CAS.chat.msgs=CAS.chat.msgs.filter(m=>m.id!==id);const e=document.querySelector(`[data-mid="${id}"]`);if(e)e.remove()}
async function chatFetch(){
  const q=sb.from('chat_messages').select('id,user_id,username,avatar_url,body,created_at');
  const{data,error}=await(CAS.chat.lastId?q.gt('id',CAS.chat.lastId).order('id',{ascending:true}).limit(100):q.order('id',{ascending:false}).limit(60));
  if(error){console.warn('chat:',error.message);return}
  const rows=CAS.chat.lastId?data:(data||[]).reverse();
  const first=!CAS.chat.loaded;CAS.chat.loaded=true;
  rows.forEach(m=>{if(first){if(!CAS.chat.ids.has(m.id)){CAS.chat.ids.add(m.id);CAS.chat.msgs.push(m);CAS.chat.lastId=Math.max(CAS.chat.lastId,m.id)}}else chatPush(m)});
  if(first)chatRender();
}
function chatStart(){
  if(CAS.chat.sub)return;
  chatFetch();
  try{
    CAS.chat.sub=sb.channel('autsim-chat')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>chatPush(p.new))
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},p=>chatRemove(p.old&&p.old.id))
      .subscribe(s=>{CAS.chat.live=(s==='SUBSCRIBED');chatDot()});
  }catch(e){console.warn('realtime:',e)}
  CAS.chat.fb=setInterval(()=>{if(!CAS.chat.live&&S.user)chatFetch()},5000);
}
function chatStop(){if(CAS.chat.sub){try{sb.removeChannel(CAS.chat.sub)}catch(e){}}CAS.chat.sub=null;CAS.chat.live=false;clearInterval(CAS.chat.fb);CAS.chat.msgs=[];CAS.chat.ids=new Set();CAS.chat.lastId=0;CAS.chat.loaded=false}
async function chatSend(){
  const inp=$('#chatinput'),txt=inp.value.trim();if(!txt)return;inp.value='';
  const{error}=await sb.rpc('send_chat',{p_body:txt});
  if(error){inp.value=txt;toast(errMsg(error),'err',3000)}
  else if(!CAS.chat.live)chatFetch();
}

const prShare=(side,amt,m)=>{const fee=Number(CAS.pr.data?.fee||0)/100,y=Number(m.yes_total),n=Number(m.no_total),win=(side==='yes'?y:n)+amt,pool=(y+n+amt)*(1-fee);return win>0?amt/win*pool:0};

<div class="sides"><div><div class="up"><b>SIM</b> · ${m.yes_count} ${m.yes_count==1?'aposta':'apostas'}</div><div class="stat" style="font-size:22px">${fmt(y,0)} AC</div></div><div><div class="down"><b>NÃO</b> · ${m.no_count} ${m.no_count==1?'aposta':'apostas'}</div><div class="stat" style="font-size:22px">${fmt(n,0)} AC</div></div></div>
${myLine}<div class="row" style="margin-top:12px">${canBet?`<button class="btn-good" data-do="pr-bet" data-id="${esc(m.id)}" data-side="yes" ${m.my_side==='no'?'disabled':''}>Apostar no SIM</button><button class="btn-bad" data-do="pr-bet" data-id="${esc(m.id)}" data-side="no" ${m.my_side==='yes'?'disabled':''}>Apostar no NÃO</button>`:''}${canResolve?`<button data-do="pr-resolve" data-id="${esc(m.id)}" data-out="yes">Aconteceu (SIM)</button><button data-do="pr-resolve" data-id="${esc(m.id)}" data-out="no">Não aconteceu (NÃO)</button>`:''}${canCancel?`<button class="btn-ghost" data-do="pr-cancel" data-id="${esc(m.id)}">Cancelar e devolver</button>`:''}${open&&mine&&!closed?'<small class="dim">Quem cria não pode apostar. Você encerra depois do prazo.</small>':''}</div></div>`}).join('')||'<div class="panel empty">Nenhuma aposta aberta. Crie a primeira!</div>';

/* ---------- ações ---------- */
async function admRpc(fn,args,ok,reload=true){
  const{data,error}=await sb.rpc(fn,args);
  if(error)throw error;
  if(ok)toast(ok);
  if(reload){await refreshLight(true);await admLoad()}
  return data;
}

  const p=profile(id);
  openForm({title:`Dinheiro de ${p.username}`,intro:`Saldo atual: ${fmt(p.balance)} AC`,submit:'Aplicar',

async function admSaveSetting(key,type){
  const el=$('#set_'+key);if(!el)return;
  let val=el.value;if(type==='number'){val=Number(val);if(!Number.isFinite(val)){toast('Informe um número válido.','err');return}}
  const{error}=await sb.rpc('admin_set_setting',{p_key:key,p_value:val});
  if(error){toast(errMsg(error),'err');return}
  S.settings[key]=val;applySettings();toast('Configuração salva.');
}
async function admSaveXp(){
  const base=Number($('#xpbase').value),exp=Number($('#xpexp').value),bonus=Number($('#xpbonus').value);
  if(![base,exp,bonus].every(Number.isFinite)){toast('Confira os valores da curva.','err');return}
  const{error}=await sb.rpc('admin_update_xp_settings',{p_base:base,p_exponent:exp,p_endgame_bonus:bonus});
  if(error){toast(errMsg(error),'err');return}
  S.xpConfig={base,exponent:exp,endgame_bonus:bonus};toast('Curva de níveis salva.');updateUserbar();
}

/* ============================================================
   Início do app: login, carregamento de dados, atualização periódica e eventos
   ============================================================ */
async function fetchCore(){
  const uid=S.user.id;
  const r=await Promise.all([
    sb.from('profiles').select('id,username,avatar_url,balance,xp,is_admin,terms_accepted_at,last_daily_date'),
    sb.from('assets').select('id,name,symbol,avatar_url,price,total_shares,updated_at'),
    sb.from('holdings').select('user_id,asset_id,quantity'),
    sb.from('transactions').select('id,user_id,asset_id,type,quantity,unit_price,amount,balance_after,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(100),
    sb.from('shop_items').select('*').eq('active',true).order('sort_order').order('price'),
    sb.from('user_inventory').select('*').eq('user_id',uid),
    sb.from('missions').select('*').eq('active',true).order('sort_order'),
    sb.from('mission_completions').select('mission_id').eq('user_id',uid),
    sb.from('xp_settings').select('base,exponent,endgame_bonus').eq('id',true).maybeSingle(),
    sb.rpc('market_movers'),
    sb.from('site_settings').select('key,value')]);
  const [pr,ar,hr,tr,ir,inv,mr,cm,xr,mv,ss]=r;
  r.forEach((x,i)=>{if(x.error)console.warn('carga',i,x.error.message)});
  if(!pr.error){S.profiles=pr.data||[];S.profile=S.profiles.find(x=>x.id===uid)||null}
  if(!ar.error)S.assets=ar.data||[];
  if(!hr.error)S.holdings=hr.data||[];
  if(!tr.error)S.tx=tr.data||[];
  if(!ir.error)S.items=ir.data||[];
  if(!inv.error)S.inventory=inv.data||[];
  if(!mr.error)S.missions=mr.data||[];
  if(!cm.error)S.completions=cm.data||[];
  if(xr.data)S.xpConfig=xr.data;
  if(!mv.error){S.movers={};(mv.data||[]).forEach(x=>S.movers[x.asset_id]=x)}
  if(!ss.error&&ss.data)ss.data.forEach(x=>{S.settings[x.key]=x.value});
  applySettings();
}
async function loadPublicSettings(){
  try{const{data,error}=await sb.from('site_settings').select('key,value');if(!error&&data){data.forEach(x=>S.settings[x.key]=x.value);applySettings()}}catch(e){}
}
async function refreshBalance(){
  if(!S.user)return;
  const{data}=await sb.from('profiles').select('balance,xp,last_daily_date').eq('id',S.user.id).maybeSingle();
  if(data&&S.profile){Object.assign(S.profile,data);updateUserbar();const cb=$('#casbal');if(cb)cb.textContent=fmt(data.balance)}
}
const LIVE_TABS=new Set(['inicio','bolsa','carteira','ranking','extrato','loja','missoes','perfil']);
async function refreshLight(force){
  if(!S.user||!S.profile||(S.refreshing&&!force))return;
  S.refreshing=true;
  try{
    await fetchCore();updateUserbar();renderRail();renderTicker();
    if(LIVE_TABS.has(S.tab)&&($('#modal').classList.contains('hidden')||force))keepInputs(renderView);
    else if(S.tab==='graficos'&&force)renderView();
    else if(S.tab==='adm'&&force)keepInputs(renderView);
    const cb=$('#casbal');if(cb)cb.textContent=fmt(me().balance);
  }catch(e){console.warn('atualização:',e)}
  finally{S.refreshing=false}
}

function showGate(kind){
  $('#shell').classList.add('hidden');$('#gate').classList.remove('hidden');$('#userbar').innerHTML='';$('#dock').classList.add('hidden');
  const name=esc(S.settings.site_name||'Bolsa do Autsim'),g=$('#gate');
  if(kind==='login')g.innerHTML=`<div class="floaty" style="font-size:54px">📈</div><h1>${name}</h1><p class="lead">Invista nas moedas dos membros, jogue roleta e foguete com o chat ao vivo, faça apostas entre amigos e suba de nível. Tudo com AutsimCoins, sem dinheiro de verdade.</p>
<div class="panel glow stack"><label class="inline"><input type="checkbox" id="termscheck"> Li e concordo em usar apenas uma conta e aceito os termos da comunidade.</label><button id="login" class="btn-main btn-lg" data-do="login">Entrar com Discord</button><small>Ganhe ${fmt(S.settings.daily_bonus||50,0)} AC de bônus todo dia que entrar.</small></div>`;
  else if(kind==='terms')g.innerHTML=`<h1 style="font-size:clamp(34px,6vw,56px)">Termos da comunidade</h1><p class="lead">Você se compromete a usar apenas uma conta pessoal. Contas duplicadas podem ser bloqueadas pelo ADM.</p><div class="panel stack"><label class="inline"><input type="checkbox" id="accepttermscheck"> Li e aceito os termos (versão autsim-terms-v1).</label><button class="btn-main btn-lg" data-do="accept-terms">Aceitar e continuar</button><button data-do="logout">Sair</button></div>`;
  else if(kind==='profile')g.innerHTML=`<h1 style="font-size:clamp(34px,6vw,56px)">Perfil não encontrado</h1><p class="lead">Sua conta entrou, mas o perfil ainda não foi criado no banco. Confira o trigger de cadastro do Supabase e tente de novo.</p><div class="row" style="justify-content:center"><button class="btn-main" data-do="reload">Tentar de novo</button><button data-do="logout">Sair</button></div>`;
  else if(kind==='denied')g.innerHTML=`<h1 style="font-size:clamp(34px,6vw,56px)">Acesso só para membros</h1><p class="lead">Não encontramos você no servidor do Discord da comunidade. Entre no servidor e tente de novo.</p><button class="btn-main" data-do="login">Entrar de novo</button>`;
  else g.innerHTML=`<div class="muted">Carregando…</div>`;
}
async function guildGate(){
  if(!REQUIRE_GUILD_CHECK)return true;
  const g=await sb.functions.invoke('check-guild-membership');
  if(g.error||!g.data?.is_member){await sb.auth.signOut();S.user=null;showGate('denied');return false}
  return true;
}
async function enter(){
  if(S.booting||!S.user)return;
  if(S.started&&S.startedFor===S.user.id)return;
  S.booting=true;
  try{
    if(!await guildGate())return;
    await fetchCore();
    if(!S.profile){showGate('profile');return}
    if(!S.profile.terms_accepted_at){showGate('terms');return}
    startApp();
  }catch(e){console.error(e);toast('Não foi possível carregar os dados. Recarregue a página.','err',8000)}
  finally{S.booting=false}
}
function startApp(){
  S.started=true;S.startedFor=S.user.id;S.lastLevel=null;S.day=todaySP();
  $('#gate').classList.add('hidden');$('#shell').classList.remove('hidden');
  updateUserbar();renderTicker();render();dockUpdate();
  armMusic();musicLoad();chatStart();
  if(S.profile.last_daily_date!==todaySP())claimDaily(true);
  if(!S.timersOn){S.timersOn=true;
    setInterval(()=>{if(S.user&&!document.hidden)refreshLight()},20000);
    setInterval(()=>{if(!S.user)return;const t=countdownTxt(nextResetMs()),a=$('#dailycd'),b=$('#dailycd2');if(a)a.textContent=t;if(b)b.textContent=t;if(S.day!==todaySP()){S.day=todaySP();claimDaily(true)}},1000);
    setInterval(()=>{if(S.user)musicTick()},4000);
    setInterval(()=>{if(S.user&&!document.hidden)musicLoad()},45000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&S.started)refreshLight()});
  }
}
function teardown(){
  casinoStop();chatStop();musicStop();S.started=false;S.startedFor=null;S.profile=null;S.user=null;ADM.loaded=false;S.tab='inicio';
  showGate('login');
}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-do]');if(!el)return;
  const d=el.dataset,act=d.do;
  try{switch(act){
    case'tab':goTab(d.tab);break;
    case'coin':S.chartAsset=d.id;goTab('graficos');break;
    case'login':{const c=$('#termscheck');if(c&&!c.checked){toast('Marque a caixa para aceitar a regra de uma conta por pessoa.','err');break}
      const{error}=await sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin}});if(error)toast(errMsg(error),'err');break}
    case'logout':await sb.auth.signOut();teardown();break;
    case'reload':location.reload();break;
    case'accept-terms':{if(!$('#accepttermscheck')?.checked){toast('Você precisa aceitar os termos para continuar.','err');break}
      el.disabled=true;const{error}=await sb.rpc('accept_terms',{p_version:'autsim-terms-v1'});el.disabled=false;if(error){toast(errMsg(error),'err');break}
      await fetchCore();if(S.profile?.terms_accepted_at)startApp();break}
    case'refresh':await refreshLight(true);toast('Dados atualizados.');break;
    case'trade':el.disabled=true;try{await trade(d.kind,d.id)}finally{el.disabled=false}break;
    case'claim-daily':await claimDaily(false);break;
    case'buy-item':await buyItem(d.id);break;
    case'edit-coin':editCoinForm(d.id);break;
    case'music-buy':musicBuyModal();break;
    case'music-toggle':musicToggle();break;
    case'music-next':MUS.gesture=true;musicNext();break;
    case'cas-tab':if(d.tab!==CAS.tab){casinoSwitch(d.tab)}break;
    case'chip':{const inp=$('#'+d.for);if(!inp||inp.disabled)break;let v=Number(inp.value)||0;
      if(d.v==='half')v=Math.floor(v/2);else if(d.v==='double')v=v*2;
      else if(d.v==='max'){const mx=Number((d.for==='rlamt'?CAS.rl.st?.max_bet:CAS.rk.st?.max_bet)||500);v=Math.floor(Math.min(mx,Number(me().balance)))}
      else v+=Number(d.v);inp.value=Math.max(1,Math.floor(v));break}
    case'rl-bet':el.disabled=true;await rlBet(d.color);break;
    case'rk-bet':el.disabled=true;await rkBet();el.disabled=false;break;
    case'rk-cash':await rkCash();break;
    case'chat-del':{const{error}=await sb.rpc('admin_delete_chat',{p_id:Number(d.id)});if(error)toast(errMsg(error),'err');break}
    case'pr-new':prNewForm();break;
    case'pr-bet':prBetForm(d.id,d.side);break;
    case'pr-resolve':await prResolve(d.id,d.out);break;
    case'pr-cancel':await prCancel(d.id);break;
    /* painel ADM */
    case'adm-tab':ADM.tab=d.tab;keepInputs(renderView);break;
    case'adm-refresh':await refreshLight(true);await admLoad();toast('Painel atualizado.');break;
    case'adm-set':await admSaveSetting(d.key,d.type);break;
    case'adm-xpcurve':await admSaveXp();break;
    case'adm-clear-chat':if(await confirmBox('Apagar todas as mensagens do chat do cassino?','Apagar tudo')){const{error}=await sb.rpc('admin_clear_chat');if(error)throw error;chatStop();chatStart();toast('Chat limpo.')}break;
    case'adm-adjust':admAdjust(d.id);break;
    case'adm-xp':admXp(d.id);break;
    case'adm-toggle-admin':{const p=profile(d.id);if(await confirmBox(`${p.is_admin?'Tirar':'Dar'} permissão de ADM para ${p.username}?`)){await admRpc('admin_set_admin',{p_user:d.id,p_flag:!p.is_admin},'Permissão alterada.')}break}
    case'adm-coin':admCoinForm(d.id);break;
    case'adm-item-new':admItemForm(null);break;
    case'adm-item-edit':admItemForm(d.id);break;
    case'adm-item-del':if(await confirmBox('Excluir este item da loja? Pedidos já feitos continuam no histórico.','Excluir'))await admRpc('admin_delete_shop_item',{p_id:d.id},'Item excluído.');break;
    case'adm-order-done':await admRpc('admin_set_delivered',{p_id:d.id,p_flag:true},'Pedido marcado como entregue.',false);await admLoad();break;
    case'adm-order-undo':await admRpc('admin_set_delivered',{p_id:d.id,p_flag:false},null,false);await admLoad();break;
    case'adm-mis-new':admMissionForm(null);break;
    case'adm-mis-edit':admMissionForm(d.id);break;
    case'adm-mis-del':if(await confirmBox('Excluir esta missão?','Excluir'))await admRpc('admin_delete_mission',{p_id:d.id},'Missão excluída.');break;
    case'adm-mis-grant':admGrantForm(d.id);break;
    case'adm-music-add':admMusicForm();break;
    case'adm-music-toggle':await admRpc('admin_toggle_music',{p_id:d.id,p_active:d.on==='1'},null,false);await musicLoad();await admLoad();break;
    case'adm-music-del':if(await confirmBox('Remover esta música da playlist?','Remover')){await admRpc('admin_delete_music',{p_id:d.id},'Música removida.',false);await musicLoad();await admLoad()}break;
    case'adm-slot-del':await admRpc('admin_remove_music_slot',{p_id:d.id,p_refund:d.refund==='1'},d.refund==='1'?'Removida e valor devolvido.':'Removida da fila.');await musicLoad();break;
  }}catch(err){toast(errMsg(err),'err');SFX.play('error')}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f&&f.dataset.form==='chat'){e.preventDefault();chatSend()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='chartasset'){S.chartAsset=t.value;drawPrice(t.value);return}
  const pref=t.dataset&&t.dataset.pref;if(!pref)return;
  if(pref==='music'){if(t.checked!==P.music)musicToggle()}
  else if(pref==='sfx'){P.sfx=t.checked;savePrefs();if(P.sfx)SFX.play('coin')}
  else if(pref==='motion'){P.motion=t.checked;savePrefs()}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.pref==='volume')musicSetVolume(Number(e.target.value)/100)});

/* ---------- partida ---------- */
(async()=>{
  FX.init();applySettings();showGate('loading');
  await loadPublicSettings();
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?.user||null,changed=(u&&u.id)!==(S.user&&S.user.id);
    if(!u){if(S.started||ev==='SIGNED_OUT'){teardown()}return}
    S.user=u;if(changed)setTimeout(enter,0);
  });
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){S.user=session.user;await enter()}else showGate('login');
})();


</script>
